<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>测评 · 心镜 SoulMirror</title>
<meta name="description" content="心镜测评中心的通用答题器：恋爱脑浓度、精神状态图鉴、宿舍生存人格等轻量测试。">
<meta property="og:title" content="心镜 SoulMirror · 测评">
<meta property="og:description" content="做一个小测试，看看今天的你是什么状态。">
<meta property="og:image" content="https://soulmirror-255.pages.dev/shareLOGO-icon.png">
<meta property="og:url" content="https://soulmirror-255.pages.dev/quiz.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SoulMirror 心镜">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="apple-touch-icon" href="/assets/logo.png">
<script src="/auth.js"></script>
<script src="/quiz-data.js"></script>
<script src="/qr-code.js"></script>
<style>
  /* 设计基线：与 assess.html 共用同一套色板 / 字体 / 圆角 / 阴影 */
  :root {
    /* 字体（全站共享） */
    --font-serif: -apple-system, 'PingFang SC', 'Songti SC', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
                 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif;

    /* 背景层次（与 match.html / assess.html 对齐） */
    --bg: #0d0710;          /* 与 match.html 统一 */
    --bg-elevated: #1a1122;
    --surface: #1a1122;
    --surface-hover: #22162c;

    /* quiz.html 自定义（向后兼容已有引用） */
    --surface-raised: #22162c;
    --border: #2c2033;
    --border-hover: #3d2d47;

    /* 分割线 */
    --hairline: rgba(255,255,255,0.08);
    --hairline-strong: rgba(255,255,255,0.14);

    /* 文字层次 */
    --text-primary: #f7ede8;
    --text-secondary: #b3a3ae;
    --text-tertiary: #7c6c78;

    /* 强调色 */
    --accent: #dfb6b2;
    --accent-dim: #c9908c;
    --accent-glow: rgba(82,43,91,0.32);
    --accent-soft: rgba(223,182,178,0.1);

    /* quiz.html 自定义 */
    --purple: #522b5b;
    --blue: #854f6c;
    --radius-lg: 20px;
    --radius-sm: 10px;

    /* 兼容别名：全站共享词汇表 */
    --ink: var(--bg);
    --ink-deep: var(--bg-elevated);
    --parchment: var(--text-primary);
    --parchment-dim: var(--text-secondary);
    --rouge: var(--accent);
    --rouge-dim: var(--accent-dim);
    --gold: var(--accent);
    --line: var(--hairline);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(880px 560px at 58% 12%, rgba(223, 182, 178, 0.08), transparent 70%),
      radial-gradient(760px 520px at 82% 62%, rgba(82, 43, 91, 0.14), transparent 74%),
      var(--bg);
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- 顶栏（对齐 seven-sins 账户栏） ---------- */
  .account-bar {
    display: flex;
    justify-content: flex-end;
    padding: 14px 24px 0;
    max-width: 660px;
    margin: 0 auto;
  }
  .account-bar-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12.5px;
    width: 100%;
  }
  .account-bar-logo {
    width: 20px; height: 20px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(223,182,178,.35));
    flex-shrink: 0;
  }
  .nav-home-link {
    font-size: 13px;
    color: var(--text-tertiary);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    transition: color .2s;
  }
  .nav-home-link:hover { color: var(--text-primary); }

  .shell {
    max-width: 660px;
    margin: 0 auto;
    padding: 20px 24px 72px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade { animation: fadeUp .5s cubic-bezier(.16, 1, .3, 1) both; }

  /* ---------- 通用文字 ---------- */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--text-secondary);
    text-transform: uppercase;
    margin-bottom: 18px;
    font-weight: 600;
  }
  .eyebrow::before {
    content: "";
    width: 20px;
    height: 1px;
    background: var(--hairline-strong);
  }

  .hero-title {
    font-size: clamp(36px, 7vw, 56px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.035em;
    margin-bottom: 16px;
    text-wrap: balance;
  }
  .hero-title .accent { color: var(--accent); }

  .hero-subtitle {
    font-size: 19px;
    line-height: 1.55;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: -0.01em;
    margin-bottom: 18px;
    text-wrap: balance;
  }

  .lede {
    font-size: 14.5px;
    line-height: 1.85;
    color: var(--text-secondary);
    max-width: 500px;
  }

  .meta-row {
    display: flex;
    gap: 32px;
    margin: 30px 0 34px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .meta-row strong {
    display: block;
    font-size: 21px;
    line-height: 1.2;
    color: var(--text-primary);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .muted {
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-tertiary);
  }

  /* ---------- 落地页 ---------- */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .chip {
    font-size: 12px;
    line-height: 1;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-secondary);
  }
  .chip.accent {
    border-color: rgba(223, 182, 178, 0.32);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .btn {
    font: inherit;
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--hairline-strong);
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 100px;
    transition: all .2s var(--ease);
    text-align: center;
  }
  .btn:hover { background: var(--surface-hover); border-color: rgba(255,255,255,.24); }
  .btn:active { transform: scale(.98); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a0f18;
    font-weight: 600;
  }
  .btn.primary:hover { background: var(--accent-dim); transform: translateY(-1px) scale(1.01); box-shadow: 0 12px 32px var(--accent-glow); }
  .btn.primary:active { transform: translateY(0) scale(.98); box-shadow: none; }
  .btn.block { display: block; width: 100%; padding: 15px 20px; font-size: 15px; }
  .btn:disabled { opacity: .3; cursor: default; transform: none; box-shadow: none; }

  .resume-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    border: 1px solid var(--hairline-strong);
    background: var(--surface);
    border-radius: 16px;
    padding: 14px 18px;
    margin: 0 0 24px;
  }
  .resume-bar p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0; }
  .resume-bar p strong { color: var(--accent); font-weight: 600; }
  .resume-actions { display: flex; gap: 10px; align-items: center; }
  .link-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 6px 2px;
  }
  .link-btn:hover { color: var(--text-primary); }
  .mini-btn {
    background: var(--accent);
    color: #1a0f18;
    border: none;
    border-radius: 100px;
    padding: 9px 18px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s var(--ease);
  }
  .mini-btn:hover { background: var(--accent-dim); }

  .landing-note {
    margin-top: 22px;
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--text-secondary);
    max-width: 480px;
  }
  .landing-note strong { color: var(--text-primary); font-weight: 600; }

  /* 结果页复用 */
  .resume-note {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .disclaimer {
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--text-tertiary);
    margin-top: 18px;
  }

  .recent {
    margin-top: 28px;
  }
  .recent-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .recent-head h3 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--text-tertiary);
    text-transform: uppercase;
  }
  .recent-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(26, 17, 34, 0.6);
    transition: border-color .2s ease, background .2s ease;
  }
  .recent-item:hover {
    border-color: var(--border-hover);
    background: var(--surface);
  }
  .recent-item strong {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .recent-item span {
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .recent-score {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--accent);
  }

  .disclaimer {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.75;
    color: var(--text-tertiary);
  }

  /* ---------- 答题 ---------- */
  .quiz-progress {
    position: sticky;
    top: 58px;
    z-index: 20;
    padding: 10px 0 14px;
    background: linear-gradient(rgba(21, 16, 25, 0.95), rgba(21, 16, 25, 0.7), transparent);
  }
  .progress-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 8px;
  }
  .progress-meta .pct { color: var(--accent); }
  .progress-track {
    height: 2px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--accent);
    transition: width .35s cubic-bezier(.22, .61, .36, 1);
  }

  .quiz-body { animation: fadeUp .45s cubic-bezier(.16, 1, .3, 1) both; }

  .q-count {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-tertiary);
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 23px;
    line-height: 1.55;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  .q-hint {
    font-size: 12.5px;
    color: var(--text-tertiary);
    margin-bottom: 18px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    width: 100%;
    padding: 18px 20px;
    border-radius: 16px;
    border: 1px solid transparent;
    background: var(--surface);
    color: var(--text-primary);
    font: inherit;
    font-size: 15px;
    line-height: 1.55;
    text-align: left;
    cursor: pointer;
    transition: all .2s cubic-bezier(.16,1,.3,1);
  }
  .option:hover { background: var(--surface-hover); }
  .option:active { transform: scale(0.99); }
  .option.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option .mark {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 1px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    position: relative;
    transition: all .2s cubic-bezier(.16,1,.3,1);
  }
  .option.selected .mark {
    border-color: var(--accent);
    background: var(--accent);
  }
  .option.selected .mark::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%);
  }
  .option .txt { flex: 1; }

  .scale-labels {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .q-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 26px;
  }
  .back-btn {
    font: inherit;
    font-size: 13px;
    color: var(--text-tertiary);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 0;
    transition: color .2s ease;
  }
  .back-btn:hover { color: var(--text-primary); }
  .back-btn:disabled { opacity: 0.3; cursor: default; }
  .next-btn {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 26px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #1a0f18;
    cursor: pointer;
    transition: all .2s ease;
  }
  .next-btn:hover { background: #ecc9c5; border-color: #ecc9c5; }
  .next-btn:disabled { opacity: 0.32; cursor: default; }
  .next-btn:disabled:hover { background: var(--accent); border-color: var(--accent); }

  /* ---------- 结果 ---------- */
  .result-kicker {
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .result-name {
    font-size: clamp(34px, 7vw, 46px);
    line-height: 1.12;
    letter-spacing: -0.04em;
    font-weight: 700;
    margin-bottom: 10px;
    text-wrap: balance;
  }
  .result-tagline {
    font-size: 17px;
    line-height: 1.55;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .result-anti {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-tertiary, #8a7b8f);
    font-style: italic;
    margin: 0 0 16px;
    opacity: .85;
  }
  .quiz-easter {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.9);
    background: rgba(25, 14, 30, .96);
    border: 1px solid rgba(223, 182, 178, .35);
    border-radius: 14px;
    padding: 16px 22px;
    color: #efdcd9;
    font-size: 14px;
    line-height: 1.55;
    max-width: 280px;
    text-align: center;
    z-index: 9999;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
    animation: easterIn .35s ease-out forwards;
  }
  .quiz-easter .easter-close {
    display: block; margin-top: 10px;
    color: var(--accent); font-size: 12px;
    cursor: pointer; background: none; border: 0; padding: 4px;
  }
  @keyframes easterIn {
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .score-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin: 4px 0 18px;
  }
  .score-num {
    font-size: 56px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .score-unit {
    font-size: 16px;
    color: var(--text-secondary);
  }
  .score-label {
    margin-left: 10px;
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .result-card {
    padding: 22px;
    border-radius: var(--radius-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .result-card h3 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 12px;
  }
  .result-card p {
    font-size: 14.5px;
    line-height: 1.85;
    color: var(--text-secondary);
  }
  .result-card .lead {
    color: var(--text-primary);
  }

  .symptom-list, .copy-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .symptom-list li, .copy-list li {
    list-style: none;
    display: flex;
    gap: 10px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .symptom-list li::before {
    content: "";
    flex-shrink: 0;
    width: 5px;
    height: 5px;
    margin-top: 8px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .6;
  }
  .copy-list li::before {
    content: "·";
    flex-shrink: 0;
    color: var(--accent);
  }

  .energy {
    margin-top: 4px;
  }
  .energy-head {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 8px;
  }
  .energy-track {
    height: 8px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    position: relative;
  }
  .energy-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--purple), var(--accent));
  }
  .energy-foot {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-tertiary);
    margin-top: 7px;
  }

  .dim-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
    margin-top: 4px;
  }
  .dim-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 7px;
  }
  .dim-head span:last-child {
    color: var(--text-tertiary);
    flex-shrink: 0;
  }
  .dim-track {
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .dim-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--purple), var(--accent));
  }

  .pair-block {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .pair-row {
    display: flex;
    gap: 10px;
    font-size: 13.5px;
    line-height: 1.65;
  }
  .pair-key {
    flex-shrink: 0;
    width: 76px;
    color: var(--text-tertiary);
  }
  .pair-val { flex: 1; color: var(--text-secondary); }

  .tip-card {
    padding: 20px 22px;
    border-radius: var(--radius-lg);
    background: linear-gradient(160deg, rgba(82, 43, 91, 0.34), rgba(26, 17, 34, 0.9));
    border: 1px solid rgba(223, 182, 178, 0.16);
    margin-bottom: 20px;
  }
  .tip-card p {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text-primary);
  }

  .result-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .result-actions .btn.block { padding: 14px 16px; font-size: 14px; }
  .result-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
  }
  .text-link {
    font: inherit;
    font-size: 13px;
    color: var(--text-tertiary);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 0;
    transition: color .2s ease;
  }
  .text-link:hover { color: var(--text-primary); }

  /* ---------- 分享层 ---------- */
  .share-layer {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(6, 3, 9, 0.68);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .28s ease, visibility .28s;
  }
  .share-layer.is-open { opacity: 1; visibility: visible; }
  .share-card {
    width: min(420px, 100%);
    max-height: 92vh;
    overflow-y: auto;
    padding: 22px;
    border-radius: 22px;
    background: linear-gradient(160deg, #22162c, #150e1b);
    border: 1px solid rgba(223, 182, 178, 0.18);
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
    transform: translateY(12px) scale(0.98);
    transition: transform .3s cubic-bezier(.22, .61, .36, 1);
  }
  .share-layer.is-open .share-card { transform: none; }
  .share-card h3 {
    font-size: 19px;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .share-preview {
    width: 100%;
    display: block;
    border-radius: 14px;
    background: #0d0710;
    margin-bottom: 14px;
  }
  .caption-box {
    width: 100%;
    min-height: 92px;
    padding: 12px 13px;
    margin-bottom: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-secondary);
    font: inherit;
    font-size: 13px;
    line-height: 1.7;
    resize: none;
  }
  .share-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .share-note {
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text-tertiary);
    margin-bottom: 12px;
  }
  .share-close {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 11px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .share-close:hover { border-color: var(--border-hover); color: var(--text-primary); }

  /* ---------- 错误态 ---------- */
  .empty-state {
    padding: 40px 0;
    text-align: center;
  }
  .empty-state h2 { font-size: 24px; margin-bottom: 10px; }
  .empty-state p { color: var(--text-secondary); margin-bottom: 22px; }

  /* ---------- 移动端 ---------- */
  @media (max-width: 640px) {
    .topbar { padding: 14px 16px; }
    .brand { display: none; }
    .shell { padding: 72px 16px 56px; }
    .q-text { font-size: 21px; }
    .option { padding: 15px 16px; font-size: 14.5px; border-radius: 13px; }
    .result-card { padding: 18px; border-radius: 18px; }
    .result-actions { grid-template-columns: 1fr; }
    .share-card { padding: 18px; border-radius: 18px; }
  }

  @media (max-width: 390px) {
    .hero-title { font-size: 32px; }
    .score-num { font-size: 48px; }
    .q-nav { margin-top: 20px; }
  }

  /* ===== 套用 match.html 模板的布局容器 ===== */
  .stage {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
  }
  .hidden { display: none !important; }
  .progress-wrap {
    position: sticky;
    top: 0;
    padding: 18px 0 12px;
    background: linear-gradient(var(--ink, #0f0e0c) 80%, transparent);
    z-index: 10;
  }
  .progress-track {
    height: 1px;
    background: var(--line, rgba(255,255,255,0.12));
    position: relative;
    overflow: visible;
  }
  .progress-fill {
    height: 1px;
    background: var(--rouge, #d14545);
    width: 0%;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: -3px; top: 50%;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rouge, #d14545);
    transform: translateY(-50%);
    box-shadow: 0 0 8px var(--rouge, #d14545);
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--parchment-dim, rgba(255,255,255,0.55));
    margin-top: 10px;
  }
  .progress-meta .section-tag { color: var(--gold, #d4a44a); }
  .landing {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 0 80px;
    animation: fadeUp .8s cubic-bezier(.16,1,.3,1) both;
  }
  .question-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0 60px;
    min-height: 70vh;
  }
  .q-card { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }
  .result-screen {
    flex: 1;
    padding: 40px 0 80px;
    animation: fadeUp .5s cubic-bezier(.16,1,.3,1) both;
  }
</style>
</head>
<body>

<div class="stage">

<div class="account-bar" id="accountBar">
  <div class="account-bar-inner">
    <img class="account-bar-logo" src="/logo-icon.png" alt="SoulMirror">
    <a href="/assess.html" class="nav-home-link" style="margin-right:auto">← 测评中心</a>
    <button class="auth-login-btn">登录</button>
  </div>
</div>

<!-- 进度条（答题时显示） -->
<div class="progress-wrap hidden" id="progressWrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-meta">
    <span class="section-tag" id="sectionTag"></span>
    <span id="progressCount">0 / 0</span>
  </div>
</div>

<!-- 欢迎页 -->
<div class="landing" id="landing"></div>

<!-- 答题页 -->
<div class="question-screen hidden" id="questionScreen">
  <div class="q-card" id="qCard"></div>
</div>

<!-- 结果页 -->
<div class="result-screen hidden" id="resultScreen"></div>

</div>

<div id="shareLayer" class="share-layer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="分享结果">
  <div class="share-card">
    <h3>分享你的结果</h3>
    <img id="sharePreview" class="share-preview" alt="测评结果分享卡">
    <textarea id="captionBox" class="caption-box" readonly></textarea>
    <div class="share-actions">
      <button id="saveImageBtn" class="btn primary" type="button">保存图片</button>
      <button id="copyTextBtn" class="btn" type="button">复制文案</button>
    </div>
    <p class="share-note">分享卡为白底黑码，二维码四周已留出静区。发到群里前，记得把文案里的 @XXX 换成你想艾特的人。</p>
    <button id="shareCloseBtn" class="share-close" type="button">关闭</button>
  </div>
</div>

<script src="/track.js"></script>
<script>
(function () {
  'use strict';

  /* 分享卡二维码：改由 /qr-code.js 按当前 slug 动态生成，不再写死固定码 */

  var landingEl = document.getElementById('landing');
  var questionScreen = document.getElementById('questionScreen');
  var qCard = document.getElementById('qCard');
  var resultScreen = document.getElementById('resultScreen');
  var progressWrap = document.getElementById('progressWrap');
  var progressFill = document.getElementById('progressFill');
  var progressCount = document.getElementById('progressCount');
  var sectionTag = document.getElementById('sectionTag');
  var shareLayer = document.getElementById('shareLayer');
  var sharePreview = document.getElementById('sharePreview');
  var captionBox = document.getElementById('captionBox');
  var saveImageBtn = document.getElementById('saveImageBtn');
  var copyTextBtn = document.getElementById('copyTextBtn');
  var shareCloseBtn = document.getElementById('shareCloseBtn');

  /* 屏切换：只通过 hidden 切换，不销毁 DOM */
  function showScreen(name) {
    landingEl.classList.toggle('hidden', name !== 'landing');
    questionScreen.classList.toggle('hidden', name !== 'question');
    resultScreen.classList.toggle('hidden', name !== 'result');
    progressWrap.classList.toggle('hidden', name !== 'question');
  }

  var PROGRESS_KEY = 'xinjing_quiz_progress_v3_';
  var RESULT_KEY = 'xinjing_quiz_result_v3_';
  var HISTORY_KEY = 'xinjing_quiz_history_v3';

  var state = {
    slug: '',
    bank: null,
    answers: [],
    index: 0,
    finished: false,
    result: null,
    mouthPct: null,
    shareDataUrl: '',
    shareCaption: ''
  };

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&' + 'amp;')
      .replace(/</g, '&' + 'lt;')
      .replace(/>/g, '&' + 'gt;')
      .replace(/"/g, '&' + 'quot;');
  }

  function readJSON(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function writeJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
  }

  function removeKey(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  function track(action, data) {
    try {
      if (typeof window.trackEvent === 'function') window.trackEvent(action, data);
    } catch (e) {}
  }

  function getVisitorToken() {
    try {
      if (typeof window.SMTrack !== 'undefined' && SMTrack.getVisitorToken) {
        return SMTrack.getVisitorToken();
      }
    } catch (e) {}
    return '';
  }

  /* ---------- 计分 ---------- */
  function levelOf(pct) { return pct >= 60 ? '高' : pct >= 35 ? '中' : '低'; }

  function dimsOf(bank, ranked, limit) {
    return ranked.slice(0, limit || 4).map(function (item) {
      var info = (bank.dimensions && bank.dimensions[item.dim]) || {};
      var pct = Math.round(item.percent * 100);
      return {
        key: item.dim,
        name: info.short || info.name || item.dim,
        percent: pct,
        level: levelOf(pct)
      };
    });
  }

  function computeTypeResult(bank) {
    var dims = Object.keys(bank.dimensions || {});
    var raw = {};
    var max = {};
    dims.forEach(function (dim) { raw[dim] = 0; max[dim] = 0; });

    bank.questions.forEach(function (q, qi) {
      dims.forEach(function (dim) {
        var best = 0;
        (q.options || []).forEach(function (opt) {
          var v = opt && opt.v ? Number(opt.v[dim]) || 0 : 0;
          if (v > best) best = v;
        });
        max[dim] += best;
      });
      var chosen = q.options && q.options[state.answers[qi]];
      if (chosen && chosen.v) {
        Object.keys(chosen.v).forEach(function (dim) {
          if (raw[dim] !== undefined) raw[dim] += Number(chosen.v[dim]) || 0;
        });
      }
    });

    var ranked = dims
      .map(function (dim, order) {
        return {
          dim: dim,
          order: order,
          percent: max[dim] ? raw[dim] / max[dim] : 0
        };
      })
      .filter(function (item) { return max[item.dim] > 0; })
      .sort(function (a, b) {
        if (b.percent !== a.percent) return b.percent - a.percent;
        return a.order - b.order;
      });

    var top = ranked[0];
    if (!top) return { key: dims[0] || 'result', name: bank.title, tagline: '', desc: '', percent: 0 };

    var base = bank.dimensions[top.dim] || {};
    var picked = base;
    if (base.high && base.low) {
      picked = top.percent >= 0.5 ? base.high : base.low;
    }

    var result = {
      key: top.dim,
      name: picked.title || picked.name || bank.title,
      category: picked.category || (base.high && base.low ? base.name : ''),
      tagline: picked.tagline || '',
      desc: picked.desc || '',
      strengths: picked.strengths || [],
      growth: picked.growth || [],
      tip: picked.tip || '',
      symptoms: picked.symptoms || [],
      quote: picked.quote || '',
      partner: picked.partner || '',
      highlight: picked.highlight || '',
      minefield: picked.minefield || '',
      bestMatch: picked.bestMatch || '',
      groupLine: picked.groupLine || '',
      energyStable: typeof picked.energyStable === 'number' ? picked.energyStable : null,
      energyDrain: typeof picked.energyDrain === 'number' ? picked.energyDrain : null,
      percent: Math.round(top.percent * 100),
      dims: dimsOf(bank, ranked, 4)
    };
    return result;
  }

  function computeScaleResult(bank) {
    var dims = Object.keys(bank.dimensions || {});
    var raw = {};
    var max = {};
    dims.forEach(function (dim) { raw[dim] = 0; max[dim] = 0; });

    bank.questions.forEach(function (q, qi) {
      var dim = q.dim;
      if (!dim || raw[dim] === undefined) return;
      max[dim] += 5;
      var value = Number(state.answers[qi]);
      if (isNaN(value)) value = 3;
      if (q.reverse) value = 6 - value;
      raw[dim] += value;
    });

    var ranked = dims
      .map(function (dim, order) {
        return { dim: dim, order: order, percent: max[dim] ? raw[dim] / max[dim] : 0 };
      })
      .filter(function (item) { return max[item.dim] > 0; })
      .sort(function (a, b) {
        if (b.percent !== a.percent) return b.percent - a.percent;
        return a.order - b.order;
      });

    var top = ranked[0];
    if (!top) return { key: dims[0] || 'result', name: bank.title, tagline: '', desc: '', percent: 0 };

    var base = bank.dimensions[top.dim] || {};
    var picked = base;
    if (base.high && base.low) {
      picked = top.percent >= 0.5 ? base.high : base.low;
    }

    return {
      key: top.dim,
      name: picked.title || picked.name || bank.title,
      category: picked.category || (base.high && base.low ? base.name : ''),
      tagline: picked.tagline || '',
      desc: picked.desc || '',
      strengths: picked.strengths || [],
      growth: picked.growth || [],
      tip: picked.tip || '',
      percent: Math.round(top.percent * 100),
      dims: dimsOf(bank, ranked, 4)
    };
  }

  function computeScoreResult(bank) {
    var total = 0;
    var max = 0;
    var mouth = 0;
    var mouthMax = 0;

    bank.questions.forEach(function (q, qi) {
      var options = q.options || [];
      var bestP = 0;
      var bestM = 0;
      options.forEach(function (opt) {
        var p = Number(opt.p) || 0;
        var m = Number(opt.m) || 0;
        if (p > bestP) bestP = p;
        if (m > bestM) bestM = m;
      });
      max += bestP;
      mouthMax += bestM;
      var chosen = options[state.answers[qi]];
      if (chosen) {
        total += Number(chosen.p) || 0;
        mouth += Number(chosen.m) || 0;
      }
    });

    var percent = max ? Math.round(total / max * 100) : 0;
    var mouthPct = mouthMax ? Math.round(mouth / mouthMax * 100) : 0;
    var bands = bank.bands || [];
    var band = bands[bands.length - 1] || {};
    for (var i = 0; i < bands.length; i += 1) {
      if (percent <= bands[i].max) { band = bands[i]; break; }
    }

    state.mouthPct = mouthPct;

    var bandDims = [
      { key: 'heat', name: '上头指数', percent: percent, level: levelOf(percent) },
      { key: 'mouth', name: '嘴硬指数', percent: mouthPct, level: levelOf(mouthPct) },
      { key: 'sanity', name: '理智余额', percent: Math.max(0, 100 - percent), level: levelOf(Math.max(0, 100 - percent)) }
    ];

    return {
      key: 'band-' + percent,
      name: band.name || bank.title,
      category: bank.scoreLabel || '',
      tagline: band.tagline || '',
      desc: band.desc || '',
      strengths: band.strengths || [],
      growth: band.growth || [],
      tip: band.tip || '',
      symptoms: band.symptoms || [],
      quote: band.quote || '',
      antiTagline: band.antiTagline || '',
      percent: percent,
      mouthPct: mouthPct,
      partner: band.partner || '',
      clash: band.clash || '',
      dims: bandDims
    };
  }

  function computeResult() {
    if (state.bank.mode === 'score') return computeScoreResult(state.bank);
    if (state.bank.mode === 'scale') return computeScaleResult(state.bank);
    return computeTypeResult(state.bank);
  }

  /* ---------- 本地记录 ---------- */
  function saveHistory(result) {
    var list = readJSON(HISTORY_KEY);
    if (!Array.isArray(list)) list = [];
    list.unshift({
      slug: state.slug,
      title: state.bank.title,
      resultName: result.name,
      score: result.percent,
      createdAt: Date.now()
    });
    writeJSON(HISTORY_KEY, list.slice(0, 20));
  }

  function getRecent() {
    var list = readJSON(HISTORY_KEY);
    if (!Array.isArray(list)) return [];
    var seen = {};
    return list.filter(function (item) {
      if (!item || !item.slug || seen[item.slug]) return false;
      seen[item.slug] = true;
      return true;
    }).slice(0, 4);
  }

  function saveServerResult(result) {
    if (!state.bank) return;
    var payload = {
      slug: state.slug,
      quizTitle: String(state.bank.title || '').slice(0, 80),
      resultKey: String(result.key || '').slice(0, 80),
      resultName: String(result.name || '').slice(0, 80),
      score: Number(result.percent) || 0,
      mouthScore: result.mouthPct === null || result.mouthPct === undefined ? null : Number(result.mouthPct),
      visitorToken: getVisitorToken()
    };
    try {
      fetch('/api/quiz-result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(payload)
      }).catch(function () {});
    } catch (e) {}
  }

  /* ---------- 落地页 ---------- */
  function titleWithAccent(title) {
    var t = String(title || '');
    if (t.indexOf('|') >= 0) {
      var parts = t.split('|');
      return esc(parts[0]) + '<span class="accent">' + esc(parts.slice(1).join('|')) + '</span>';
    }
    var len = t.length;
    if (len <= 3) return esc(t);
    var split = Math.max(1, Math.ceil(len / 2));
    return esc(t.slice(0, split)) + '<span class="accent">' + esc(t.slice(split)) + '</span>';
  }

  function estimateMinutes(bank) {
    var m = (bank.meta || '').match(/(\d+)\s*分钟/);
    if (m) return m[1];
    var n = bank.questions ? bank.questions.length : 0;
    return Math.max(1, Math.ceil(n * 0.4));
  }

  function countDimensions(bank) {
    if (bank.dimensions) return Object.keys(bank.dimensions).length;
    if (bank.dims) return Object.keys(bank.dims).length;
    if (bank.bands) return bank.bands.length;
    return 0;
  }

  function renderLanding() {
    var bank = state.bank;
    var progress = readJSON(PROGRESS_KEY + state.slug);
    var recent = getRecent();

    var qCount = bank.questions ? bank.questions.length : 0;
    var minutes = estimateMinutes(bank);
    var dimCount = countDimensions(bank);

    var recentHtml = '';
    if (recent.length) {
      recentHtml = '<section class="recent"><div class="recent-head"><h3>本机最近测过</h3></div>' +
        recent.map(function (item) {
          return '<a class="recent-item" href="/quiz.html?slug=' + encodeURIComponent(item.slug) + '">' +
            '<div><strong>' + esc(item.title) + '</strong><span>' + esc(item.resultName || '已完成') + '</span></div>' +
            '<span class="recent-score">' + (item.score === null || item.score === undefined ? '' : esc(item.score) + '%') + '</span>' +
          '</a>';
        }).join('') + '</section>';
    }

    var hasProgress = progress && progress.answers && progress.answers.length > 0;
    var answeredCount = hasProgress ? progress.answers.filter(function (a) { return a !== null && a !== undefined; }).length : 0;

    var resumeHtml = '';
    if (hasProgress) {
      resumeHtml =
        '<div class="resume-bar">' +
          '<p>上次答到 <strong>第 ' + Math.min((progress.index || 0) + 1, qCount) + ' 题</strong>（已答 ' + answeredCount + ' / ' + qCount + '），进度已保存在本机。</p>' +
          '<div class="resume-actions">' +
            '<button class="link-btn" type="button" id="restartBtn">重新开始</button>' +
            '<button class="mini-btn" type="button" id="resumeBtn">继续作答</button>' +
          '</div>' +
        '</div>';
    }

    landingEl.innerHTML =
      '<div class="fade">' +
        '<div class="eyebrow">' + esc(bank.cat || 'SoulMirror · 测评') + '</div>' +
        '<h1 class="hero-title">' + titleWithAccent(bank.title) + '</h1>' +
        '<p class="hero-subtitle">' + esc(bank.subtitle || bank.sub || '') + '</p>' +
        '<p class="lede">' + esc(bank.intro || bank.desc || '') + '</p>' +
        '<div class="meta-row">' +
          '<div><strong>' + qCount + '</strong>道题</div>' +
          '<div><strong>' + minutes + '</strong>分钟</div>' +
          (dimCount ? '<div><strong>' + dimCount + '</strong>维剖面</div>' : '') +
        '</div>' +
        resumeHtml +
        '<button class="btn primary" type="button" id="startBtn" style="align-self:flex-start;">' +
          (hasProgress ? '继续测评 →' : '开始测评 →') +
        '</button>' +
        '<p class="landing-note">' +
          '本测试为娱乐与自我探索用途，<strong>不构成心理诊断或医疗建议</strong>。结果只描述倾向，不是对你的定义。' +
          '如果你近期持续感到困扰，建议和信任的人聊聊，或联系学校心理老师。' +
        '</p>' +
        recentHtml +
      '</div>';

    showScreen('landing');
    var startBtn = document.getElementById('startBtn');
    if (startBtn) startBtn.addEventListener('click', startQuiz);
    var resumeBtn = document.getElementById('resumeBtn');
    if (resumeBtn) resumeBtn.addEventListener('click', startQuiz);
    var restartBtn = document.getElementById('restartBtn');
    if (restartBtn) restartBtn.addEventListener('click', function () {
      removeKey(PROGRESS_KEY + state.slug);
      startQuiz();
    });
  }

  /* ---------- 答题 ---------- */
  function startQuiz() {
    var bank = state.bank;
    var progress = readJSON(PROGRESS_KEY + state.slug);
    var recovered = false;
    if (progress && Array.isArray(progress.answers) && progress.answers.length === bank.questions.length) {
      state.answers = progress.answers.slice();
      state.index = Math.min(Math.max(progress.index || 0, 0), bank.questions.length - 1);
      recovered = true;
    } else {
      state.answers = new Array(bank.questions.length).fill(null);
      state.index = 0;
    }
    state.finished = false;
    state.result = null;
    state._easter7shown = false;
    state._easterHalfShown = false;
    state._hotStreak = 0;
    state._stung = false;
    if (recovered) {
      if (state.index >= 6) { state._easterHalfShown = true; }
    }
    track('quiz_start', { quiz_type: state.slug });
    renderQuestion();
  }

  function saveProgress() {
    writeJSON(PROGRESS_KEY + state.slug, {
      answers: state.answers,
      index: state.index
    });
  }

  /* 选完自动跳下一题：保留 260ms 选中反馈，期间忽略重复点击 */
  var advanceTimer = null;
  var ADVANCE_DELAY = 260;

  function clearAdvance() {
    if (advanceTimer) {
      clearTimeout(advanceTimer);
      advanceTimer = null;
    }
  }

  function goNext() {
    if (state.answers[state.index] === null || state.answers[state.index] === undefined) return;
    if (state.index < state.bank.questions.length - 1) {
      // --- 答题进度彩蛋：state.index === 5 是 Q6/12 刚答完（0-based），12 题答了 6 题刚好一半
      if (state.index === 5 && !state._easterHalfShown) {
        state._easterHalfShown = true;
        showEaster('已经答了一半啦 · 这题故意没设陷阱，放心选 🫣');
      }
      state.index += 1;
      saveProgress();
      renderQuestion();
      return;
    }
    finishQuiz();
  }

  function renderQuestion() {
    clearAdvance();
    var bank = state.bank;
    var index = state.index;
    var total = bank.questions.length;
    var question = bank.questions[index];
    var answered = state.answers[index];
    var pct = Math.round((index + 1) / total * 100);

    var bodyHtml = '';
    if (bank.mode === 'scale') {
      var scale = bank.scale || ['非常不符合', '比较不符合', '一般', '比较符合', '非常符合'];
      bodyHtml = '<div class="options">' +
        scale.map(function (label, i) {
          return '<button class="option' + (answered === i + 1 ? ' selected' : '') + '" type="button" data-value="' + (i + 1) + '">' +
            '<span class="mark"></span><span class="txt">' + esc(label) + '</span></button>';
        }).join('') + '</div>';
    } else {
      bodyHtml = '<div class="options">' +
        (question.options || []).map(function (opt, i) {
          return '<button class="option' + (answered === i ? ' selected' : '') + '" type="button" data-index="' + i + '">' +
            '<span class="mark"></span><span class="txt">' + esc(opt.t || opt.text || '') + '</span></button>';
        }).join('') + '</div>';
    }

    /* 更新静态进度条 */
    progressFill.style.width = pct + '%';
    progressCount.textContent = (index + 1) + ' / ' + total;
    if (sectionTag) sectionTag.textContent = bank.title || '';

    qCard.innerHTML =
      '<div class="quiz-body">' +
        '<div class="q-count">Q ' + (index + 1) + ' / ' + total + '</div>' +
        '<h2 class="q-text">' + esc(question.text || '') + '</h2>' +
        '<p class="q-hint">' + (bank.mode === 'scale' ? '按最近大多数时候的状态选择' : '选更接近你第一反应的那一个') + '</p>' +
        bodyHtml +
        '<div class="q-nav">' +
          '<button id="backBtn" class="back-btn" type="button"' + (index === 0 ? ' disabled' : '') + '>← 上一题</button>' +
          '<button id="nextBtn" class="next-btn" type="button"' + (answered === null || answered === undefined ? ' disabled' : '') + '>' +
            (index === total - 1 ? '看结果' : '下一题') +
          '</button>' +
        '</div>' +
      '</div>';

    showScreen('question');

    var optionEls = questionScreen.querySelectorAll('.option');
    for (var i = 0; i < optionEls.length; i += 1) {
      optionEls[i].addEventListener('click', onSelectOption);
    }

    var backBtn = document.getElementById('backBtn');
    var nextBtn = document.getElementById('nextBtn');
    if (backBtn) backBtn.addEventListener('click', onBack);
    if (nextBtn) nextBtn.addEventListener('click', onNext);
  }

  function showEaster(msg) {
    var old = document.querySelector('.quiz-easter');
    if (old) old.remove();
    var div = document.createElement('div');
    div.className = 'quiz-easter';
    div.innerHTML = '<div>' + esc(msg) + '</div>' +
      '<button class="easter-close" type="button">好的，继续 →</button>';
    document.body.appendChild(div);
    var close = div.querySelector('.easter-close');
    if (close) close.addEventListener('click', function () { div.remove(); });
    setTimeout(function () { if (div.parentNode) div.remove(); }, 4500);
  }

  function onSelectOption(e) {
    if (advanceTimer) return; // 自动切题进行中：忽略重复/连点
    var el = e.currentTarget;
    var value;
    if (el.hasAttribute('data-index')) {
      value = Number(el.getAttribute('data-index'));
    } else {
      // scale 模式直接存 1–5，与计分逻辑保持一致
      value = Number(el.getAttribute('data-value'));
    }
    state.answers[state.index] = value;
    saveProgress();

    // --- 恋爱脑连选 3 次最上头整蛊 ---
    if (state.bank.id === 'lovebrain-level') {
      var opts = state.bank.questions[state.index].options || [];
      var hottest = opts.length - 1;
      if (value === hottest) {
        state._hotStreak = (state._hotStreak || 0) + 1;
        if (state._hotStreak === 3 && !state._stung) {
          state._stung = true;
          showEaster('别慌，我们这题故意设了陷阱题——你发现了吗？👀 （开玩笑的，没有陷阱，你就是上头了）');
        }
      } else {
        state._hotStreak = 0;
      }
    }

    var options = questionScreen.querySelectorAll('.option');
    for (var i = 0; i < options.length; i += 1) {
      options[i].classList.remove('selected');
    }
    el.classList.add('selected');

    var nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.disabled = false;

    // 自动进入下一题（最后一题则直接出结果）
    clearAdvance();
    advanceTimer = setTimeout(function () {
      advanceTimer = null;
      goNext();
    }, ADVANCE_DELAY);
  }

  function onBack() {
    clearAdvance();
    if (state.index <= 0) return;
    state.index -= 1;
    saveProgress();
    renderQuestion();
  }

  function onNext() {
    clearAdvance();
    goNext();
  }

  function finishQuiz() {
    state.finished = true;
    var result = computeResult();
    state.result = result;

    removeKey(PROGRESS_KEY + state.slug);
    writeJSON(RESULT_KEY + state.slug, {
      result: result,
      savedAt: Date.now()
    });
    saveHistory(result);
    saveServerResult(result);

    track('quiz_complete', { quiz_type: state.slug, result_type: String(result.key || '') });
    track('quiz_view_result', { quiz_type: state.slug, result_type: String(result.key || '') });

    renderResult(result, false);
  }

  /* ---------- 结果页 ---------- */
  function listHtml(items) {
    return items.map(function (item) {
      return '<li>' + esc(item) + '</li>';
    }).join('');
  }

  function pairRow(key, value) {
    if (!value) return '';
    return '<div class="pair-row"><span class="pair-key">' + esc(key) + '</span><span class="pair-val">' + esc(value) + '</span></div>';
  }

  // 具体表现里兜底的那一条：跟着答案/副维度变化
  function mixLine(bank, result) {
    if (bank.mode === 'score') {
      var m = Number(result.mouthPct) || 0;
      if (m >= 70) return '嘴硬指数 ' + m + '%：嘴上说“无所谓”，手指已经在刷新 TA 的主页。';
      if (m >= 40) return '嘴硬指数 ' + m + '%：会先装淡定，撑不住的时候才承认在意。';
      return '嘴硬指数 ' + m + '%：喜欢就说喜欢，不太需要靠猜。';
    }
    var second = (result.dims || [])[1];
    if (!second) return '';
    if (second.percent >= 60) return '副维度「' + second.name + '」也拉满（' + second.percent + '%）：两套模式同时开着，具体表现会随场合切换。';
    if (second.percent >= 35) return '副维度「' + second.name + '」还有 ' + second.percent + '%：关键时刻会从主模式切到它。';
    return '副维度「' + second.name + '」只有 ' + second.percent + '%：这部分你基本不营业。';
  }

  function clashLine(bank, result) {
    if (result.clash) return result.clash;
    var list = (result.dims || []).slice().sort(function (a, b) { return a.percent - b.percent; });
    var low = list[0];
    if (!low) return '';
    return '和「' + low.name + '」浓度拉满的人长期同处，你会持续掉电——不是你不行，是配比不对。';
  }

  function renderResult(result, restored) {
    var bank = state.bank;
    var isScore = bank.mode === 'score';
    var growthLabel = isScore ? '给你的急救包' : (bank.id === 'dorm-persona' ? '相处提醒' : '可以练习的');
    var percent = Number(result.percent) || 0;

    var scoreHtml = '';
    if (isScore) {
      scoreHtml = '<div class="score-line">' +
        '<span class="score-num">' + percent + '</span>' +
        '<span class="score-unit">' + esc(bank.scoreUnit || '%') + '</span>' +
        '<span class="score-label">' + esc(bank.scoreLabel || '') + '</span>' +
      '</div>';
    }

    var symptomsHtml = '';
    var symptoms = (result.symptoms || []).slice();
    var mix = mixLine(bank, result);
    if (mix) symptoms.push(mix);
    if (symptoms.length) {
      symptomsHtml = '<div class="result-card"><h3>具体表现</h3>' +
        '<ul class="symptom-list">' + listHtml(symptoms) + '</ul></div>';
    }

    var dimsHtml = '';
    if (result.dims && result.dims.length) {
      dimsHtml = '<div class="result-card"><h3>维度拆解</h3><div class="dim-list">' +
        result.dims.map(function (d) {
          return '<div class="dim-row">' +
            '<div class="dim-head"><span>' + esc(d.name) + '</span><span>' + d.percent + '% · ' + esc(d.level) + '</span></div>' +
            '<div class="dim-track"><div class="dim-fill" style="width:' + d.percent + '%"></div></div>' +
          '</div>';
        }).join('') + '</div></div>';
    }

    var energyHtml = '';
    if (typeof result.energyStable === 'number') {
      var stable = Math.max(0, Math.min(100, result.energyStable));
      energyHtml = '<div class="result-card"><h3>今日电量</h3>' +
        '<div class="energy">' +
          '<div class="energy-head"><span>稳定输出</span><span>' + stable + '%</span></div>' +
          '<div class="energy-track"><div class="energy-fill" style="width:' + stable + '%"></div></div>' +
          '<div class="energy-foot"><span>省电待机</span><span>低电量预警</span></div>' +
        '</div></div>';
    }

    var strengthsHtml = '';
    if (result.strengths && result.strengths.length) {
      strengthsHtml = '<div class="result-card"><h3>你的优势</h3>' +
        '<ul class="copy-list">' + listHtml(result.strengths) + '</ul></div>';
    }

    var growthHtml = '';
    if (result.growth && result.growth.length) {
      growthHtml = '<div class="result-card"><h3>' + esc(growthLabel) + '</h3>' +
        '<ul class="copy-list">' + listHtml(result.growth) + '</ul></div>';
    }

    var pairHtml = '';
    var pairParts = '';
    if (result.highlight) pairParts += pairRow('高光时刻', result.highlight);
    if (result.minefield) pairParts += pairRow('你的雷区', result.minefield);
    if (result.bestMatch) pairParts += pairRow('最佳搭子', result.bestMatch);
    if (result.partner && !result.bestMatch) pairParts += pairRow('适合相处', result.partner);
    var clash = clashLine(bank, result);
    if (clash) pairParts += pairRow('容易崩的搭子', clash);
    if (result.groupLine) pairParts += pairRow('群聊宣言', result.groupLine);
    if (pairParts) {
      pairHtml = '<div class="result-card"><h3>相性说明书</h3><div class="pair-block">' + pairParts + '</div></div>';
    }

    var mouthHtml = '';
    if (!isScore && result.mouthPct !== null && result.mouthPct !== undefined) {
      var mouth = Number(result.mouthPct) || 0;
      mouthHtml = '<div class="result-card"><h3>附加指标</h3>' +
        '<div class="energy-head"><span>嘴硬指数</span><span>' + mouth + '%</span></div>' +
        '<div class="energy-track"><div class="energy-fill" style="width:' + mouth + '%"></div></div>' +
        '<p class="muted" style="margin-top:10px;">' + (mouth >= 70 ? '嘴上说没事，身体很诚实。' : mouth >= 40 ? '偶尔嘴硬，但关键时刻还是会说实话。' : '你的嘴和心基本在同一频道。') + '</p>' +
      '</div>';
    }

    var quoteHtml = result.quote
      ? '<div class="tip-card"><p>「' + esc(result.quote) + '」</p></div>'
      : '';

    var tipHtml = result.tip
      ? '<div class="result-card"><h3>写在最后</h3><p>' + esc(result.tip) + '</p></div>'
      : '';

    resultScreen.innerHTML =
      '<div class="fade">' +
        (restored ? '<div class="resume-note">这是你上次测出的结果</div>' : '') +
        '<div class="result-kicker">' + esc(bank.title) + (result.category ? ' · ' + esc(result.category) : '') + '</div>' +
        '<h1 class="result-name">' + esc(result.name) + '</h1>' +
        '<p class="result-tagline">' + esc(result.tagline) + '</p>' +
        (result.antiTagline ? '<p class="result-anti">' + esc(result.antiTagline) + '</p>' : '') +
        scoreHtml +
        '<div class="result-card"><p class="lead">' + esc(result.desc) + '</p></div>' +
        dimsHtml +
        symptomsHtml +
        energyHtml +
        mouthHtml +
        pairHtml +
        strengthsHtml +
        growthHtml +
        quoteHtml +
        tipHtml +
        '<div class="result-actions">' +
          '<button id="shareBtn" class="btn primary block" type="button">生成分享卡</button>' +
          '<button id="copyBtn" class="btn block" type="button">复制分享文案</button>' +
        '</div>' +
        '<div class="result-foot">' +
          '<a class="text-link" href="/assess.html">回测评中心</a>' +
          '<button id="retakeBtn" class="text-link" type="button">再测一次</button>' +
        '</div>' +
        '<p class="disclaimer">纯属娱乐，非医学诊断。结果只描述最近的状态，不构成任何医学或心理诊断；转发时可以只分享结果，不必带上你的答案。</p>' +
      '</div>';

    showScreen('result');

    document.getElementById('shareBtn').addEventListener('click', function () {
      generateShareCard(result);
    });
    document.getElementById('copyBtn').addEventListener('click', function () {
      var caption = buildCaption(result);
      copyText(caption);
      var btn = document.getElementById('copyBtn');
      if (btn) {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制分享文案'; }, 1600);
      }
    });
    document.getElementById('retakeBtn').addEventListener('click', function () {
      removeKey(RESULT_KEY + state.slug);
      resetAndStart();
    });
  }

  function resetAndStart() {
    writeJSON(PROGRESS_KEY + state.slug, {
      answers: new Array(state.bank.questions.length).fill(null),
      index: 0
    });
    startQuiz();
  }

  /* ---------- 分享 ---------- */
  // 分享图二维码指向当前测评的可访问地址（同源域名，线上 /quiz?slug= 实测 200）
  function shareUrl() {
    return location.origin + '/quiz?slug=' + encodeURIComponent(state.slug);
  }

  // 分享卡品牌区：优先用 logo 图片（白色透明底，适配深色卡面），失败时退回文字
  function drawShareBrand(ctx, brand) {
    var iconH = 42;
    var top = 40;
    ctx.textAlign = 'left';
    if (brand && brand.icon) {
      var iconW = Math.round(iconH * brand.icon.width / brand.icon.height);
      ctx.drawImage(brand.icon, 52, top, iconW, iconH);
      var x = 52 + iconW + 18;
      if (brand.text) {
        var textH = 15;
        var textW = Math.round(textH * brand.text.width / brand.text.height);
        ctx.drawImage(brand.text, x, top + (iconH - textH) / 2, textW, textH);
        x += textW + 10;
      }
      ctx.fillStyle = 'rgba(247,237,232,0.42)';
      ctx.font = '15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('· 测评', x, top + 34);
    } else {
      ctx.fillStyle = '#f7ede8';
      ctx.font = '600 24px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('SOULMIRROR', 52, top + 34);
    }
  }

  function buildCaption(result) {
    var template = (state.bank.share && state.bank.share.caption) || '我的{name}结果：{tagline}';
    return template
      .replace(/{name}/g, result.name || '')
      .replace(/{tagline}/g, result.tagline || '')
      .replace(/{score}/g, String(result.percent === null || result.percent === undefined ? '' : result.percent))
      .replace(/{mouth}/g, String(result.mouthPct === null || result.mouthPct === undefined ? '' : result.mouthPct))
      + '\n' + shareUrl();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function wrapText(ctx, text, maxWidth, maxLines) {
    var chars = String(text || '').split('');
    var lines = [];
    var line = '';
    for (var i = 0; i < chars.length; i += 1) {
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = chars[i];
        if (maxLines && lines.length >= maxLines - 1) {
          while (i < chars.length - 1) {
            line += chars[i + 1];
            i += 1;
          }
          break;
        }
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function generateShareCard(result) {
    var bank = state.bank;
    var W = 750;
    var H = 1000;
    var canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');

    // 品牌 logo：同源预加载（不污染 canvas），落定后再出图；失败降级为文字
    var brand = { icon: null, text: null };
    var pending = 2;
    var painted = false;
    function startPaint() {
      if (painted || pending > 0) return;
      painted = true;
      paint();
    }
    function loadLogo(key, src) {
      var img = new Image();
      img.onload = function () { brand[key] = img; pending -= 1; startPaint(); };
      img.onerror = function () { pending -= 1; startPaint(); };
      img.src = src;
    }
    loadLogo('icon', '/logo-icon.png');
    loadLogo('text', '/logo-text.png');
    setTimeout(function () { if (!painted) { painted = true; paint(); } }, 800);

    function paint() {
    // 背景与光晕
    var bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#1c1224');
    bg.addColorStop(0.55, '#140c1a');
    bg.addColorStop(1, '#0d0710');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var glow = ctx.createRadialGradient(200, -80, 20, 200, -80, 520);
    glow.addColorStop(0, 'rgba(223,182,178,0.20)');
    glow.addColorStop(1, 'rgba(223,182,178,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, 520);

    // 品牌（图片 logo）
    drawShareBrand(ctx, brand);

    // 小标题
    ctx.fillStyle = 'rgba(223,182,178,0.82)';
    ctx.font = '13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(bank.cat || '测评', 56, 150);
    ctx.fillStyle = 'rgba(247,237,232,0.38)';
    ctx.fillText(bank.title, 56, 176);

    // 结果名（自动缩放）
    var name = String(result.name || '');
    var nameSize = name.length <= 6 ? 88 : name.length <= 10 ? 72 : 58;
    ctx.fillStyle = '#f7ede8';
    ctx.font = '700 ' + nameSize + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    var nameLines = wrapText(ctx, name, 620, 2);
    var nameY = 300;
    nameLines.forEach(function (line) {
      ctx.fillText(line, 56, nameY);
      nameY += nameSize * 1.15;
    });

    // 分数
    if (bank.mode === 'score') {
      ctx.fillStyle = '#dfb6b2';
      ctx.font = '700 52px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText(String(result.percent) + (bank.scoreUnit || '%'), 56, nameY + 30);
      ctx.fillStyle = 'rgba(247,237,232,0.6)';
      ctx.font = '16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText(bank.scoreLabel || '', 56, nameY + 58);
      nameY += 96;
    }

    // tagline
    ctx.fillStyle = 'rgba(223,182,178,0.92)';
    ctx.font = '26px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    var tagLines = wrapText(ctx, result.tagline, 630, 2);
    var tagY = nameY + 24;
    tagLines.forEach(function (line) {
      ctx.fillText(line, 56, tagY);
      tagY += 37;
    });

    // 描述
    ctx.fillStyle = 'rgba(247,237,232,0.62)';
    ctx.font = '19px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    var descLines = wrapText(ctx, result.desc, 620, 2);
    var descY = tagY + 34;
    descLines.forEach(function (line) {
      ctx.fillText(line, 56, descY);
      descY += 31;
    });

    // 关键词卡片
    var chips = [];
    if (result.symptoms && result.symptoms.length) chips = result.symptoms.slice(0, 3);
    else if (result.strengths && result.strengths.length) chips = result.strengths.slice(0, 3);
    var cardY = 640;
    if (chips.length) {
      ctx.fillStyle = 'rgba(255,255,255,0.045)';
      roundRect(ctx, 40, cardY, W - 80, 104, 18);
      ctx.fill();
      ctx.strokeStyle = 'rgba(223,182,178,0.16)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = '#dfb6b2';
      ctx.font = '600 14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('状态关键词', 64, cardY + 32);
      ctx.fillStyle = 'rgba(247,237,232,0.82)';
      ctx.font = '17px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      var chipLine = chips.join('  ·  ');
      var chipLines = wrapText(ctx, chipLine, 600, 2);
      var chipY = cardY + 64;
      chipLines.forEach(function (line) {
        ctx.fillText(line, 64, chipY);
        chipY += 27;
      });
    }

    // 页脚
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(247,237,232,0.34)';
    ctx.font = '15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('SOULMIRROR · 看见自己，也看见彼此', W / 2, 928);
    ctx.fillStyle = 'rgba(247,237,232,0.34)';
    ctx.font = '13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('纯属娱乐 · 非医学诊断', W / 2, 952);

    // 二维码：按当前测评的页面地址动态生成（白底黑码，静区 4 模块）
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, 540, 750, 164, 164, 14);
    ctx.fill();
    if (window.SMQR) {
      SMQR.draw(ctx, shareUrl(), 540, 750, 164, { margin: 4, light: '#ffffff', dark: '#101010' });
    }

    var dataUrl = canvas.toDataURL('image/png');
    state.shareDataUrl = dataUrl;
    var caption = buildCaption(result);
    state.shareCaption = caption;
    showShareLayer(dataUrl, caption);
    track('share', { quiz_type: state.slug, share_type: 'card' });
    }

    // 兜底：极端情况下（logo 迟迟未响应）也要出图，品牌区自动回退为文字
  }


  function showShareLayer(dataUrl, caption) {
    if (dataUrl) sharePreview.src = dataUrl;
    else if (state.shareDataUrl) sharePreview.src = state.shareDataUrl;
    captionBox.value = caption || '';
    shareLayer.classList.add('is-open');
    shareLayer.setAttribute('aria-hidden', 'false');
  }

  function hideShareLayer() {
    shareLayer.classList.remove('is-open');
    shareLayer.setAttribute('aria-hidden', 'true');
  }

  function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function () {});
        return;
      }
    } catch (e) {}
    try {
      captionBox.value = text;
      captionBox.select();
      document.execCommand('copy');
    } catch (e) {}
  }

  saveImageBtn.addEventListener('click', function () {
    if (!state.shareDataUrl) return;
    var link = document.createElement('a');
    link.href = state.shareDataUrl;
    link.download = '心镜-' + state.bank.title + '.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  copyTextBtn.addEventListener('click', function () {
    copyText(captionBox.value || state.shareCaption);
    copyTextBtn.textContent = '已复制';
    setTimeout(function () { copyTextBtn.textContent = '复制文案'; }, 1600);
    track('share', { quiz_type: state.slug, share_type: 'caption' });
  });

  shareCloseBtn.addEventListener('click', hideShareLayer);
  shareLayer.addEventListener('click', function (e) {
    if (e.target === shareLayer) hideShareLayer();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') hideShareLayer();
  });

  /* ---------- 初始化 ---------- */
  function renderMissing() {
    landingEl.innerHTML =
      '<div class="empty-state fade">' +
        '<h2>没有找到这个测试</h2>' +
        '<p>链接可能写错了，或者这个测试还没有上线。</p>' +
        '<a class="btn primary" href="/assess.html" style="display:inline-block;">回测评中心</a>' +
      '</div>';
    showScreen('landing');
  }

  function init() {
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug') || params.get('id') || '';

    if (!slug || !window.QUIZ_BANK || !window.QUIZ_BANK[slug]) {
      renderMissing();
      return;
    }

    state.slug = slug;
    state.bank = window.QUIZ_BANK[slug];
    document.title = state.bank.title + ' · 心镜 SoulMirror';

    // ?reset=1 清掉本地进度和结果缓存
    if (params.get('reset') === '1') {
      removeKey(PROGRESS_KEY + slug);
      removeKey(RESULT_KEY + slug);
    }

    var saved = readJSON(RESULT_KEY + slug);
    if (saved && saved.result) {
      state.result = saved.result;
      state.mouthPct = saved.result.mouthPct;
      renderResult(saved.result, true);
      return;
    }

    renderLanding();
  }

  init();
})();
</script>
</body>
</html>
