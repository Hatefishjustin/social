<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>登录 - 心镜 · 社交</title>
<style>
:root {
  --bg: #000;
  --surface: #111114;
  --border: rgba(255,255,255,.06);
  --text: rgba(255,255,255,.94);
  --text2: rgba(255,255,255,.5);
  --text3: rgba(255,255,255,.3);
  --accent: #C4526E;
  --accent2: #A33E55;
  --accent-glow: rgba(196,82,110,.14);
  --radius: 16px;
  --radius-pill: 100px;
  --font: -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;touch-action:manipulation}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 600px 400px at 50% -10%, rgba(196,82,110,.05), transparent),
    radial-gradient(ellipse 400px 300px at 100% 100%, rgba(59,130,246,.03), transparent);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.container{
  width:100%;max-width:400px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:36px 28px;
  text-align:center;
}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-glow);animation:blink 2.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.logo-text{font-size:20px;font-weight:700;letter-spacing:-.3px}
.title{font-size:22px;font-weight:700;margin-bottom:6px}
.desc{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.5}
.input-wrap{text-align:left;margin-bottom:16px}
.input-wrap label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px}
.input-row{display:flex;gap:8px}
.email-input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-size:15px;outline:none;font-family:inherit;transition:border-color .2s}
.email-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.email-input::placeholder{color:var(--text3)}
.send-btn{padding:12px 20px;border-radius:var(--radius-pill);background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s}
.send-btn:hover{background:var(--accent2);box-shadow:0 6px 18px var(--accent-glow)}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{opacity:.4;pointer-events:none}
.err{font-size:12px;color:#f87171;text-align:left;min-height:16px;margin-top:4px}
.success{display:none;padding:16px;border-radius:10px;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.15);margin-top:16px}
.success-icon{font-size:32px;margin-bottom:8px}
.success-text{font-size:14px;color:#4ade80;line-height:1.6}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-text{font-size:11px;color:var(--text3)}
.info{font-size:12px;color:var(--text3);line-height:1.6}
</style>
</head>
<body>
<div class="container">
  <div class="logo"><div class="logo-dot"></div><span class="logo-text">心镜 · 社交</span></div>
  <div class="title">登录</div>
  <div class="desc">输入邮箱，我们会发送一个魔法链接，点击即可登录。无需密码。</div>

  <div class="input-wrap">
    <label for="emailInput">邮箱地址</label>
    <div class="input-row">
      <input type="email" id="emailInput" class="email-input" placeholder="your@email.com" autocomplete="email" inputmode="email" autofocus>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="success" id="success">
    <div class="success-icon">&#9993;</div>
    <div class="success-text" id="successText"></div>
  </div>

  <div class="divider"><span class="divider-line"></span><span class="divider-text">关于登录</span><span class="divider-line"></span></div>
  <div class="info">登录后你的所有数据将跨设备同步。我们使用 Resend 发送验证邮件，不会存储你的密码。</div>
</div>

<script>
(function(){
  var emailInput = document.getElementById('emailInput');
  var sendBtn = document.getElementById('sendBtn');
  var errEl = document.getElementById('err');
  var successEl = document.getElementById('success');
  var successText = document.getElementById('successText');
  var cooldownTimer = null;
  var cooldownSec = 0;

  // ── Redirect param ──
  var redirect = new URLSearchParams(location.search).get('redirect') || '/index.html';

  // ── Check already logged in ──
  async function checkLoggedIn() {
    try {
      var r = await fetch('/session', { credentials: 'same-origin' });
      var d = await r.json();
      if (d.loggedIn) {
        window.location.replace(redirect);
      }
    } catch(e) {}
  }
  checkLoggedIn();

  // ── Countdown ──
  function startCooldown() {
    cooldownSec = 60;
    sendBtn.disabled = true;
    updateCountdown();
    cooldownTimer = setInterval(function(){
      cooldownSec--;
      if (cooldownSec <= 0) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        sendBtn.disabled = false;
        sendBtn.textContent = '重新发送';
      } else {
        updateCountdown();
      }
    }, 1000);
  }

  function updateCountdown() {
    sendBtn.textContent = cooldownSec + 's';
  }

  async function send() {
    var email = emailInput.value.trim();
    if (!email || email.indexOf('@') === -1) {
      errEl.textContent = '请输入有效的邮箱地址';
      return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = '发送中...';
    errEl.textContent = '';

    try {
      var pending = null;
      try {
        var stored = sessionStorage.getItem('login_pending_result');
        if (stored) pending = JSON.parse(stored);
      } catch(e) {}

      var body = { email: email };
      if (pending) body.pendingResult = pending;

      var r = await fetch('/auth/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var d = await r.json();

      if (d.ok) {
        emailInput.style.display = 'none';
        errEl.style.display = 'none';
        successEl.style.display = 'block';
        successText.innerHTML = '验证邮件已发送！请查收邮箱 <strong>'+email+'</strong>，点击邮件中的链接完成登录。<br><br>登录后将自动跳转至目标页面。';
        sessionStorage.removeItem('login_pending_result');
        startCooldown();
      } else {
        errEl.textContent = d.message || '发送失败，请稍后重试';
        sendBtn.disabled = false;
        sendBtn.textContent = '发送';
      }
    } catch(e) {
      errEl.textContent = '网络错误，请稍后重试';
      sendBtn.disabled = false;
      sendBtn.textContent = '发送';
    }
  }

  sendBtn.addEventListener('click', send);
  emailInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') send();
  });
})();
</script>
</body>
</html>
