<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心镜 · 客服工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
               'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif;
  --bg: #000000;
  --bg-elevated: #0A0A0C;
  --surface: #141416;
  --surface-hover: #1C1C1F;
  --hairline: rgba(255,255,255,0.08);
  --hairline-strong: rgba(255,255,255,0.14);
  --text-primary: rgba(255,255,255,0.96);
  --text-secondary: rgba(255,255,255,0.62);
  --text-tertiary: rgba(255,255,255,0.38);
  --accent: #FF3B5C;
  --accent-dim: #C4293F;
  --accent-glow: rgba(255,59,92,0.16);
  --accent-soft: rgba(255,59,92,0.10);
}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(ellipse 900px 500px at 15% -5%, var(--accent-soft), transparent),radial-gradient(ellipse 700px 400px at 95% 105%, rgba(255,255,255,0.02), transparent)}

.app{display:flex;height:100vh}
.sidebar{width:340px;background:var(--surface);border-right:1px solid var(--hairline);display:flex;flex-direction:column}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--hairline)}
.sidebar-header h2{font-size:16px;font-weight:700;letter-spacing:-0.02em}
.sidebar-header p{font-size:12px;color:var(--text-tertiary);margin-top:4px}
.match-list{flex:1;overflow-y:auto}
.match-item{padding:14px 20px;border-bottom:1px solid var(--hairline);cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s}
.match-item:hover{background:var(--surface-hover)}
.match-item.active{background:var(--accent-soft);border-left:3px solid var(--accent)}
.match-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),transparent);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--hairline-strong)}
.match-info{flex:1}
.match-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;letter-spacing:-0.01em}
.match-meta{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.match-badge{font-size:11px;padding:2px 8px;background:var(--accent);color:#fff;border-radius:10px;font-weight:600}
.match-badge.hidden{display:none}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-tertiary);font-size:14px}

.main{flex:1;display:flex;flex-direction:column}
.main-header{padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between}
.main-header h3{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.main-header .user-tag{font-size:12px;padding:4px 10px;background:var(--bg-elevated);border:1px solid var(--hairline);border-radius:12px;color:var(--text-secondary)}
.profile-summary{padding:12px 24px;background:var(--bg-elevated);border-bottom:1px solid var(--hairline);font-size:13px;color:var(--text-secondary);line-height:1.6}
.profile-summary strong{color:var(--text-primary)}
.chat-area{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;max-width:70%}
.msg.user{align-self:flex-end}
.msg.staff{align-self:flex-start}
.msg.system{align-self:center}
.msg-bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5}
.msg.user .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.staff .msg-bubble{background:var(--surface);border:1px solid var(--hairline-strong);border-bottom-left-radius:4px}
.msg.system .msg-bubble{background:var(--bg-elevated);border:1px solid var(--hairline);color:var(--text-tertiary);font-size:12px;padding:6px 12px}
.msg-time{font-size:11px;color:var(--text-tertiary);margin-top:4px}
.input-area{padding:16px 24px;background:var(--surface);border-top:1px solid var(--hairline);display:flex;gap:10px}
.input-area input{flex:1;padding:10px 16px;background:var(--bg-elevated);border:1px solid var(--hairline);border-radius:8px;color:var(--text-primary);font-size:14px;transition:all .2s}
.input-area input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.input-area button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.input-area button:hover{background:var(--accent-dim);box-shadow:0 8px 24px var(--accent-glow)}
.input-area .close-btn{background:var(--surface);border:1px solid var(--hairline-strong);color:var(--text-secondary)}
.input-area .close-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.no-chat{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:14px}

.admin-tabs{display:flex;gap:4px;margin-top:10px}
.admin-tab{flex:1;padding:6px 0;background:var(--bg-elevated);border:1px solid var(--hairline);border-radius:8px;color:var(--text-tertiary);font-size:13px;cursor:pointer}
.admin-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.reports-panel{flex:1;overflow-y:auto}
.reports-filter{padding:10px 16px;border-bottom:1px solid var(--hairline)}
.reports-filter select{width:100%;padding:6px 10px;background:var(--bg-elevated);border:1px solid var(--hairline);border-radius:8px;color:var(--text-primary);font-size:13px}
.reports-list{flex:1;overflow-y:auto}
.report-item{padding:12px 16px;border-bottom:1px solid var(--hairline);cursor:pointer}
.report-item:hover{background:var(--surface-hover)}
.report-reason{font-size:13px;color:var(--text-primary);margin-bottom:4px}
.report-meta{font-size:11px;color:var(--text-tertiary);display:flex;justify-content:space-between}
.report-actions{display:flex;gap:6px;margin-top:8px}
.report-btn{padding:4px 12px;border-radius:12px;border:1px solid var(--hairline);background:var(--bg-elevated);color:var(--text-secondary);font-size:12px;cursor:pointer}
.report-btn:hover{color:var(--text-primary)}
.report-btn.danger:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.report-btn.warn:hover{background:rgba(250,204,21,0.1);border-color:#facc15;color:#facc15}
.report-status{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}
.report-status.pending{background:rgba(250,204,21,0.15);color:#facc15}
.report-status.resolved{background:rgba(74,222,128,0.15);color:#4ade80}
.report-detail{background:var(--bg-elevated);border:1px solid var(--hairline);border-radius:10px;padding:12px;margin-top:8px;display:none}
.report-detail.show{display:block}
.report-detail p{font-size:12px;color:var(--text-tertiary);margin:4px 0}
.report-detail .admin-note-area{width:100%;min-height:60px;background:var(--bg);border:1px solid var(--hairline);border-radius:8px;padding:8px;color:var(--text-primary);font-size:12px;resize:vertical;margin:8px 0;outline:none}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🎧 客服工作台</h2>
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchAdminTab('chat', this)">对话</button>
        <button class="admin-tab" onclick="switchAdminTab('reports', this)">举报</button>
      </div>
    </div>
    <div class="match-list" id="matchList">
      <div class="empty-state">加载中...</div>
    </div>
    <div class="reports-panel" id="reportsPanel" style="display:none">
      <div class="reports-filter">
        <select id="reportsFilter" onchange="loadReports()">
          <option value="pending">待处理</option>
          <option value="resolved">已处理</option>
          <option value="all">全部</option>
        </select>
      </div>
      <div class="reports-list" id="reportsList"><div class="empty-state">加载中...</div></div>
    </div>
  </div>
  <div class="main">
    <div class="main-header" id="mainHeader" style="display:none">
      <h3 id="chatTitle">--</h3>
      <span class="user-tag" id="userTag">--</span>
    </div>
    <div class="profile-summary" id="profileSummary" style="display:none"></div>
    <div class="chat-area" id="chatArea">
      <div class="no-chat">请从左侧选择一个对话</div>
    </div>
    <div class="input-area" id="inputArea" style="display:none">
      <input type="text" id="msgInput" placeholder="以匹配对象身份回复..." maxlength="500">
      <button id="sendBtn">发送</button>
      <button class="close-btn" id="closeBtn">结束对话</button>
    </div>
  </div>
</div>

<script>
let currentMatchId = null;
let pollTimer = null;
let lastPollTime = 0;
let matches = [];

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...opts
  });
  return res.json();
}

async function loadMatches() {
  try {
    const res = await api('/admin/support/matches');
    matches = res.matches || [];
    renderMatchList();
  } catch (e) {
    document.getElementById('matchList').innerHTML = '<div class="empty-state">加载失败，请刷新</div>';
  }
}

function renderMatchList() {
  const list = document.getElementById('matchList');
  if (matches.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无接入的对话</div>';
    return;
  }
  list.innerHTML = matches.map(m => `
    <div class="match-item ${m.id === currentMatchId ? 'active' : ''}" data-id="${m.id}" onclick="selectMatch(${m.id})">
      <div class="match-avatar">👤</div>
      <div class="match-info">
        <div class="match-name">
          ${m.user_nickname}
          <span class="match-badge ${m.unread_count > 0 ? '' : 'hidden'}">${m.unread_count}</span>
        </div>
        <div class="match-meta">${m.age_group} · ${new Date(m.created_at).toLocaleTimeString()}</div>
      </div>
    </div>
  `).join('');
}

async function selectMatch(id) {
  currentMatchId = id;
  lastPollTime = 0;
  renderMatchList();
  const match = matches.find(m => m.id === id);
  if (!match) return;
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('chatTitle').textContent = match.user_nickname;
  document.getElementById('userTag').textContent = match.age_group;
  document.getElementById('profileSummary').style.display = 'block';
  let scores = {};
  try { scores = JSON.parse(match.scores_json || '{}'); } catch(e) {}
  const attach = scores.attachment?.type || '未知';
  const love = scores.loveLang?.primary || '未知';
  document.getElementById('profileSummary').innerHTML = `
    <strong>测评摘要：</strong>依恋风格 ${attach} · 爱之语 ${love} · 
    <strong>匹配理由：</strong>${match.match_reason}
  `;
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('inputArea').style.display = 'flex';
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(doPoll, 3000);
  doPoll();
}

async function doPoll() {
  if (!currentMatchId) return;
  try {
    const res = await api(`/admin/support/poll?matchId=${currentMatchId}&since=${lastPollTime}`);
    const area = document.getElementById('chatArea');
    (res.messages || []).forEach(msg => {
      const div = document.createElement('div');
      const isUser = msg.sender_id !== 0 && msg.sender_id !== -1;
      div.className = `msg ${isUser ? 'user' : (msg.sender_id === 0 ? 'system' : 'staff')}`;
      div.innerHTML = `
        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
        <div class="msg-time">${new Date(msg.created_at).toLocaleTimeString()}</div>
      `;
      area.appendChild(div);
    });
    if (res.messages && res.messages.length > 0) {
      lastPollTime = Date.now();
      area.scrollTop = area.scrollHeight;
    }
  } catch (e) {}
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentMatchId) return;
  input.value = '';
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg staff';
  div.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  await api('/admin/support/send', {
    method: 'POST',
    body: JSON.stringify({ matchId: currentMatchId, content: text })
  });
}

async function closeMatch() {
  if (!currentMatchId) return;
  if (!confirm('确定要结束这个对话吗？用户将收到结束通知。')) return;
  await api('/chat/close', {
    method: 'POST',
    body: JSON.stringify({ matchId: currentMatchId })
  });
  currentMatchId = null;
  if (pollTimer) clearInterval(pollTimer);
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('profileSummary').style.display = 'none';
  document.getElementById('chatArea').innerHTML = '<div class="no-chat">请从左侧选择一个对话</div>';
  document.getElementById('inputArea').style.display = 'none';
  loadMatches();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').onkeydown = e => { if (e.key === 'Enter') sendMessage(); };
document.getElementById('closeBtn').onclick = closeMatch;


// ── Admin Tabs ──
function switchAdminTab(tab, btn) {
  document.querySelectorAll('.admin-tab').forEach(function(t){t.classList.remove('active')});
  btn.classList.add('active');
  if (tab === 'chat') {
    document.getElementById('matchList').style.display = '';
    document.getElementById('reportsPanel').style.display = 'none';
  } else {
    document.getElementById('matchList').style.display = 'none';
    document.getElementById('reportsPanel').style.display = '';
    loadReports();
  }
}

// ── Reports ──
var reportState = { page: 1, reports: [] };

async function loadReports() {
  var status = document.getElementById('reportsFilter').value;
  try {
    var r = await fetch('/api/reports-admin?status='+status+'&page=1&limit=50', {credentials:'same-origin'});
    var d = await r.json();
    if (d.reports) {
      reportState.reports = d.reports;
      renderReports(d.reports);
    }
  } catch(e) {
    document.getElementById('reportsList').innerHTML = '<div class="empty-state">加载失败</div>';
  }
}

function renderReports(reports) {
  if (!reports || reports.length === 0) {
    document.getElementById('reportsList').innerHTML = '<div class="empty-state">暂无举报</div>';
    return;
  }
  document.getElementById('reportsList').innerHTML = reports.map(function(r){
    var reporter = r.reporter_name || (r.reporter_email||'未知');
    var reported = r.user_a_name || r.user_b_name || '未知';
    var time = new Date(r.created_at);
    var timeStr = time.toLocaleDateString()+' '+time.toLocaleTimeString();
    return '<div class="report-item" id="report-'+r.report_id+'">'+
      '<div class="report-reason">'+r.reason.replace(/</g,'&lt;').substring(0,60)+'</div>'+
      '<div class="report-meta"><span>举报人：'+reporter+' → 被举报：'+reported+'</span><span>'+timeStr+'</span></div>'+
      (r.status === 'pending'
        ? '<div class="report-actions">'+
            '<button class="report-btn warn" onclick="handleReport('+r.report_id+','warn')">警告</button>'+
            '<button class="report-btn danger" onclick="handleReport('+r.report_id+','ban')">封禁</button>'+
            '<button class="report-btn" onclick="handleReport('+r.report_id+','dismiss')">忽略</button>'+
          '</div>'
        : '<span class="report-status '+r.status+'">'+ (r.status==='resolved'?'已处理':r.status) +'</span>')+
      (r.admin_note ? '<div style="font-size:11px;color:var(--text-tertiary);margin-top:4px">备注：'+r.admin_note.replace(/</g,'&lt;')+'</div>' : '')+
      '</div>';
  }).join('');
}

async function handleReport(reportId, action) {
  var note = '';
  if (action === 'warn' || action === 'ban') {
    note = prompt('请输入处理备注（可选）：');
    if (note === null) return;
  }
  try {
    var r = await fetch('/api/reports-admin', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({reportId:reportId, action:action, adminNote:note||''}),
      credentials: 'same-origin'
    });
    var d = await r.json();
    if (d.ok) {
      loadReports();
    } else {
      alert(d.error || '操作失败');
    }
  } catch(e) {
    alert('网络错误');
  }
}

loadMatches();
setInterval(loadMatches, 10000);
</script>
</body>
</html>
