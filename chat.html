<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>心镜 · 对话 | MirrorChat</title>
<style>
:root {
  --bg: #0f0f14;
  --bg-card: #1a1a24;
  --bg-input: #12121a;
  --surface-raised: #1e1e2c;
  --text-primary: #f0f0f4;
  --text-secondary: #b0b0be;
  --text-tertiary: #7a7a8c;
  --text-quaternary: #5a5a6c;
  --accent: #a78bfa;
  --accent-dim: #7c5ce0;
  --border: rgba(255,255,255,0.06);
  --danger: #ef4444;
  --success: #4ade80;
  --msg-mine: var(--accent-dim);
  --msg-other: #262634;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

body {
  background: var(--bg); color: var(--text-primary);
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
}

.topbar {
  width:100%; max-width:640px; display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; margin:0 auto;
}
.back-btn {
  background:none; border:none; color:var(--text-secondary); font-size:24px; cursor:pointer;
  display:flex; align-items:center; padding:4px;
}
.back-btn:hover { color: var(--text-primary); }
.brand { font-size:15px; font-weight:600; color:var(--text-secondary); }
.topbar-right { display:flex; align-items:center; gap:8px; }

.main {
  width:100%; max-width:640px; flex:1; display:flex; flex-direction:column;
  margin:0 auto; overflow:hidden; position:relative;
}

/* ── Conversation list ── */
.match-btn-bar {
  padding:12px 16px; flex-shrink:0;
}
.match-btn {
  width:100%; background:var(--accent); color:#fff; border:none;
  padding:12px 0; border-radius:24px; font-size:15px; font-weight:600;
  cursor:pointer; transition:all 0.2s;
}
.match-btn:hover { background:var(--accent-dim); }
.match-btn:disabled { opacity:0.5; cursor:not-allowed; }
.match-status { text-align:center; margin-top:8px; font-size:13px; color:var(--text-tertiary); }

.conv-list {
  flex:1; overflow-y:auto; padding:0 16px 16px;
}
.conv-list::-webkit-scrollbar { width:4px; }
.conv-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:2px; }

.conv-item {
  display:flex; align-items:center; gap:12px; padding:14px 12px;
  border-radius:14px; cursor:pointer; transition:background 0.15s;
}
.conv-item:hover { background:var(--bg-card); }
.conv-item + .conv-item { border-top:1px solid var(--border); }

.conv-avatar {
  width:48px; height:48px; border-radius:50%; background:var(--accent-dim);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:700; color:#fff; flex-shrink:0;
}

.conv-body { flex:1; min-width:0; }
.conv-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
.conv-name { font-size:15px; font-weight:600; color:var(--text-primary); }
.conv-time { font-size:11px; color:var(--text-quaternary); flex-shrink:0; margin-left:8px; }
.conv-preview {
  font-size:13px; color:var(--text-tertiary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:260px;
}
.conv-preview.system { color:var(--text-quaternary); font-style:italic; }

.conv-badge {
  background:var(--accent); color:#fff; font-size:11px; font-weight:600;
  min-width:20px; height:20px; border-radius:10px; display:flex;
  align-items:center; justify-content:center; padding:0 6px; flex-shrink:0;
}

.empty-state { text-align:center; padding:60px 20px; color:var(--text-tertiary); font-size:14px; }

.loading-center {
  display:flex; align-items:center; justify-content:center; padding:60px;
}

/* ── Chat screen ── */
.chat-header {
  display:flex; align-items:center; padding:10px 16px; gap:12px;
  border-bottom:1px solid var(--border); background:var(--bg-card);
  flex-shrink:0;
}
.partner-avatar {
  width:40px; height:40px; border-radius:50%; background:var(--accent-dim);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:700; color:#fff; flex-shrink:0;
}
.partner-info { flex:1; min-width:0; }
.partner-name { font-size:15px; font-weight:600; color:var(--text-primary); }
.partner-bio { font-size:12px; color:var(--text-tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.match-score-badge {
  font-size:11px; background:rgba(167,139,250,0.15); color:var(--accent);
  padding:2px 8px; border-radius:10px; font-weight:600;
}
.header-actions { display:flex; gap:4px; }
.icon-btn {
  background:none; border:1px solid var(--border); border-radius:8px; color:var(--text-tertiary);
  padding:6px 10px; font-size:12px; cursor:pointer; transition:all 0.2s;
}
.icon-btn:hover { color:var(--text-primary); border-color:var(--text-tertiary); }
.icon-btn.danger:hover { color:var(--danger); border-color:var(--danger); }

/* ── Messages ── */
.msg-list {
  flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column;
  gap:12px; scroll-behavior:smooth;
}
.msg-list::-webkit-scrollbar { width:4px; }
.msg-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:2px; }

.msg-row { display:flex; }
.msg-row.mine { justify-content:flex-end; }
.msg-bubble {
  max-width:75%; padding:10px 14px; border-radius:16px; font-size:14px;
  line-height:1.5; word-break:break-word; position:relative;
}
.msg-row.mine .msg-bubble {
  background:var(--msg-mine); color:#fff; border-bottom-right-radius:4px;
}
.msg-row.other .msg-bubble {
  background:var(--msg-other); color:var(--text-primary); border-bottom-left-radius:4px;
}
.msg-row.system .msg-bubble {
  background:transparent; color:var(--text-tertiary); font-size:12px;
  text-align:center; max-width:100%; padding:6px 0;
}
.msg-time { font-size:10px; color:rgba(255,255,255,0.4); margin-top:4px; text-align:right; }

/* ── Input area ── */
.msg-input-area {
  display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border);
  background:var(--bg-card); flex-shrink:0;
}
.msg-input {
  flex:1; background:var(--bg-input); border:1px solid var(--border); border-radius:24px;
  padding:10px 16px; color:var(--text-primary); font-size:14px; outline:none;
  transition:border-color 0.2s; resize:none;
}
.msg-input:focus { border-color:var(--accent); }
.send-btn {
  width:40px; height:40px; border-radius:50%; background:var(--accent); border:none;
  color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center;
  justify-content:center; flex-shrink:0; transition:all 0.2s;
}
.send-btn:hover { background:var(--accent-dim); }
.send-btn:disabled { opacity:0.5; cursor:not-allowed; }

/* ── Modal ── */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
  z-index:1000; align-items:center; justify-content:center;
}
.modal-overlay.active { display:flex; }
.modal-box {
  background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
  width:90%; max-width:360px; padding:24px;
}
.modal-box h3 { font-size:16px; color:var(--text-primary); margin-bottom:16px; }
.modal-box textarea {
  width:100%; min-height:100px; background:var(--bg-input); border:1px solid var(--border);
  border-radius:10px; padding:12px; color:var(--text-primary); font-size:14px;
  resize:vertical; outline:none; font-family:inherit;
}
.modal-box textarea:focus { border-color:var(--accent); }
.modal-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal-btn {
  padding:8px 20px; border-radius:20px; font-size:13px; font-weight:500; cursor:pointer;
  border:none; transition:all 0.2s;
}
.modal-btn.cancel { background:var(--bg); color:var(--text-secondary); border:1px solid var(--border); }
.modal-btn.confirm { background:var(--accent); color:#fff; }
.modal-btn.danger { background:var(--danger); color:#fff; }
.modal-msg { margin-top:10px; font-size:13px; }

/* ── Toast ── */
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:2000;
  padding:10px 24px; border-radius:20px; font-size:13px; font-weight:500;
  pointer-events:none; opacity:0; transition:opacity 0.3s;
}
.toast.show { opacity:1; }
.toast.success { background:var(--success); color:#000; }
.toast.error { background:var(--danger); color:#fff; }

/* ── Loading ── */
.loading-spinner {
  display:flex; align-items:center; justify-content:center; padding:40px;
}
.spinner {
  width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin 0.7s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" id="topBackBtn" onclick="goBack()">&larr;</button>
  <span class="brand">心镜 · 对话</span>
  <div class="topbar-right">
    <button class="auth-login-btn" style="background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:6px 14px;font-size:13px;color:var(--text-secondary);cursor:pointer;display:none;" onclick="Auth.showLoginModal()">登录</button>
  </div>
</div>

<div class="main" id="mainContainer">

  <!-- Conversation List Screen -->
  <div id="convListScreen" style="display:flex;flex-direction:column;height:100%">
    <div class="match-btn-bar">
      <button class="match-btn" id="startMatchBtn" onclick="startMatch()">开始匹配</button>
      <div class="match-status" id="matchStatus"></div>
    </div>
    <div class="conv-list" id="convList">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chatScreen" style="display:none;flex:1;flex-direction:column;height:100%">
    <div class="chat-header" id="chatHeader">
      <div class="partner-avatar" id="partnerAvatar">?</div>
      <div class="partner-info">
        <div class="partner-name" id="partnerName">加载中...</div>
        <div class="partner-bio" id="partnerBio"></div>
      </div>
      <span class="match-score-badge" id="matchScoreBadge">88%</span>
      <div class="header-actions">
        <button class="icon-btn danger" onclick="openReportModal()" title="举报">举报</button>
        <button class="icon-btn danger" onclick="closeMatch()" title="结束对话">结束</button>
      </div>
    </div>

    <div class="msg-list" id="msgList">
      <div class="empty-state">加载消息中...</div>
    </div>

    <div class="msg-input-area">
      <input type="text" class="msg-input" id="msgInput" placeholder="输入消息..." maxlength="500"
             onkeydown="if(event.key==='Enter'){event.preventDefault();sendMessage()}"/>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Report modal -->
<div class="modal-overlay" id="reportModal">
  <div class="modal-box">
    <h3>举报用户</h3>
    <textarea id="reportReason" placeholder="请描述举报原因（至少5字）..." maxlength="500"></textarea>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeReportModal()">取消</button>
      <button class="modal-btn danger" id="reportSubmitBtn" onclick="submitReport()">提交举报</button>
    </div>
    <div class="modal-msg" id="reportMsg" style="display:none;"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/auth.js"></script>
<script>
'use strict';

// ── State ──
var chatState = {
  matchId: null,
  partner: null,
  messages: [],
  pollingActive: false,
  pollTimer: null,
  sending: false,
  activeRefreshTimer: null,
  isInChat: false       // true = chat view, false = conversation list
};

// ── Helpers ──
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'success') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

function timeAgo(ts) {
  var s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s/60) + '分钟前';
  if (s < 86400) return Math.floor(s/3600) + '小时前';
  return Math.floor(s/86400) + '天前';
}

function fmtTime(ts) {
  var d = new Date(ts);
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}

// ── Navigation ──
function goBack() {
  if (chatState.isInChat) {
    // back to conversation list
    showConvList();
  } else {
    history.back();
  }
}

function showConvList() {
  stopPolling();
  chatState.isInChat = false;
  chatState.matchId = null;
  chatState.partner = null;
  chatState.messages = [];
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('convListScreen').style.display = 'flex';
  loadConversations();
}

function showChatView() {
  chatState.isInChat = true;
  document.getElementById('convListScreen').style.display = 'none';
  var cs = document.getElementById('chatScreen');
  cs.style.display = 'flex';
}

// ── Init ──
async function init() {
  if (Auth.isLoggedIn()) {
    routeEntry();
  } else {
    Auth.onAuthChange(function(user) {
      if (user) routeEntry();
    });
  }
}

async function routeEntry() {
  var params = new URLSearchParams(location.search);
  var matchId = params.get('matchId');
  var userId = params.get('userId');

  if (matchId) {
    // 直接进入指定会话
    showChatView();
    try {
      var r = await fetch('/chat/match?' + new URLSearchParams({}), { credentials: 'same-origin' });
      var d = await r.json();
      var found = (d.matches || []).filter(function(m){ return String(m.id) === matchId && m.status === 'accepted'; });
      if (found.length > 0) {
        chatState.matchId = found[0].id;
        chatState.partner = found[0];
        setupChatHeader(found[0]);
        loadHistory();
        startPolling();
        if (history.replaceState) {
          history.replaceState(null, '', '?matchId=' + matchId);
        }
        return;
      }
    } catch(e) { console.error(e); }
    toast('会话不存在或已关闭', 'error');
    showConvList();

  } else if (userId) {
    // 定向私信
    showChatView();
    try {
      var sr = await fetch('/chat/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetUserId: parseInt(userId) }),
        credentials: 'same-origin'
      });
      var sd = await sr.json();
      if (sd.ok) {
        chatState.matchId = sd.matchId;
        if (history.replaceState) {
          history.replaceState(null, '', '?matchId=' + sd.matchId);
        }
        // 从 /chat/match 列表拿 partner 信息
        try {
          var mr = await fetch('/chat/match', { credentials: 'same-origin' });
          var md = await mr.json();
          var mf = (md.matches || []).filter(function(m){ return m.id === sd.matchId; });
          if (mf.length > 0) {
            chatState.partner = mf[0];
            setupChatHeader(mf[0]);
          }
        } catch(e) {}
        loadHistory();
        startPolling();
        return;
      }
      toast(sd.message || '发起对话失败', 'error');
    } catch(e) { toast('网络错误', 'error'); }
    showConvList();

  } else {
    // 默认：会话列表
    showConvList();
  }
}

// ── Conversation List ──
async function loadConversations() {
  var list = document.getElementById('convList');
  list.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>';

  try {
    var r = await fetch('/chat/list', { credentials: 'same-origin' });
    var d = await r.json();
    var convs = d.conversations || [];

    if (convs.length === 0) {
      list.innerHTML = '<div class="empty-state">还没有对话<br>点击上方「开始匹配」开启一段新对话</div>';
      return;
    }

    var html = '';
    convs.forEach(function(c) {
      var p = c.partner;
      var initial = (p.nickname || '?')[0];
      var last = c.lastMessage;
      var preview = '';
      var previewClass = '';
      if (last) {
        if (last.isSystem) {
          preview = last.content;
          previewClass = ' system';
        } else if (last.isMine) {
          preview = '我: ' + last.content;
        } else {
          preview = last.content;
        }
      } else {
        preview = '暂无消息';
      }

      html += '<div class="conv-item" onclick="enterConversation(\'' + c.matchId + '\', \'' + p.nickname.replace(/'/g, "\\'") + '\')">' +
        '<div class="conv-avatar">' + initial + '</div>' +
        '<div class="conv-body">' +
          '<div class="conv-top">' +
            '<span class="conv-name">' + p.nickname.replace(/</g,'&lt;') + '</span>' +
            '<span class="conv-time">' + (last ? timeAgo(last.time) : '') + '</span>' +
          '</div>' +
          '<div class="conv-preview' + previewClass + '">' + preview.replace(/</g,'&lt;') + '</div>' +
        '</div>' +
        (c.unread > 0 ? '<div class="conv-badge">' + (c.unread > 99 ? '99+' : c.unread) + '</div>' : '') +
      '</div>';
    });

    list.innerHTML = html;
  } catch(e) {
    console.error('loadConversations:', e);
    list.innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
  }
}

function enterConversation(matchId, partnerName) {
  showChatView();
  chatState.matchId = matchId;
  document.getElementById('partnerName').textContent = partnerName;
  document.getElementById('partnerBio').textContent = '';
  document.getElementById('partnerAvatar').textContent = (partnerName || '?')[0];
  document.getElementById('matchScoreBadge').textContent = '';
  chatState.messages = [];

  if (history.replaceState) {
    history.replaceState(null, '', '?matchId=' + matchId);
  }

  // 加载完整 partner 信息
  fetch('/chat/match', { credentials: 'same-origin' }).then(function(r){ return r.json(); }).then(function(d){
    var found = (d.matches || []).filter(function(m){ return String(m.id) === String(matchId); });
    if (found.length > 0) {
      chatState.partner = found[0];
      setupChatHeader(found[0]);
    }
  }).catch(function(){});

  loadHistory();
  startPolling();
  markAsRead();
}

function setupChatHeader(match) {
  document.getElementById('partnerName').textContent = match.nickname || '匿名用户';
  document.getElementById('partnerBio').textContent = match.bio || '';
  document.getElementById('matchScoreBadge').textContent = (match.match_score || 88) + '%';
  document.getElementById('partnerAvatar').textContent = (match.nickname || '?')[0];
}

async function markAsRead() {
  try {
    await fetch('/chat/mark_read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ matchId: chatState.matchId }),
      credentials: 'same-origin'
    });
  } catch(e) {}
}

// ── Messages ──
async function loadHistory(before) {
  try {
    var url = '/chat/history?matchId=' + chatState.matchId + '&limit=50';
    if (before) url += '&before=' + before;
    var r = await fetch(url, { credentials: 'same-origin' });
    var d = await r.json();
    if (d.messages && d.messages.length > 0) {
      chatState.messages = d.messages.reverse().concat(chatState.messages);
      renderMessages();
    } else if (!before) {
      document.getElementById('msgList').innerHTML = '<div class="empty-state">暂无消息，开始聊天吧</div>';
    }
  } catch(e) {
    console.error('loadHistory:', e);
  }
}

function renderMessages() {
  var list = document.getElementById('msgList');
  var currentUserId = Auth.getUserId();
  var html = chatState.messages.map(function(m) {
    var isMine = m.sender_id === currentUserId;
    var isSystem = m.sender_id === 0 || m.is_system === 1 || m.sender_id === null;
    var name = m.sender_name || '';
    if (isSystem) {
      return '<div class="msg-row system"><div class="msg-bubble">' + m.content.replace(/</g,'&lt;') + '</div></div>';
    }
    return '<div class="msg-row '+(isMine?'mine':'other')+'">' +
      '<div class="msg-bubble">' +
        (!isMine ? '<div style="font-size:10px;color:var(--accent);margin-bottom:2px">' + name.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' : '') +
        m.content.replace(/</g,'&lt;') +
        '<div class="msg-time">' + fmtTime(m.created_at) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  list.innerHTML = html;
  scrollToBottom();
}

function scrollToBottom() {
  var list = document.getElementById('msgList');
  setTimeout(function() { list.scrollTop = list.scrollHeight; }, 50);
}

// ── Matching (random) ──
async function startMatch() {
  if (!Auth.isLoggedIn()) {
    Auth.showLoginModal();
    return;
  }
  var btn = document.getElementById('startMatchBtn');
  var st = document.getElementById('matchStatus');
  btn.disabled = true;
  st.textContent = '匹配中...';

  try {
    var r = await fetch('/chat/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
      credentials: 'same-origin'
    });
    var d = await r.json();
    if (d.ok) {
      st.textContent = '匹配成功！';
      showChatView();
      chatState.matchId = d.matchId;
      chatState.partner = d.partner;
      if (history.replaceState) {
        history.replaceState(null, '', '?matchId=' + d.matchId);
      }
      setupChatHeader(d.partner);
      loadHistory();
      startPolling();
    } else {
      st.textContent = d.message || '匹配失败';
      toast(d.message || '匹配失败，请重试', 'error');
      btn.disabled = false;
    }
  } catch(e) {
    st.textContent = '网络错误';
    toast('网络错误，请重试', 'error');
    btn.disabled = false;
  }
}

// ── Polling ──
function startPolling() {
  if (chatState.pollingActive) return;
  chatState.pollingActive = true;
  poll();
}

function stopPolling() {
  chatState.pollingActive = false;
  if (chatState.pollTimer) clearTimeout(chatState.pollTimer);
}

async function poll() {
  if (!chatState.pollingActive || !chatState.matchId) return;

  var since = 0;
  if (chatState.messages.length > 0) {
    since = chatState.messages[chatState.messages.length - 1].created_at;
  }

  try {
    var r = await fetch('/chat/poll?matchId=' + chatState.matchId + '&since=' + since, {
      credentials: 'same-origin'
    });
    if (!r.ok) {
      chatState.pollTimer = setTimeout(poll, 3000);
      return;
    }
    var d = await r.json();
    if (d.messages && d.messages.length > 0) {
      var incomingIds = {};
      d.messages.forEach(function(m){ incomingIds[m.id] = true; });
      var merged = chatState.messages.filter(function(m){
        return !m._temp || !incomingIds[m.id];
      });
      merged = merged.filter(function(m){ return !m._temp; });
      var existingIds = {};
      merged.forEach(function(m){ existingIds[m.id] = true; });
      var newMsgs = d.messages.filter(function(m){ return !existingIds[m.id]; });
      chatState.messages = merged.concat(newMsgs);
      renderMessages();
    }
    chatState.pollTimer = setTimeout(poll, 2000);
  } catch(e) {
    chatState.pollTimer = setTimeout(poll, 5000);
  }
}

// ── Send ──
async function sendMessage() {
  if (chatState.sending) return;
  var input = document.getElementById('msgInput');
  var content = input.value.trim();
  if (!content) return;

  chatState.sending = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';

  try {
    var r = await fetch('/chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ matchId: chatState.matchId, content: content }),
      credentials: 'same-origin'
    });
    var d = await r.json();
    if (d.ok) {
      var tempId = Date.now();
      chatState.messages.push({
        id: tempId,
        sender_id: Auth.getUserId(),
        content: content,
        created_at: tempId,
        sender_name: Auth.getDisplayName(),
        _temp: true
      });
      renderMessages();
    } else {
      toast(d.message || '发送失败', 'error');
    }
  } catch(e) {
    toast('网络错误', 'error');
  } finally {
    chatState.sending = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('msgInput').focus();
  }
}

// ── Close ──
async function closeMatch() {
  if (!confirm('确定要结束这次对话吗？结束后将无法继续发送消息。')) return;

  try {
    var r = await fetch('/chat/close', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ matchId: chatState.matchId }),
      credentials: 'same-origin'
    });
    var d = await r.json();
    if (d.ok) {
      stopPolling();
      document.getElementById('msgInput').disabled = true;
      document.getElementById('sendBtn').disabled = true;
      chatState.messages.push({
        id: Date.now(),
        sender_id: 0,
        is_system: 1,
        content: '对话已结束，你可以返回对话列表。',
        created_at: Date.now()
      });
      renderMessages();
      toast('对话已结束');
      setTimeout(function(){ showConvList(); }, 2000);
    }
  } catch(e) {
    toast('操作失败', 'error');
  }
}

// ── Report ──
function openReportModal() {
  document.getElementById('reportModal').classList.add('active');
  document.getElementById('reportReason').value = '';
  document.getElementById('reportMsg').style.display = 'none';
  document.getElementById('reportSubmitBtn').disabled = false;
}

function closeReportModal() {
  document.getElementById('reportModal').classList.remove('active');
}

async function submitReport() {
  var reason = document.getElementById('reportReason').value.trim();
  if (!reason || reason.length < 5) {
    var el = document.getElementById('reportMsg');
    el.textContent = '请至少输入5个字';
    el.style.color = 'var(--danger)';
    el.style.display = 'block';
    return;
  }
  document.getElementById('reportSubmitBtn').disabled = true;

  try {
    var r = await fetch('/chat/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ matchId: chatState.matchId, reason: reason }),
      credentials: 'same-origin'
    });
    var d = await r.json();
    if (d.ok) {
      var el = document.getElementById('reportMsg');
      el.textContent = '举报已提交，感谢你的反馈。';
      el.style.color = 'var(--success)';
      el.style.display = 'block';
      setTimeout(function(){ closeReportModal(); }, 1500);
    } else {
      var el2 = document.getElementById('reportMsg');
      el2.textContent = d.message || '提交失败';
      el2.style.color = 'var(--danger)';
      el2.style.display = 'block';
      document.getElementById('reportSubmitBtn').disabled = false;
    }
  } catch(e) {
    var el3 = document.getElementById('reportMsg');
    el3.textContent = '网络错误';
    el3.style.color = 'var(--danger)';
    el3.style.display = 'block';
    document.getElementById('reportSubmitBtn').disabled = false;
  }
}

// ── Initialize ──
document.addEventListener('DOMContentLoaded', init);

Auth.onAuthChange(function(user) {
  if (user) routeEntry();
});

// Periodically refresh conversation list when in list view
setInterval(function() {
  if (!chatState.isInChat && Auth.isLoggedIn()) {
    loadConversations();
  }
}, 15000);
</script>
