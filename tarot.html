<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>塔罗 · 心镜</title>
<script src="/auth.js"></script>
<script src="/tarot-deck.js"></script>
<style>
:root {
  --bg: #0d0710;
  --bg-elevated: #150c1c;
  --surface: #1a1122;
  --surface-raised: #22162c;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);
  --text-primary: #f7ede8;
  --text-secondary: #b3a3ae;
  --text-tertiary: #7c6c78;
  --text-quaternary: #4a3f47;
  --accent: #dfb6b2;
  --accent-dim: #c9908c;
  --accent-glow: rgba(82,43,91,0.35);
  --accent-soft: rgba(223,182,178,0.09);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --ease: cubic-bezier(0.16,1,0.3,1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text-primary); line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; }

.ambient { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.ambient::before {
  content:''; position:absolute; top:-25%; left:-10%; width:90%; height:55%;
  background: radial-gradient(ellipse at center, rgba(82,43,91,0.32) 0%, transparent 68%);
  filter: blur(50px);
}
.ambient::after {
  content:''; position:absolute; bottom:-20%; right:-15%; width:80%; height:50%;
  background: radial-gradient(ellipse at center, rgba(43,18,76,0.28) 0%, transparent 70%);
  filter: blur(60px);
}

.header {
  position:sticky; top:0; z-index:50; padding-top:var(--safe-top);
  background: rgba(13,7,16,0.72); backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.header-inner { max-width:640px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:12px; }
.back-btn {
  width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.05); border:none;
  color:var(--text-secondary); display:flex; align-items:center; justify-content:center;
}
.back-btn:active { transform:scale(0.88); }
.header-title { font-size:16px; font-weight:700; letter-spacing:-0.01em; }

.main { max-width:640px; margin:0 auto; padding:24px 18px calc(60px + var(--safe-bottom)); position:relative; z-index:1; }

/* ── Hero (图2风格：大字号+编号) ── */
.hero-tag { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-tertiary); letter-spacing:3px; text-transform:uppercase; margin-bottom:20px; font-weight:600; }
.hero-tag::before { content:''; width:20px; height:1px; background:var(--accent); display:inline-block; }
.hero-title { font-size:38px; font-weight:800; line-height:1.05; letter-spacing:-0.03em; margin-bottom:14px; }
.hero-title .grad { background:linear-gradient(135deg,#fff 0%,var(--accent) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero-sub { font-size:14px; color:var(--text-secondary); line-height:1.65; max-width:380px; border-left:2px solid var(--border); padding-left:14px; }

/* ── Spread selector ── */
.spread-select { display:flex; gap:10px; margin-top:28px; }
.spread-opt {
  flex:1; padding:18px 14px; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border);
  text-align:left; position:relative; overflow:hidden; transition:transform .15s var(--ease),border-color .2s;
}
.spread-opt:active { transform:scale(0.97); }
.spread-opt.active { border-color:var(--accent); background:linear-gradient(155deg, rgba(82,43,91,0.22), rgba(43,18,76,0.08)); }
.spread-opt-num { font-size:11px; color:var(--text-quaternary); font-weight:700; letter-spacing:0.04em; margin-bottom:8px; }
.spread-opt-title { font-size:15px; font-weight:700; margin-bottom:4px; }
.spread-opt-desc { font-size:11.5px; color:var(--text-tertiary); line-height:1.4; }

/* ── Question input ── */
.question-block { margin-top:20px; }
.question-label { font-size:12px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
.question-input {
  width:100%; padding:14px 16px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border);
  color:var(--text-primary); font-family:inherit; font-size:14px; resize:none; min-height:64px;
}
.question-input:focus { outline:none; border-color:var(--border-strong); }
.question-input::placeholder { color:var(--text-quaternary); }

/* ── Draw button ── */
.draw-btn {
  width:100%; margin-top:22px; padding:17px; border-radius:100px; border:none;
  background:linear-gradient(135deg, var(--accent), var(--accent-dim)); color:#1a1017;
  font-size:15.5px; font-weight:700; letter-spacing:0.01em; cursor:pointer;
  transition:transform .15s var(--ease);
}
.draw-btn:active { transform:scale(0.97); }
.draw-btn:disabled { opacity:0.5; }

/* ── Shuffle ritual stage ── */
.shuffle-stage { display:none; margin-top:8px; text-align:center; transition:opacity .5s ease; }
.shuffle-stage.fade-out { opacity:0; pointer-events:none; }
.shuffle-ritual {
  position:relative; width:150px; height:230px; margin:30px auto 26px;
  perspective:1200px; cursor:pointer; user-select:none; -webkit-user-select:none;
}
.shuffle-ritual:active { cursor:grabbing; }
.shuffle-deck {
  position:absolute; inset:0; transform-style:preserve-3d;
  transition:transform .5s var(--ease);
}
.shuffle-ritual.shaking .shuffle-deck { animation:shuffleShake .5s ease-in-out; }
@keyframes shuffleShake {
  0%{ transform:rotateY(0) rotateZ(0) translateY(0); }
  25%{ transform:rotateY(-14deg) rotateZ(-3deg) translateY(-6px); }
  50%{ transform:rotateY(10deg) rotateZ(2deg) translateY(2px); }
  75%{ transform:rotateY(-8deg) rotateZ(-2deg) translateY(-4px); }
  100%{ transform:rotateY(0) rotateZ(0) translateY(0); }
}
.shuffle-ritual.spinning .shuffle-deck { animation:shuffleSpin .9s var(--ease); }
@keyframes shuffleSpin {
  0%{ transform:rotateY(0) rotateZ(0); }
  100%{ transform:rotateY(360deg) rotateZ(6deg); }
}
.shuffle-card {
  position:absolute; inset:0; border-radius:var(--radius-md);
  background:
    radial-gradient(circle at 50% 44%, rgba(223,182,178,0.14) 0%, transparent 55%),
    repeating-conic-gradient(from 0deg at 50% 44%, rgba(223,182,178,0.06) 0deg 7.5deg, transparent 7.5deg 15deg),
    linear-gradient(160deg, #2a1e33, #170e1f 72%);
  border:1px solid var(--border-strong);
  box-shadow:0 14px 34px -10px rgba(0,0,0,0.6);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.shuffle-card::after {
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.05) 50%, transparent 58%);
  background-size:260% 260%; animation:tcbShimmer 5s ease-in-out infinite;
}
.shuffle-card .tcb-frame { inset:10px; }
.shuffle-card .tcb-glyph { font-size:34px; }
.shuffle-ritual.glow .shuffle-card {
  box-shadow:0 0 60px rgba(223,182,178,0.35), 0 14px 34px -10px rgba(0,0,0,0.6);
}
.shuffle-ritual.glow .shuffle-card::before {
  content:''; position:absolute; inset:-2px; border-radius:inherit;
  border:1px solid rgba(223,182,178,0.5); animation:glowPulse 1.2s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100%{opacity:.3; transform:scale(1);} 50%{opacity:.9; transform:scale(1.03);} }
.shuffle-ritual.done .shuffle-deck { animation:shuffleDone .8s var(--ease) forwards; }
@keyframes shuffleDone {
  0%{ transform:rotateY(0) rotateZ(0) translateY(0); opacity:1; }
  100%{ transform:rotateY(720deg) rotateZ(0) translateY(-40px); opacity:0; }
}
.shuffle-ritual.done { pointer-events:none; }

.shuffle-progress { display:flex; justify-content:center; gap:8px; margin:0 auto 22px; }
.shuffle-dot {
  width:8px; height:8px; border-radius:50%; background:var(--border-strong);
  transition:all .3s var(--ease);
}
.shuffle-dot.lit { background:var(--accent); box-shadow:0 0 10px rgba(223,182,178,0.6); transform:scale(1.2); }

.shuffle-hint { font-size:13px; color:var(--text-secondary); font-weight:500; min-height:20px; transition:opacity .2s; }
.shuffle-sub { font-size:11.5px; color:var(--text-tertiary); margin-top:8px; line-height:1.6; }

/* ── Draw stage: real spread-and-pick interaction ── */
.draw-stage { display:none; margin-top:8px; transition:opacity .5s ease; }
.draw-stage.fade-out { opacity:0; pointer-events:none; }


/* Tray：已选中的牌集中展示在上方 */
.tray { display:flex; gap:10px; justify-content:center; margin-bottom:22px; }
.tray-slot {
  width:74px; padding:10px 6px; border-radius:var(--radius-sm);
  border:1.5px dashed var(--border-strong); text-align:center; transition:all .4s var(--ease);
}
.tray-slot.filled { border-style:solid; border-color:rgba(223,182,178,0.3); background:var(--accent-soft); }
.tray-slot-label { font-size:9.5px; font-weight:700; color:var(--text-quaternary); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; }
.tray-slot-empty { font-size:16px; color:var(--text-quaternary); }
.tray-slot-content { animation:none; }
.tray-slot.filled .tray-slot-content { animation:traySlotIn .4s var(--ease) both; }
@keyframes traySlotIn { from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);} }
.tray-card-name { font-size:11.5px; font-weight:700; line-height:1.3; }
.tray-card-dir { font-size:9.5px; color:var(--accent); margin-top:2px; }

.stage-hint { text-align:center; font-size:13px; color:var(--text-secondary); margin-bottom:18px; font-weight:500; min-height:18px; transition:opacity .2s; }

/* 摊开的整副牌：横向滑动，可看到很多张 */
.deck-scroller {
  display:flex; align-items:center; gap:0; padding:50px 0 40px;
  overflow-x:auto; overflow-y:visible;
  -webkit-overflow-scrolling:touch;
  margin:0 -18px; padding-left:34px; padding-right:34px;
}
.deck-scroller::-webkit-scrollbar { display:none; }
.deck-scroller { scrollbar-width:none; }

.tarot-card {
  flex:0 0 auto; width:108px; margin:0 -34px; perspective:1000px; cursor:pointer;
  transform:scale(0.86) rotate(var(--tilt, 0deg));
  transition:transform .4s var(--ease), opacity .4s var(--ease);
  position:relative;
}
.tarot-card.selecting {
  transform:scale(1.55) rotate(0deg) translateY(-30px);
  z-index:80;
}
.tarot-card.picked {
  transform:scale(0.7) rotate(var(--tilt, 0deg));
  opacity:0.32; pointer-events:none; z-index:1;
}

.tarot-card-inner {
  width:100%; aspect-ratio:2/3.15; position:relative;
  transform-style:preserve-3d; transition:transform .75s cubic-bezier(.34,1.1,.4,1);
  border-radius:var(--radius-md);
  box-shadow:0 14px 34px -10px rgba(0,0,0,0.55);
}
.tarot-card.selecting .tarot-card-inner { box-shadow:0 30px 60px -8px rgba(0,0,0,0.7), 0 0 40px rgba(223,182,178,0.18); }
.tarot-card.flipped .tarot-card-inner { transform:rotateY(180deg); }

.flip-glare {
  position:absolute; inset:0; z-index:9; pointer-events:none; border-radius:var(--radius-md); overflow:hidden;
  opacity:0;
}
.tarot-card.flipping .flip-glare {
  opacity:1;
  background:linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.4) 50%, transparent 65%);
  transform:translateX(-130%);
  animation:flipGlare .75s ease-in-out;
}
@keyframes flipGlare { to { transform:translateX(130%); } }

.tarot-card-face {
  position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-md);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--border-strong); overflow:hidden;
}

/* 卡背：神秘符文质感 */
.tarot-card-back {
  background:
    radial-gradient(circle at 50% 44%, rgba(223,182,178,0.12) 0%, transparent 55%),
    repeating-conic-gradient(from 0deg at 50% 44%, rgba(223,182,178,0.05) 0deg 7.5deg, transparent 7.5deg 15deg),
    linear-gradient(160deg, #251a2d, #150c1c 72%);
}
.tarot-card-back::after {
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.045) 50%, transparent 58%);
  background-size:260% 260%;
  animation:tcbShimmer 6s ease-in-out infinite;
}
@keyframes tcbShimmer { 0%,100%{background-position:130% 130%;} 50%{background-position:-30% -30%;} }
.tcb-frame { position:absolute; inset:9px; border:1px solid rgba(223,182,178,0.2); border-radius:9px; pointer-events:none; }
.tcb-corner {
  position:absolute; font-size:9px; color:var(--accent); opacity:.55; line-height:1; pointer-events:none;
}
.tcb-corner.tl { top:5px; left:5px; }
.tcb-corner.tr { top:5px; right:5px; }
.tcb-corner.bl { bottom:5px; left:5px; }
.tcb-corner.br { bottom:5px; right:5px; }
.tcb-glyph {
  font-size:26px; color:var(--accent); opacity:.5;
  animation:tcbGlyphPulse 3.4s ease-in-out infinite;
}
@keyframes tcbGlyphPulse { 0%,100%{opacity:.38; transform:scale(1);} 50%{opacity:.7; transform:scale(1.08);} }

.tarot-card-front {
  transform:rotateY(180deg);
  background:linear-gradient(155deg, var(--surface-raised), var(--surface));
  padding:20px 12px; text-align:center;
}
.tarot-card-front.reversed .tcf-name,
.tarot-card-front.reversed .tcf-symbol { transform:rotate(180deg); }
.tcf-badge { font-size:8.5px; font-weight:700; letter-spacing:0.1em; color:var(--text-quaternary); text-transform:uppercase; }
.tcf-symbol { margin:auto 0; color:var(--accent); display:flex; align-items:center; justify-content:center; }
.card-art { width:60px; height:60px; display:block; filter:drop-shadow(0 0 5px rgba(223,182,178,0.28)); }

.reveal-hint { text-align:center; font-size:12.5px; color:var(--text-tertiary); margin-top:20px; }


/* ── AI analysis rendering (shares visual language with quiz's AI section) ── */
.ai-block { display:none; margin-top:28px; }
.ai-block.show { display:block; }
.ai-source-tag { font-size:11px; color:var(--text-quaternary); text-align:center; margin-bottom:16px; letter-spacing:0.02em; }
.ai-headline { font-size:19px; font-weight:800; text-align:center; margin-bottom:22px; letter-spacing:-0.01em; line-height:1.4; }
.ai-section-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; margin-bottom:10px; }
.ai-section-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.ai-icon { width:28px; height:28px; border-radius:8px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0; }
.ai-icon svg { width:15px; height:15px; }
.ai-section-title { font-size:14.5px; font-weight:700; }
.ai-section-body { font-size:13.5px; color:var(--text-secondary); line-height:1.7; }
.ai-closing { margin-top:16px; padding:16px; border-radius:var(--radius-md); background:var(--accent-soft); border:1px solid rgba(223,182,178,0.18); font-size:13.5px; color:var(--text-primary); line-height:1.7; }

.ai-loading { text-align:center; padding:50px 20px; display:none; }
.ai-loading.show { display:block; }
.ai-spinner { width:32px; height:32px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent); margin:0 auto; animation:spin 0.9s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.ai-loading p { margin-top:16px; font-size:13px; color:var(--text-tertiary); line-height:1.7; }

.ai-error { text-align:center; padding:40px 20px; display:none; }
.ai-error.show { display:block; }
.ai-error p { font-size:13.5px; color:var(--text-tertiary); margin-bottom:16px; line-height:1.7; }
.retry-btn { padding:10px 24px; border-radius:100px; background:var(--surface-raised); border:1px solid var(--border); color:var(--text-primary); font-size:13px; }

.actions-row { display:flex; gap:10px; margin-top:18px; }
.actions-row button {
  flex:1; padding:12px; border-radius:100px; font-size:13px; font-weight:600;
  background:var(--surface-raised); border:1px solid var(--border); color:var(--text-secondary);
}
.actions-row button:active { transform:scale(0.97); }

/* ── History link ── */
.history-link {
  display:flex; align-items:center; justify-content:center; gap:6px; margin-top:28px;
  font-size:12.5px; color:var(--text-tertiary); padding:12px;
}

/* ── Toast ── */
.toast {
  position:fixed; bottom:calc(30px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(34,22,44,0.95); backdrop-filter:blur(20px); color:var(--text-primary); padding:11px 20px;
  border-radius:100px; font-size:13px; font-weight:500; z-index:300; opacity:0;
  transition:all .3s var(--ease); border:1px solid rgba(255,255,255,0.09); pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:360px) { .hero-title { font-size:31px; } }
</style>
</head>
<body>

<div class="ambient"></div>

<div class="header">
  <div class="header-inner">
    <button class="back-btn" onclick="location.href='/index.html'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="header-title">塔罗牌</div>
  </div>
</div>

<div class="main">

  <div id="setupScreen">
    <div class="hero-tag">TAROT · AI 深度解读</div>
    <h1 class="hero-title"><span class="grad">抽一张牌，</span><br>看见此刻的自己</h1>
    <p class="hero-sub">结合传统塔罗象征与心理学视角，AI 会参考你的心理测评结果，给出一份属于你的深度解读。</p>

    <div class="spread-select">
      <div class="spread-opt active" id="spreadSingle" onclick="selectSpread('single')">
        <div class="spread-opt-num">01</div>
        <div class="spread-opt-title">单张牌</div>
        <div class="spread-opt-desc">快速抽一张，聚焦当下的状态</div>
      </div>
      <div class="spread-opt" id="spreadThree" onclick="selectSpread('three')">
        <div class="spread-opt-num">02</div>
        <div class="spread-opt-title">过去·现在·未来</div>
        <div class="spread-opt-desc">经典三张牌阵，看见完整脉络</div>
      </div>
    </div>

    <div class="question-block">
      <div class="question-label">你想问什么（可选）</div>
      <textarea class="question-input" id="questionInput" placeholder="比如：最近这段关系该怎么走下去…"></textarea>
    </div>

    <button class="draw-btn" id="drawBtn" onclick="startDraw()">展开卡牌</button>

    <a class="history-link" href="/tarot-history.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path></svg>
      查看历史记录
    </a>
  </div>

  <div class="shuffle-stage" id="shuffleStage">
    <div class="shuffle-ritual" id="shuffleRitual" onclick="doShuffle()">
      <div class="shuffle-deck" id="shuffleDeck">
        <div class="shuffle-card">
          <div class="tcb-frame"></div>
          <span class="tcb-corner tl">+</span><span class="tcb-corner tr">+</span>
          <span class="tcb-corner bl">+</span><span class="tcb-corner br">+</span>
          <div class="tcb-glyph">✦</div>
        </div>
      </div>
    </div>
    <div class="shuffle-progress" id="shuffleProgress"></div>
    <div class="shuffle-hint" id="shuffleHint"></div>
    <div class="shuffle-sub">轻触卡牌，集中意念，默念你的问题，让牌与你建立连接</div>
  </div>

  <div class="draw-stage" id="drawStage">
    <div class="tray" id="tray"></div>
    <div class="stage-hint" id="stageHint"></div>
    <div class="deck-scroller" id="deckSpread"></div>
    <div class="reveal-hint">从这副牌中，凭直觉挑选</div>
  </div>


  <div class="ai-loading" id="aiLoading">
    <div class="ai-spinner"></div>
    <p>正在结合塔罗象征与心理学为你深度解读…<br>通常需要 10–30 秒</p>
  </div>

  <div class="ai-error" id="aiError">
    <p id="aiErrorMsg">解读失败，请重试</p>
    <button class="retry-btn" onclick="requestAnalysis()">重试</button>
  </div>

  <div class="ai-block" id="aiBlock"></div>

var ROMAN = ['','I','II','III','IV','V','VI','VII','VIII','IX','X'];

function cardArt(c){
  var inner;
  if (c.arcana === 'major') {
    inner = MAJOR_ART[c.id] || '';
  } else {
    inner = ELEMENT_GLYPH[c.arcana] || '';
  }
  // 小阿卡纳数字牌：顶部罗马数字
  var num = '';
  if (c.arcana !== 'major') {
    var n = parseInt(String(c.id).slice(1), 10);
    if (n >= 1 && n <= 10) {
      num = '<text x="40" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="'+ART_STROKE+'" opacity="0.85">'+ROMAN[n]+'</text>';
    }
  }
  return '<svg viewBox="0 0 80 80" class="card-art">' +
    '<circle cx="40" cy="40" r="30" fill="rgba(223,182,178,0.06)" stroke="rgba(223,182,178,0.22)" stroke-width="1"/>' +
    '<circle cx="40" cy="40" r="24" fill="none" stroke="rgba(223,182,178,0.12)" stroke-width="0.8" stroke-dasharray="2 3"/>' +
    inner + num +
  '</svg>';
}



function selectSpread(type){
  state.spreadType = type;
  document.getElementById('spreadSingle').classList.toggle('active', type==='single');
  document.getElementById('spreadThree').classList.toggle('active', type==='three');
}

function shuffleDeck(){
  var deck = window.TAROT_DECK.slice();
  for (var i = deck.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }
  return deck;
}

function buildSpread(){
  state.requiredCount = state.spreadType === 'three' ? 3 : 1;
  var deck = shuffleDeck();
  state.spreadCards = deck.slice(0, SPREAD_SIZE).map(function(c){
    return {
      id: c.id, name: c.name, name_en: c.name_en, arcana: c.arcana,
      reversed: Math.random() < 0.5,
      upright_keywords: c.upright, reversed_keywords: c.reversed,
      used: false
    };
  });

  state.pickedCount = 0;
  state.drawnCards = [];
}

function startDraw(){
  if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }

  buildSpread();
  document.getElementById('setupScreen').style.display = 'none';

  // 进入洗牌仪式
  state.shuffleCount = 0;
  var shuffleStage = document.getElementById('shuffleStage');
  shuffleStage.classList.remove('fade-out');
  shuffleStage.style.display = 'block';

  var ritual = document.getElementById('shuffleRitual');
  ritual.classList.remove('done', 'glow', 'shaking', 'spinning');

  renderShuffleProgress();
  document.getElementById('shuffleHint').textContent = SHUFFLE_HINTS[0];
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderShuffleProgress(){
  var wrap = document.getElementById('shuffleProgress');
  var html = '';
  for (var i = 0; i < SHUFFLE_TARGET; i++) {
    html += '<div class="shuffle-dot' + (i < state.shuffleCount ? ' lit' : '') + '"></div>';
  }
  wrap.innerHTML = html;
}

function doShuffle(){
  if (state.shuffleCount >= SHUFFLE_TARGET) return;

  var ritual = document.getElementById('shuffleRitual');
  if (ritual.classList.contains('done')) return;

  state.shuffleCount++;
  renderShuffleProgress();

  // 动画反馈
  ritual.classList.remove('shaking', 'spinning');
  void ritual.offsetWidth; // 强制重排以重启动画
  if (state.shuffleCount >= SHUFFLE_TARGET) {
    ritual.classList.add('spinning');
  } else {
    ritual.classList.add('shaking');
  }
  if (state.shuffleCount >= 2) ritual.classList.add('glow');

  document.getElementById('shuffleHint').textContent = SHUFFLE_HINTS[Math.min(state.shuffleCount, SHUFFLE_HINTS.length - 1)];

  if (state.shuffleCount >= SHUFFLE_TARGET) {
    setTimeout(finishShuffle, 900);
  }
}

function finishShuffle(){
  var ritual = document.getElementById('shuffleRitual');
  ritual.classList.add('done');

  var shuffleStage = document.getElementById('shuffleStage');
  shuffleStage.classList.add('fade-out');

  setTimeout(function(){
    shuffleStage.style.display = 'none';

    var stage = document.getElementById('drawStage');
    stage.classList.remove('fade-out');
    stage.style.display = 'block';

    renderTray();
    renderSpread();
    updateHint();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 500);
}


function renderTray(){
  var tray = document.getElementById('tray');
  var n = state.requiredCount;
  var labels = state.spreadType === 'three' ? POSITION_LABELS : [null];
  var html = '';
  for (var i = 0; i < n; i++) {
    html += '<div class="tray-slot" data-tray="'+i+'">' +
      (labels[i] ? '<div class="tray-slot-label">'+labels[i]+'</div>' : '') +
      '<div class="tray-slot-content" data-content="'+i+'"><span class="tray-slot-empty">?</span></div>' +
    '</div>';
  }
  tray.innerHTML = html;
}

function renderSpread(){
  var wrap = document.getElementById('deckSpread');
  var html = state.spreadCards.map(function(c, i){
    var tilt = (Math.random() * 10 - 5).toFixed(1);
    return '<div class="tarot-card" data-slot="'+i+'" style="--tilt:'+tilt+'deg" onclick="pickCard('+i+')">' +
        '<div class="tarot-card-inner">' +
          '<div class="tarot-card-face tarot-card-back">' +
            '<div class="tcb-frame"></div>' +
            '<span class="tcb-corner tl">+</span><span class="tcb-corner tr">+</span>' +
            '<span class="tcb-corner bl">+</span><span class="tcb-corner br">+</span>' +
            '<div class="tcb-glyph">✦</div>' +
          '</div>' +
          '<div class="tarot-card-face tarot-card-front' + (c.reversed?' reversed':'') + '">' +
            '<div class="tcf-badge">CARD</div>' +
            '<div class="tcf-symbol">'+cardArt(c)+'</div>' +
            '<div class="tcf-name">'+esc(c.name)+'</div>' +
            '<div class="tcf-dir">'+(c.reversed?'逆位':'正位')+'</div>' +

          '</div>' +
        '</div>' +
        '<div class="flip-glare"></div>' +
      '</div>';
  }).join('');
  wrap.innerHTML = html;
}

function updateHint(){
  var hintEl = document.getElementById('stageHint');
  var hints = state.spreadType === 'three' ? THREE_HINTS : SINGLE_HINTS;
  hintEl.textContent = hints[state.pickedCount] || '';
}

function fillTraySlot(slotIdx, c){
  var content = document.querySelector('.tray-slot-content[data-content="'+slotIdx+'"]');
  if (!content) return;
  content.parentElement.classList.add('filled');
  content.innerHTML = '<div class="tray-card-name">'+esc(c.name)+'</div><div class="tray-card-dir">'+(c.reversed?'逆位':'正位')+'</div>';
}

function pickCard(idx){
  if (state.pickedCount >= state.requiredCount) return;
  var c = state.spreadCards[idx];
  if (!c || c.used) return;
  c.used = true;

  var el = document.querySelector('.tarot-card[data-slot="'+idx+'"]');
  if (!el) return;

  var pickPosition = state.pickedCount;
  el.classList.add('selecting');

  setTimeout(function(){
    el.classList.add('flipped', 'flipping');
  }, 300);

  setTimeout(function(){
    el.classList.remove('flipping');
    fillTraySlot(pickPosition, c);
  }, 300 + 750);

  setTimeout(function(){
    el.classList.remove('selecting');
    el.classList.add('picked');
  }, 300 + 750 + 1200);

  state.drawnCards.push({
    id: c.id, name: c.name, name_en: c.name_en, reversed: c.reversed,
    upright_keywords: c.upright_keywords, reversed_keywords: c.reversed_keywords
  });
  state.pickedCount++;
  updateHint();

  if (state.pickedCount === state.requiredCount) {
    setTimeout(function(){ finishSelection(); }, 300 + 750 + 1200 + 500);
  }
}

function finishSelection(){
  var stage = document.getElementById('drawStage');
  stage.classList.add('fade-out');
  setTimeout(function(){
    stage.style.display = 'none';
    requestAnalysis();
  }, 500);
}

async function requestAnalysis(){
  document.getElementById('aiError').classList.remove('show');
  document.getElementById('aiBlock').classList.remove('show');
  document.getElementById('aiLoading').classList.add('show');

  var question = document.getElementById('questionInput').value.trim();

  try {
    var r = await fetch('/tarot/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        spreadType: state.spreadType,
        cards: state.drawnCards,
        question: question,
        useQuizContext: true
      })
    });
    var data = await r.json().catch(function(){ return {}; });

    document.getElementById('aiLoading').classList.remove('show');

    if (!r.ok) {
      showAiError(data.message || '请求失败，请稍后重试');
      return;
    }

    if (data.analysis) {
      renderAiSuccess(data.analysis);
    } else if (data.analysisRaw) {
      renderAiPlainFallback(data.analysisRaw);
    } else {
      showAiError('AI 未返回有效内容，请重试');
    }
  } catch (e) {
    document.getElementById('aiLoading').classList.remove('show');
    showAiError('网络连接失败，请检查网络后重试');
  }
}

function showAiError(msg){
  document.getElementById('aiErrorMsg').textContent = msg;
  document.getElementById('aiError').classList.add('show');
}

function renderAiSuccess(analysis){
  var container = document.getElementById('aiBlock');
  var headline = analysis.headline || '';
  var sections = Array.isArray(analysis.sections) ? analysis.sections : [];
  var closing = analysis.closing || '';

  var html = '<div class="ai-source-tag">由 AI 结合塔罗象征与心理学理论生成</div>';
  if (headline) html += '<div class="ai-headline">'+esc(headline)+'</div>';

  sections.forEach(function(sec){
    var iconSvg = AI_ICONS[sec.icon] || AI_ICONS.spark;
    html += '<div class="ai-section-card">' +
      '<div class="ai-section-head"><div class="ai-icon">'+iconSvg+'</div><div class="ai-section-title">'+esc(sec.title||'')+'</div></div>' +
      '<div class="ai-section-body">'+esc(sec.body||'')+'</div>' +
    '</div>';
  });

  if (closing) html += '<div class="ai-closing">'+esc(closing)+'</div>';

  html += '<div class="actions-row">' +
    '<button onclick="resetDraw()">再抽一次</button>' +
    '<button onclick="location.href=\'/tarot-history.html\'">查看历史</button>' +
  '</div>';

  container.innerHTML = html;
  container.classList.add('show');
}

function renderAiPlainFallback(text){
  var container = document.getElementById('aiBlock');
  var paras = text.split(/\n{1,}/).filter(function(p){ return p.trim(); });
  var html = '<div class="ai-source-tag">由 AI 结合塔罗象征与心理学理论生成</div>';
  html += paras.map(function(p){ return '<div class="ai-section-card"><div class="ai-section-body">'+esc(p)+'</div></div>'; }).join('');
  html += '<div class="actions-row"><button onclick="resetDraw()">再抽一次</button></div>';
  container.innerHTML = html;
  container.classList.add('show');
}

function resetDraw(){
  state.spreadCards = [];
  state.pickedCount = 0;
  state.drawnCards = [];
  state.shuffleCount = 0;

  // 重置洗牌仪式状态
  var shuffleStage = document.getElementById('shuffleStage');
  shuffleStage.classList.remove('fade-out');
  shuffleStage.style.display = 'none';
  var ritual = document.getElementById('shuffleRitual');
  ritual.classList.remove('done', 'glow', 'shaking', 'spinning');

  document.getElementById('drawStage').classList.remove('fade-out');
  document.getElementById('drawStage').style.display = 'none';
  document.getElementById('aiBlock').classList.remove('show');
  document.getElementById('aiError').classList.remove('show');
  document.getElementById('questionInput').value = '';
  document.getElementById('setupScreen').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}


if (!Auth.isLoggedIn()) {
  Auth.onAuthChange(function(){});
}
</script>
</body>
</html>
