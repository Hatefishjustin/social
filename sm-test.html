<style>
:root{
  --font-serif: -apple-system, 'PingFang SC', 'Songti SC', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
               'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;

  --bg: #0d0710;
  --bg-elevated: #150c1c;
  --surface: #1a1122;
  --surface-hover: #22162c;
  --hairline: rgba(255,255,255,0.08);
  --hairline-strong: rgba(255,255,255,0.14);

  --text-primary: #f7ede8;
  --text-secondary: #b3a3ae;
  --text-tertiary: #7c6c78;

  --accent: #dfb6b2;
  --accent-dim: #c9908c;
  --accent-glow: rgba(82,43,91,0.32);
  --accent-soft: rgba(223,182,178,0.09);

  --ink: var(--bg);
  --ink-deep: var(--bg-elevated);
  --parchment: var(--text-primary);
  --parchment-dim: var(--text-secondary);
  --rouge: var(--accent);
  --rouge-dim: var(--accent-dim);
  --gold: var(--accent);
  --line: var(--hairline);
}
*{margin:0;padding:0;box-sizing:border-box;}
.hidden{display:none !important;}
html,body{

  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-sans);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body{
  background-image:
    radial-gradient(ellipse 1000px 600px at 20% -10%, var(--accent-soft), transparent),
    radial-gradient(ellipse 800px 500px at 100% 100%, rgba(255,255,255,0.03), transparent);
}
::selection{background:var(--rouge);color:var(--parchment);}

.stage{
  max-width:640px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:0 24px;
}

/* ---------- Progress ---------- */
.progress-wrap{
  position:sticky;
  top:0;
  padding:18px 0 12px;
  background:linear-gradient(var(--ink) 80%, transparent);
  z-index:10;
}
.progress-track{
  height:1px;
  background:var(--line);
  position:relative;
  overflow:visible;
}
.progress-fill{
  height:1px;
  background:var(--rouge);
  width:0%;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.progress-fill::after{
  content:'';
  position:absolute;
  right:-3px; top:50%;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--rouge);
  transform:translateY(-50%);
  box-shadow:0 0 8px var(--rouge);
}
.progress-meta{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  letter-spacing:0.08em;
  color:var(--parchment-dim);
  margin-top:10px;
  font-family:var(--font-sans);
}
.progress-meta .section-tag{color:var(--gold);}

/* ---------- Landing ---------- */
.landing{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px 0 80px;
  animation:fadeUp .8s cubic-bezier(.16,1,.3,1) both;
}
.glyph-mark{
  width:52px;height:52px;
  margin-bottom:32px;
}
.glyph-mark svg{width:100%;height:100%;}
.hero-title{
  font-family:var(--font-sans);
  font-size:52px;
  font-weight:700;
  letter-spacing:-0.03em;
  line-height:1.08;
  margin-bottom:12px;
  color:var(--text-primary);
}
.hero-subtitle{
  font-size:18px;
  font-weight:500;
  color:var(--text-secondary);
  letter-spacing:-0.01em;
  margin-bottom:22px;
}
.landing p.lede{
  font-size:14.5px;
  line-height:1.85;
  color:var(--text-tertiary);
  max-width:460px;
  margin-bottom:8px;
}
.landing .frameworks{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:28px 0 36px;
}
.fw-chip{
  font-size:12.5px;
  padding:7px 15px;
  border:1px solid var(--hairline-strong);
  border-radius:100px;
  color:var(--text-secondary);
  letter-spacing:0.01em;
  background:var(--surface);
}
.meta-row{
  display:flex;
  gap:32px;
  margin-bottom:40px;
  font-size:13px;
  color:var(--text-tertiary);
}
.meta-row strong{
  display:block;
  font-family:var(--font-sans);
  font-size:20px;
  color:var(--text-primary);
  font-weight:700;
  letter-spacing:-0.01em;
}
.btn-primary{
  align-self:flex-start;
  background:var(--accent);
  color:#fff;
  border:none;
  padding:16px 34px;
  font-size:16px;
  font-weight:600;
  font-family:var(--font-sans);
  letter-spacing:-0.01em;
  cursor:pointer;
  border-radius:100px;
  transition:all .25s cubic-bezier(.16,1,.3,1);
  position:relative;
  overflow:hidden;
}
.btn-primary:hover{
  background:var(--accent-dim);
  transform:translateY(-1px) scale(1.01);
  box-shadow:0 12px 32px var(--accent-glow);
}
.btn-primary:active{
  transform:translateY(0) scale(0.98);
}
.btn-primary:disabled{
  opacity:0.3;
  cursor:default;
  transform:none;
  box-shadow:none;
}
.btn-secondary{
  background:var(--surface);
  color:var(--text-primary);
  border:1px solid var(--hairline-strong);
  padding:15px 30px;
  font-size:14.5px;
  font-weight:500;
  font-family:var(--font-sans);
  cursor:pointer;
  border-radius:100px;
  transition:all .2s cubic-bezier(.16,1,.3,1);
}
.btn-secondary:hover{
  background:var(--surface-hover);
  border-color:rgba(255,255,255,0.24);
}
.btn-secondary:active{
  transform:scale(0.98);
}
.privacy-note{
  margin-top:20px;
  font-size:12px;
  color:var(--text-tertiary);
  max-width:440px;
  line-height:1.7;
}

/* ---------- Question ---------- */
.question-screen{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:40px 0 60px;
  min-height:70vh;
}
.q-card{
  animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both;
}
.q-eyebrow{
  font-size:12px;
  letter-spacing:0.08em;
  color:var(--text-tertiary);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}
.q-eyebrow::before{
  content:'';
  width:16px;height:1px;
  background:var(--hairline-strong);
}
.q-text{
  font-family:var(--font-serif);
  font-size:24px;
  font-weight:600;
  line-height:1.55;
  margin-bottom:8px;
}
.q-sub{
  font-size:13px;
  color:var(--parchment-dim);
  margin-bottom:14px;
  line-height:1.7;
}
.q-dim-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--rouge);
  border:1px solid rgba(223,182,178,0.3);
  padding:5px 12px;
  border-radius:100px;
  margin-bottom:24px;
}
.options{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:28px;
}
.option{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 20px;
  border:1px solid transparent;
  border-radius:16px;
  cursor:pointer;
  transition:all .2s cubic-bezier(.16,1,.3,1);
  background:var(--surface);
}
.option:hover{
  background:var(--surface-hover);
}
.option.selected{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.option .mark{
  flex-shrink:0;
  width:20px;height:20px;
  border:1.5px solid rgba(255,255,255,0.28);
  border-radius:50%;
  position:relative;
  transition:all .2s cubic-bezier(.16,1,.3,1);
}
.option.selected .mark{
  border-color:var(--accent);
  background:var(--accent);
}
.option.selected .mark::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:7px;height:7px;
  border-radius:50%;
  background:#fff;
  transform:translate(-50%,-50%);
}
.option.pulse{
  animation:optionPulse .3s cubic-bezier(.16,1,.3,1);
}
.option.dimmed{
  opacity:0.45;
  transform:scale(0.98);
}
@keyframes optionPulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.03);}
  100%{transform:scale(1);}
}
.option .txt{

  font-size:15px;
  line-height:1.5;
  color:var(--text-primary);
  font-weight:450;
}
.option .val{
  margin-left:auto;
  font-size:12px;
  color:var(--text-tertiary);
  white-space:nowrap;
}
.q-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
}
.nav-back{
  font-size:13.5px;
  color:var(--text-tertiary);
  cursor:pointer;
  background:none;
  border:none;
  font-family:var(--font-sans);
  font-weight:500;
  transition:color .2s;
  white-space:nowrap;
}
.nav-back:hover{color:var(--text-primary);}
.nav-back:disabled{opacity:0.3;cursor:default;}
.nav-back:disabled:hover{color:var(--text-tertiary);}
.nav-next{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:13px 30px;
  font-size:14.5px;
  font-weight:600;
  font-family:var(--font-sans);
  letter-spacing:-0.01em;
  cursor:pointer;
  border-radius:100px;
  transition:all .2s cubic-bezier(.16,1,.3,1);
  flex-shrink:0;
}
.nav-next:hover{background:var(--rouge-dim);}
.nav-next:disabled{
  opacity:0.3;
  cursor:default;
  background:var(--line);
  color:var(--parchment-dim);
}

/* ---------- Result ---------- */
.result-screen{
  flex:1;
  padding:40px 0 80px;
  animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both;
}
.result-screen.hidden{display:none;}
.result-head{
  text-align:center;
  margin-bottom:40px;
}
.result-eyebrow{
  font-size:12px;
  letter-spacing:0.12em;
  color:var(--text-tertiary);
  margin-bottom:16px;
  font-weight:600;
}
.result-title{
  font-family:var(--font-serif);
  font-size:34px;
  font-weight:700;
  letter-spacing:-0.02em;
  line-height:1.3;
  margin-bottom:10px;
}
.result-sub{
  font-size:14px;
  color:var(--text-secondary);
  line-height:1.7;
  max-width:480px;
  margin:0 auto;
}
.type-badge{
  display:inline-block;
  margin-top:20px;
  padding:10px 26px;
  border:1px solid var(--accent);
  border-radius:100px;
  color:var(--accent);
  font-size:15px;
  font-weight:600;
  letter-spacing:0.04em;
  background:var(--accent-soft);
}
.type-desc{
  margin-top:16px;
  font-size:14px;
  color:var(--text-secondary);
  line-height:1.8;
  max-width:480px;
  margin-left:auto;
  margin-right:auto;
}

/* ---------- Score bars ---------- */
.score-section{
  margin-top:36px;
}
.score-section-title{
  font-size:13px;
  letter-spacing:0.08em;
  color:var(--text-tertiary);
  margin-bottom:20px;
  font-weight:600;
}
.score-row{
  margin-bottom:18px;
}
.score-row-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:8px;
}
.score-row-name{
  font-size:14px;
  color:var(--text-primary);
  font-weight:500;
}
.score-row-pct{
  font-size:13px;
  color:var(--accent);
  font-weight:600;
}
.score-bar-track{
  height:6px;
  border-radius:100px;
  background:var(--surface);
  overflow:hidden;
}
.score-bar-fill{
  height:100%;
  border-radius:100px;
  background:linear-gradient(90deg, var(--accent-dim), var(--accent));
  width:0%;
  transition:width 1s cubic-bezier(.16,1,.3,1);
}

/* ---------- AI analysis ---------- */
.ai-section{
  margin-top:44px;
}
.ai-source-tag{
  font-size:11.5px;
  letter-spacing:0.06em;
  color:var(--text-tertiary);
  margin-bottom:20px;
  text-align:center;
}
.ai-headline{
  font-family:var(--font-serif);
  font-size:22px;
  font-weight:600;
  line-height:1.5;
  margin-bottom:24px;
  color:var(--text-primary);
}
.ai-section-card{
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:16px;
  padding:22px 24px;
  margin-bottom:14px;
}
.ai-section-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.ai-icon{
  width:34px;height:34px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:var(--accent-soft);
  color:var(--accent);
}
.ai-icon svg{width:18px;height:18px;}
.ai-section-title{
  font-size:15px;
  font-weight:600;
  color:var(--text-primary);
}
.ai-section-body{
  font-size:14px;
  line-height:1.85;
  color:var(--text-secondary);
}
.ai-closing{
  margin-top:20px;
  padding:20px 24px;
  border-left:2px solid var(--accent);
  background:var(--accent-soft);
  border-radius:0 12px 12px 0;
  font-size:14px;
  line-height:1.85;
  color:var(--text-secondary);
}
.ai-spinner{
  width:28px;height:28px;
  border:2px solid var(--hairline-strong);
  border-top-color:var(--accent);
  border-radius:50%;
  margin:0 auto;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Disclaimer ---------- */
.disclaimer{
  margin-top:40px;
  padding:18px 20px;
  border:1px dashed var(--hairline-strong);
  border-radius:12px;
  font-size:12px;
  line-height:1.8;
  color:var(--text-tertiary);
}

/* ---------- Result actions ---------- */
.result-actions{
  display:flex;
  gap:12px;
  margin-top:32px;
  flex-wrap:wrap;
}

/* ---------- Hidden entry ---------- */
.hidden-entry{
  text-align:center;
  margin-top:40px;
  padding-top:28px;
  border-top:1px solid var(--hairline);
}
.hidden-entry .entry-label{
  font-size:11px;
  letter-spacing:0.1em;
  color:var(--text-tertiary);
  margin-bottom:12px;
}
.hidden-entry .entry-btn{
  display:inline-flex;
  align-items:center;

  border:1px solid var(--hairline-strong);

  border-radius:100px;
  font-size:13.5px;
  font-weight:500;
  font-family:var(--font-sans);
  cursor:pointer;
  transition:all .2s cubic-bezier(.16,1,.3,1);

}
.hidden-entry .entry-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--accent-soft);
}
.hidden-entry .entry-btn svg{width:15px;height:15px;}

/* ---------- Animations ---------- */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}

/* ---------- Mobile ---------- */
@media (max-width:480px){
  .stage{padding:0 18px;}
  .hero-title{font-size:40px;}
  .hero-subtitle{font-size:16px;}
  .q-text{font-size:21px;}
  .option{padding:14px 16px;}
  .option .txt{font-size:14px;}
  .result-title{font-size:28px;}
  .meta-row{gap:20px;}
  .result-actions{flex-direction:column;}
  .result-actions .btn-primary,
  .result-actions .btn-secondary{width:100%;text-align:center;}
}
</style>
</head>

<div class="stage">

<script>
/* =========================================================
   S/M 互动倾向测试
   30 道题，5 个维度（每维度 6 题）
   五级评分：1 完全不同意 ~ 5 完全同意
   ========================================================= */

const DIMENSIONS = {
  dominance: { label: 'Dominance · 主导倾向', short: 'S 倾向' },
  submission: { label: 'Submission · 接受倾向', short: 'M 倾向' },
  switch: { label: 'Switch · 双向适应', short: 'Switch' },
  consent: { label: 'Consent · 边界意识', short: '边界意识' },
  trust: { label: 'Trust · 信任建立', short: '信任建立' },
};

const QUESTIONS = [
  // ---- Dominance (S) ----
  { dim: 'dominance', text: '在亲密关系中，我喜欢承担更多决策和规划责任。' },
  { dim: 'dominance', text: '当需要做重要决定时，我倾向于主动提出方案并推动执行。' },
  { dim: 'dominance', text: '我享受在关系中引导对方、安排节奏的感觉。' },
  { dim: 'dominance', text: '我更愿意成为关系中"拿主意"的那个人。' },
  { dim: 'dominance', text: '当对方犹豫不决时，我会自然地站出来做决定。' },
  { dim: 'dominance', text: '我喜欢为关系设定一些共同的规则或习惯。' },

  // ---- Submission (M) ----
  { dim: 'submission', text: '当我非常信任一个人时，我愿意接受对方的引导。' },
  { dim: 'submission', text: '在亲密关系中，我享受被对方照顾和安排的感觉。' },
  { dim: 'submission', text: '比起自己做决定，我更希望对方能主动为我考虑。' },
  { dim: 'submission', text: '当对方提出建议时，我通常愿意配合和跟随。' },
  { dim: 'submission', text: '我更喜欢对方在关系中承担更多主动权。' },
  { dim: 'submission', text: '在信任的人面前，我乐于放下防备、接受安排。' },

function startQuiz(){

function renderQuestion(){
  const q = QUESTIONS[current];
  const dim = DIMENSIONS[q.dim];

  let optionsHtml = '';
  SCALE_LABELS.forEach((label, i) => {
    const val = i + 1;
    const isSel = selected === val;
    optionsHtml += `
      <div class="option ${isSel ? 'selected' : ''}" data-val="${val}" onclick="selectAnswer(${val})">
        <div class="mark"></div>
        <div class="txt">${label}</div>
        <div class="val">${val}</div>

  });

  qCard.innerHTML = `

}

let isAdvancing = false;

function selectAnswer(val){
  if (isAdvancing) return; // 防止重复点击导致跳题错误
  answers[current] = val;

  // 选中动画反馈
  const options = document.querySelectorAll('.option');
  options.forEach(opt => {
    const optVal = parseInt(opt.getAttribute('data-val') || opt.querySelector('.val')?.textContent || '0', 10);
    if (optVal === val) {
      opt.classList.add('selected');
      opt.classList.add('pulse');
    } else {
      opt.classList.add('dimmed');
    }
  });

  // 轻微延迟后自动进入下一题
  isAdvancing = true;
  setTimeout(() => {
    if (current < QUESTIONS.length - 1) {
      current++;
      renderQuestion();
    } else {
      computeResult();
    }
    isAdvancing = false;
  }, 280);
}


function prevQuestion(){
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function nextQuestion(){
  if (answers[current] === null) return;
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
  } else {
    computeResult();
  }
}

/* =========================================================
   评分算法
   ========================================================= */
function computeResult(){
  // 计算各维度平均分
  const dimScores = {};
  Object.keys(DIMENSIONS).forEach(dim => {
    const items = QUESTIONS.map((q, i) => ({ q, i })).filter(x => x.q.dim === dim);
    const sum = items.reduce((acc, x) => acc + (answers[x.i] || 0), 0);
    dimScores[dim] = sum / items.length;
  });

  const sScore = dimScores.dominance;
  const mScore = dimScores.submission;
  const switchScore = dimScores.switch;
  const consentScore = dimScores.consent;
  const trustScore = dimScores.trust;

  // 判定结果类型
  let resultType;
  const sPct = sScore / 5 * 100;
  const mPct = mScore / 5 * 100;
  const switchPct = switchScore / 5 * 100;

  // Switch 高分优先（双向适应能力强）
  if (switchScore >= 4.0) {
    resultType = 'Switch';
  } else if (Math.abs(sScore - mScore) < 0.5) {
    resultType = 'Balanced';
  } else if (sScore > mScore) {
    resultType = 'S';
  } else {
    resultType = 'M';
  }

  resultData = {
    sScore, mScore, switchScore, consentScore, trustScore,
    sPct: Math.round(sPct), mPct: Math.round(mPct), switchPct: Math.round(switchPct),
    resultType,
  };

  renderResult();
  saveResult();
}

async function fetchAiAnalysis(){
  const container = document.getElementById('aiContent');
  if(!container || !resultData) return;

  container.innerHTML = `
    <div style="text-align:center;padding:50px 20px;">
      <div class="ai-spinner"></div>
      <p style="margin-top:20px;font-size:13.5px;color:var(--text-tertiary);line-height:1.8;">正在请 AI 结合心理学理论为你做深度解读…<br>通常需要 10–30 秒</p>
    </div>
  `;

  try{
    const resp = await fetch('/api/sm-analyze', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        payload: {
          sScore: resultData.sScore,
          mScore: resultData.mScore,
          switchScore: resultData.switchScore,
          trustScore: resultData.trustScore,
          consentScore: resultData.consentScore,
          resultType: resultData.resultType,
        }
      })
    });

    const data = await resp.json().catch(()=>({}));

    if(!resp.ok){
      renderAiError(data.message || '请求失败，请稍后重试');
      return;
    }

    if(data.analysis){
      renderAiSuccess(data.analysis);
    }else if(data.analysisRaw){
      renderAiSuccessPlainFallback(data.analysisRaw);
    }else{
      renderAiError('AI 未返回有效内容，请重试');
    }
  }catch(e){
    renderAiError('网络连接失败，请检查网络后重试');
  }
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
}




/* =========================================================
   结果保存（匿名）
   ========================================================= */
async function saveResult(){
  if(!resultData) return;
  try{
    let visitorToken = '';
    if (window.SMTrack && window.SMTrack.getVisitorToken) {
      visitorToken = window.SMTrack.getVisitorToken();
    }
    // 如果用户已登录，附带用户ID（后端也会从 session cookie 解析，双保险）
    let userId = null;
    if (window.Auth && window.Auth.isLoggedIn && window.Auth.isLoggedIn()) {
      userId = window.Auth.getUserId();
    }
    await fetch('/api/sm-save', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        sScore: resultData.sScore,
        mScore: resultData.mScore,
        switchScore: resultData.switchScore,
        trustScore: resultData.trustScore,
        consentScore: resultData.consentScore,
        resultType: resultData.resultType,
        visitorToken,
        userId,
      })
    });
  }catch(e){
    // 保存失败不影响用户体验
  }
  if (window.trackEvent) window.trackEvent('quiz_complete', { quiz_type: 'sm_interaction' });
}


function restartQuiz(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  resultData = null;
  resultScreen.classList.add('hidden');
  landing.classList.remove('hidden');
  progressWrap.classList.add('hidden');
  window.scrollTo({top:0});
}

// 页面访问统计
fetch('/api/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'sm-test'})}).catch(function(){});
</script>
