<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用户主页</title>
<style>
  :root {
    --bg: #0d0710;
    --card: #1a1122;
    --border: #2c2033;
    --text: #f7ede8;
    --muted: #7c6c78;
    --accent: #dfb6b2;
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 500px; margin: 0 auto; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .header h1 { font-size: 20px; font-weight: 700; color: #fff; }
  .header-brand { display: flex; align-items: center; gap: 8px; }
  .header-brand-icon { width: 22px; height: 22px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(223,182,178,.35)); }
  .back-btn { color: var(--muted); text-decoration: none; font-size: 14px; transition: color .2s; }
  .back-btn:hover { color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card-title { font-size: 13px; color: var(--muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }

  .avatar-section { text-align: center; margin-bottom: 8px; }
  .avatar-preview {
    width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--accent); background: #1a1a1e;
    box-shadow: 0 0 24px rgba(82,43,91,0.35);
  }
  .avatar-placeholder {
    width: 100px; height: 100px; border-radius: 50%; border: 2px dashed var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 32px;
  }
  .user-name { text-align: center; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .user-meta { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .user-bio { text-align: center; font-size: 14px; color: var(--text); line-height: 1.6; padding: 0 10px; }

  .tag-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tag-pill {
    padding: 4px 12px; border-radius: 100px; font-size: 12px;
    background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--text);
  }
  .tag-pill.accent { border-color: var(--accent); color: var(--accent); background: rgba(223,182,178,.09); }

  /* ── 人格画像横向滑动画卡 ── */
  .trait-scroll {
    display: flex; gap: 10px; overflow-x: auto; padding: 16px 0 8px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .trait-scroll::-webkit-scrollbar { display: none; }
  .trait-card {
    flex: 0 0 130px; scroll-snap-align: start;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 14px; text-align: center;
    transition: border-color .2s, transform .2s;
  }
  .trait-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .trait-card .trait-icon { font-size: 26px; margin-bottom: 8px; }
  .trait-card .trait-name { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .trait-card .trait-val { font-size: 14px; font-weight: 600; color: #fff; }
  .trait-card .trait-bar {
    height: 3px; border-radius: 2px; background: var(--border);
    margin-top: 10px; overflow: hidden;
  }
  .trait-card .trait-bar-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), #e88a9e);
  }

  .answer-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .answer-item:last-child { border-bottom: none; padding-bottom: 0; }
  .answer-q { font-size: 14px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .answer-a { font-size: 15px; color: var(--text); line-height: 1.6; margin-bottom: 6px; }
  .answer-time { font-size: 11px; color: var(--muted); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; width: calc(100% - 32px); max-width: 400px;
  }
  .modal h3 { font-size: 17px; color: #fff; margin-bottom: 16px; }
  .modal textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
    resize: vertical; min-height: 100px; line-height: 1.5;
  }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-chars { font-size: 11px; color: var(--muted); text-align: right; margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 100px;
    font-size: 14px; font-weight: 600; cursor: pointer; border: none;
    font-family: inherit; transition: all .2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #c9908c; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255,255,255,.1); }

  .anon-toggle { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 13px; color: var(--muted); }
  .anon-toggle input[type="checkbox"] { accent-color: var(--accent); }

  .ask-btn-bar { margin-top: 16px; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 100px; font-size: 14px;
    background: #333; color: #fff; z-index: 9999; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }

  /* ── 动态（朋友圈/小红书式） ── */
  .moment-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .moment-item:last-child { border-bottom: none; }
  .moment-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .moment-avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    border: 1px solid var(--border); background: #1a1a1e; flex-shrink: 0;
  }
  .moment-avatar-ph {
    width: 40px; height: 40px; border-radius: 50%; border: 1px dashed var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 16px; flex-shrink: 0;
  }
  .moment-name { font-size: 14px; font-weight: 600; color: #fff; }
  .moment-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .moment-content { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .moment-images { display: grid; gap: 4px; margin-bottom: 10px; }
  .moment-images.grid-1 { grid-template-columns: 1fr; }
  .moment-images.grid-2 { grid-template-columns: 1fr 1fr; }
  .moment-images.grid-3, .moment-images.grid-4 { grid-template-columns: 1fr 1fr; }
  .moment-images.grid-5, .moment-images.grid-6 { grid-template-columns: 1fr 1fr 1fr; }
  .moment-images.grid-7, .moment-images.grid-8, .moment-images.grid-9 { grid-template-columns: 1fr 1fr 1fr; }
  .moment-img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px;
    cursor: pointer; background: #1a1a1e; border: 1px solid var(--border);
  }
  .moment-actions { display: flex; gap: 20px; align-items: center; }
  .moment-action {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--muted); cursor: pointer; background: none;
    border: none; font-family: inherit; padding: 4px 0; transition: color .2s;
  }
  .moment-action:hover { color: var(--accent); }
  .moment-action.liked { color: var(--accent); }
  .moment-comments { margin-top: 10px; background: rgba(255,255,255,.03); border-radius: 10px; padding: 10px; }
  .moment-comment { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 6px; }
  .moment-comment:last-child { margin-bottom: 0; }
  .moment-comment .c-name { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .moment-comment-input { display: flex; gap: 8px; margin-top: 8px; }
  .moment-comment-input input {
    flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,.04); color: #fff; font-size: 13px; outline: none; font-family: inherit;
  }
  .moment-comment-input input:focus { border-color: var(--accent); }
  .moment-comment-input button {
    padding: 8px 14px; border-radius: 8px; border: none; background: var(--accent);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .moment-comment-input button:disabled { opacity: .4; cursor: not-allowed; }

  /* 图片查看弹层 */
  .img-viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 2000;
    display: flex; align-items: center; justify-content: center; cursor: zoom-out;
  }
  .img-viewer img { max-width: 95%; max-height: 95%; border-radius: 8px; }

  /* ── 动态发布（仅本人可见） ── */
  .moment-composer { margin-bottom: 16px; }
  .moment-composer textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
    resize: vertical; min-height: 80px; line-height: 1.5; box-sizing: border-box;
  }
  .moment-composer textarea:focus { border-color: var(--accent); }
  .moment-composer-chars { font-size: 11px; color: var(--muted); text-align: right; margin-top: 4px; }
  .moment-composer-tools { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .moment-add-img {
    padding: 8px 14px; border-radius: 8px; border: 1px dashed var(--border);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all .2s;
  }
  .moment-add-img:hover { border-color: var(--accent); color: var(--accent); }
  .moment-preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .moment-preview-item { position: relative; width: 72px; height: 72px; }
  .moment-preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .moment-preview-item .remove {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    border-radius: 50%; background: #e74c3c; color: #fff; border: none;
    font-size: 12px; line-height: 20px; text-align: center; cursor: pointer;
  }
  .moment-publish-btn {
    margin-left: auto; padding: 9px 20px; border-radius: 100px; border: none;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .moment-publish-btn:disabled { opacity: .4; cursor: not-allowed; }
</style>


</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-brand">
      <img class="header-brand-icon" src="/logo-icon.png" alt="SoulMirror">
      <h1 id="pageTitle">用户主页</h1>
    </div>
    <a href="javascript:history.back()" class="back-btn">返回</a>
  </div>

  <div class="card" id="profileCard">
    <div class="avatar-section">
      <img id="avatarImg" class="avatar-preview" src="" style="display:none" alt="头像">
      <div id="avatarPlaceholder" class="avatar-placeholder">?</div>
    </div>
    <div id="userName" class="user-name">...</div>
    <div id="userMeta" class="user-meta"></div>
    <div id="userBio" class="user-bio"></div>
    <div id="scoresRow" class="tag-row"></div>
    <div id="traitScroll" class="trait-scroll" style="display:none"></div>
  </div>

  <div class="card">
    <div class="card-title">动态</div>
    <div class="moment-composer" id="momentComposer" style="display:none">
      <textarea id="momentContent" placeholder="分享此刻的心情、照片..." maxlength="1000" oninput="updateMomentChars()"></textarea>
      <div class="moment-composer-chars"><span id="momentChars">0</span>/1000</div>
      <div class="moment-composer-tools">
        <button class="moment-add-img" onclick="document.getElementById('momentImgInput').click()">📷 添加图片</button>
        <button class="moment-publish-btn" id="momentPublishBtn" onclick="publishMoment()" disabled>发布</button>
      </div>
      <input type="file" id="momentImgInput" accept="image/*" multiple style="display:none">
      <div class="moment-preview-grid" id="momentPreviewGrid"></div>
    </div>
    <div id="momentsList">
      <div class="empty-state"><div class="empty-icon">📸</div>加载中...</div>
    </div>
  </div>


  <div class="card">
    <div class="card-title">公开回答</div>
    <div id="answersList">
      <div class="empty-state"><div class="empty-icon">💬</div>加载中...</div>
    </div>
  </div>


  <div class="ask-btn-bar">
    <button class="btn btn-primary" id="askBtn" onclick="showAskModal()" style="display:none">向TA提问</button>
  </div>
</div>

<div class="modal-overlay" id="askModal" style="display:none" onclick="if(event.target===this)hideAskModal()">
  <div class="modal">
    <h3>向 <span id="askTargetName">TA</span> 提问</h3>
    <textarea id="askContent" placeholder="写下你想问的问题..." maxlength="500" oninput="updateAskChars()"></textarea>
    <div class="modal-chars"><span id="askChars">0</span>/500</div>
    <div class="anon-toggle">
      <input type="checkbox" id="askAnonymous" checked>
      <label for="askAnonymous">匿名提问</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="hideAskModal()">取消</button>
      <button class="btn btn-primary" id="askSubmit" onclick="submitAsk()">发送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/auth.js"></script>
<script>
(function() {
  var userId = new URLSearchParams(location.search).get('userId');
  var targetNickname = '';

  if (!userId) {
    document.getElementById('profileCard').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div>未指定用户</div>';
    document.getElementById('answersList').innerHTML = '';
    return;
  }

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function fmtTime(t) {
    if (!t) return '';
    var now = Date.now();
    var d = now - (typeof t === 'number' ? t : new Date(t).getTime());
    var s = Math.floor(d / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), day = Math.floor(h / 24);
    if (s < 60) return '刚刚';
    if (m < 60) return m + '分钟前';
    if (h < 24) return h + '小时前';
    if (day < 30) return day + '天前';
    var dt = new Date(t);
    return dt.getFullYear() + '-' + (dt.getMonth()+1) + '-' + dt.getDate();
  }
  // 暴露给动态模块复用
  window.esc = esc;
  window.fmtTime = fmtTime;


  fetch('/api/user-public?userId=' + encodeURIComponent(userId))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        var msg = data.error === 'inactive' ? '该用户已注销' : '用户不存在';
        document.getElementById('profileCard').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div>' + msg + '</div>';
        document.getElementById('answersList').innerHTML = '';
        return;
      }

      targetNickname = data.nickname || '用户';
      document.title = targetNickname + ' 的主页';
      document.getElementById('pageTitle').textContent = targetNickname + ' 的主页';

      var avatarImg = document.getElementById('avatarImg');
      var avatarPlaceholder = document.getElementById('avatarPlaceholder');
      if (data.avatar) {
        avatarImg.src = data.avatar;
        avatarImg.style.display = 'inline-block';
        avatarPlaceholder.style.display = 'none';
      } else {
        avatarImg.style.display = 'none';
        avatarPlaceholder.style.display = 'inline-flex';
        avatarPlaceholder.textContent = (data.nickname || '?')[0].toUpperCase();
      }

      document.getElementById('userName').textContent = data.nickname || '用户';
      var meta = [];
      if (data.gender) meta.push(data.gender === 'male' ? '男' : data.gender === 'female' ? '女' : data.gender);
      if (data.ageGroup) meta.push(data.ageGroup === 'teen' ? '18岁以下' : data.ageGroup === 'young' ? '18-24岁' : data.ageGroup === 'adult' ? '25-34岁' : data.ageGroup === 'mid' ? '35-44岁' : data.ageGroup === 'senior' ? '45岁以上' : data.ageGroup);
      document.getElementById('userMeta').textContent = meta.join(' · ') || '';
      document.getElementById('userBio').textContent = data.bio || '';

      var scoresRow = document.getElementById('scoresRow');
      var tags = [];
      var sp = data.scoresPreview;
      if (sp) {
        if (sp.mbti) tags.push('<span class="tag-pill accent">' + esc(sp.mbti) + '</span>');
        if (sp.attachment) {
          var attLabels = {secure:'安全型',anxious:'焦虑型',avoidant:'回避型',fearful:'恐惧型'};
          tags.push('<span class="tag-pill">' + esc(attLabels[sp.attachment] || sp.attachment) + '</span>');
        }
        if (sp.loveLang) {
          var llLabels = {words:'肯定的话语',time:'精心的时刻',gifts:'接受礼物',service:'服务的行动',touch:'身体的接触'};
          tags.push('<span class="tag-pill">' + esc(llLabels[sp.loveLang] || sp.loveLang) + '</span>');
        }
      }
      scoresRow.innerHTML = tags.join('');

      // Build trait scroll cards
      var traitScroll = document.getElementById('traitScroll');
      var traits = [];
      var traitIcons = {mbti:'🧠',attachment:'💛',loveLang:'💬',openness:'🌊',conscientiousness:'📋',extraversion:'🎤',agreeableness:'🤝',neuroticism:'🎭'};
      var traitLabels = {mbti:'性格类型',attachment:'依恋风格',loveLang:'爱之语',openness:'开放性',conscientiousness:'尽责性',extraversion:'外向性',agreeableness:'宜人性',neuroticism:'情绪稳定'};
      if (sp) {
        if (sp.mbti) traits.push({key:'mbti',val:esc(sp.mbti),pct:sp.mbti ? 75+Math.random()*20 : 70});
        if (sp.attachment) {
          var attLabels = {secure:'安全型',anxious:'焦虑型',avoidant:'回避型',fearful:'恐惧型'};
          traits.push({key:'attachment',val:esc(attLabels[sp.attachment]||sp.attachment),pct:65+Math.random()*25});
        }
        if (sp.loveLang) {
          var llLabels = {words:'肯定的话语',time:'精心的时刻',gifts:'接受礼物',service:'服务的行动',touch:'身体的接触'};
          traits.push({key:'loveLang',val:esc(llLabels[sp.loveLang]||sp.loveLang),pct:60+Math.random()*30});
        }
        // Big five if available
        var bf = sp.bigFive || sp.bigfive || {};
        var bfKeys = ['openness','conscientiousness','extraversion','agreeableness','neuroticism'];
        bfKeys.forEach(function(k){ if(bf[k]!==undefined) traits.push({key:k,val:Math.round(bf[k]*100)+'%',pct:bf[k]*100}); });
      }
      if (traits.length) {
        traitScroll.style.display = 'flex';
        traitScroll.innerHTML = traits.map(function(t){
          return '<div class="trait-card">'+
            '<div class="trait-icon">'+(traitIcons[t.key]||'📊')+'</div>'+
            '<div class="trait-name">'+(traitLabels[t.key]||t.key)+'</div>'+
            '<div class="trait-val">'+t.val+'</div>'+
            '<div class="trait-bar"><div class="trait-bar-fill" style="width:'+Math.min(100,Math.round(t.pct))+'%"></div></div>'+
            '</div>';
        }).join('');
      }

      // Only non-anonymous answers
      var answers = (data.answers || []).filter(function(a) { return !a.is_anonymous; });
      var answersList = document.getElementById('answersList');
      if (answers.length === 0) {
        answersList.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div>暂无公开回答</div>';
      } else {
        answersList.innerHTML = answers.map(function(a) {
          return '<div class="answer-item">' +
            '<div class="answer-q">Q: ' + esc(a.question) + '</div>' +
            '<div class="answer-a">' + esc(a.answer) + '</div>' +
            '<div class="answer-time">' + fmtTime(a.answered_at) + '</div>' +
          '</div>';
        }).join('');
      }

      var askBtn = document.getElementById('askBtn');
      if (data.canAsk && Auth.isLoggedIn() && String(data.userId) !== String(Auth.currentUser?.id)) {
        askBtn.style.display = 'block';
        askBtn.textContent = '向' + targetNickname + '提问';
      }
    })
    .catch(function(e) {
      console.error(e);
      document.getElementById('profileCard').innerHTML = '<div class="empty-state"><div class="empty-icon">😿</div>加载失败</div>';
      document.getElementById('answersList').innerHTML = '';
    });
})();

function showAskModal() {
  if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }
  document.getElementById('askTargetName').textContent = targetNickname;
  document.getElementById('askModal').style.display = 'flex';
  document.getElementById('askContent').value = '';
  document.getElementById('askChars').textContent = '0';
  document.getElementById('askSubmit').disabled = true;
}

function hideAskModal() { document.getElementById('askModal').style.display = 'none'; }

function updateAskChars() {
  var len = document.getElementById('askContent').value.length;
  document.getElementById('askChars').textContent = len;
  document.getElementById('askSubmit').disabled = len < 2;
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function submitAsk() {
  var content = document.getElementById('askContent').value.trim();
  var isAnonymous = document.getElementById('askAnonymous').checked;
  if (content.length < 2) return;
  var targetId = new URLSearchParams(location.search).get('userId');

  var btn = document.getElementById('askSubmit');
  btn.disabled = true; btn.textContent = '发送中...';

  fetch('/api/user-public', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId: targetId, content: content, isAnonymous: isAnonymous })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        hideAskModal();
        toast('提问已发送');
        document.getElementById('askBtn').disabled = true;
        document.getElementById('askBtn').textContent = '已提问，等待回复';
      } else {
        toast(data.message || '发送失败');
      }
    })
    .catch(function() { toast('网络错误'); })
    .finally(function() { btn.disabled = false; btn.textContent = '发送'; });
}

/* ── 动态（朋友圈/小红书式） ── */
(function() {
  var momentsList = document.getElementById('momentsList');
  if (!momentsList) return;
  var targetId = new URLSearchParams(location.search).get('userId');

  function gridClass(n) {
    if (n === 1) return 'grid-1';
    if (n === 2) return 'grid-2';
    if (n <= 4) return 'grid-4';
    if (n <= 6) return 'grid-6';
    return 'grid-9';
  }

  function openViewer(src) {
    var v = document.createElement('div');
    v.className = 'img-viewer';
    var img = document.createElement('img');
    img.src = src;
    v.appendChild(img);
    v.addEventListener('click', function(){ v.remove(); });
    document.body.appendChild(v);
  }
  window.openViewer = openViewer;

  // 判断是否查看的是自己：是则显示发布入口
  function isSelf() {
    var u = Auth.getUser();
    return !!u && String(u.userId) === String(targetId);
  }


  function renderMoment(m) {

    var imagesHtml = '';
    if (m.images && m.images.length) {
      imagesHtml = '<div class="moment-images ' + gridClass(m.images.length) + '">' +
        m.images.map(function(src){
          return '<img class="moment-img" src="' + src + '" loading="lazy" onclick="event.stopPropagation();openMomentViewer(this.src)">';
        }).join('') + '</div>';
    }

    var avatarHtml = m.ownerAvatar
      ? '<img class="moment-avatar" src="' + m.ownerAvatar + '" onerror="this.outerHTML=\'<div class=moment-avatar-ph>'+esc((m.ownerName||'?')[0])+'</div>\'">'
      : '<div class="moment-avatar-ph">' + esc((m.ownerName || '?')[0]) + '</div>';

    var commentsHtml = '';
    if (m.comments && m.comments.length) {
      commentsHtml = '<div class="moment-comments">' +
        m.comments.map(function(c){
          return '<div class="moment-comment"><span class="c-name">' + esc(c.name) + '</span>' + esc(c.content) + '</div>';
        }).join('') +
        '</div>';
    }

    var likedClass = m.liked ? ' liked' : '';
    var likeIcon = m.liked ? '❤️' : '🤍';

    return '<div class="moment-item" data-id="' + m.id + '">' +
      '<div class="moment-head">' + avatarHtml +
        '<div><div class="moment-name">' + esc(m.ownerName) + '</div>' +
        '<div class="moment-time">' + fmtTime(m.createdAt) + '</div></div>' +
      '</div>' +
      (m.content ? '<div class="moment-content">' + esc(m.content) + '</div>' : '') +
      imagesHtml +
      '<div class="moment-actions">' +
        '<button class="moment-action' + likedClass + '" onclick="toggleMomentLike(' + m.id + ', this)">' + likeIcon + ' <span class="like-count">' + (m.likesCount || 0) + '</span></button>' +
        '<button class="moment-action" onclick="toggleMomentComments(' + m.id + ', this)">💬 <span>' + (m.commentsCount || 0) + '</span></button>' +
      '</div>' +
      '<div class="moment-comments-wrap" style="display:none">' + commentsHtml +
        '<div class="moment-comment-input"><input placeholder="说点什么..." maxlength="300" onkeydown="if(event.key===\'Enter\')submitMomentComment(' + m.id + ', this)"><button onclick="submitMomentComment(' + m.id + ', this.previousElementSibling)">发送</button></div>' +
      '</div>' +
    '</div>';
  }

  window.renderMoment = renderMoment;

  function loadMoments() {
    fetch('/api/moments?userId=' + encodeURIComponent(targetId) + '&pageSize=20')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) {
          momentsList.innerHTML = '<div class="empty-state"><div class="empty-icon">📸</div>加载失败</div>';
          return;
        }
        var list = data.moments || [];
        if (list.length === 0) {
          momentsList.innerHTML = '<div class="empty-state"><div class="empty-icon">📸</div>暂无动态</div>';
          return;
        }
        momentsList.innerHTML = list.map(renderMoment).join('');
      })
      .catch(function() {
        momentsList.innerHTML = '<div class="empty-state"><div class="empty-icon">📸</div>加载失败</div>';
      });
  }
  window.loadMoments = loadMoments;


  // ── 发布动态（仅本人可见） ──
  var momentImages = [];
  var composer = document.getElementById('momentComposer');
  var imgInput = document.getElementById('momentImgInput');
  var previewGrid = document.getElementById('momentPreviewGrid');

  function updateMomentChars() {
    var len = document.getElementById('momentContent').value.length;
    document.getElementById('momentChars').textContent = len;
    document.getElementById('momentPublishBtn').disabled = len === 0 && momentImages.length === 0;
  }
  window.updateMomentChars = updateMomentChars;

  function renderPreview() {
    previewGrid.innerHTML = momentImages.map(function(src, i) {
      return '<div class="moment-preview-item"><img src="' + src + '"><button class="remove" onclick="removeMomentImage(' + i + ')">×</button></div>';
    }).join('');
  }

  function removeMomentImage(i) {
    momentImages.splice(i, 1);
    renderPreview();
    updateMomentChars();
  }
  window.removeMomentImage = removeMomentImage;

  function publishMoment() {
    if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }
    var content = document.getElementById('momentContent').value.trim();
    if (!content && momentImages.length === 0) return;
    var btn = document.getElementById('momentPublishBtn');
    btn.disabled = true; btn.textContent = '发布中...';

    fetch('/api/moments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content, images: momentImages })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) {
          document.getElementById('momentContent').value = '';
          momentImages = [];
          renderPreview();
          updateMomentChars();
          toast('发布成功');
          loadMoments();
        } else {
          toast(data.message || '发布失败');
        }
      })
      .catch(function() { toast('网络错误'); })
      .finally(function() { btn.disabled = false; btn.textContent = '发布'; });
  }
  window.publishMoment = publishMoment;

  // 初始化：仅本人显示发布入口（auth 异步加载，需监听 authchange）
  var composerInited = false;
  function initComposer() {
    if (!isSelf()) return;
    composer.style.display = 'block';
    if (composerInited) return;
    composerInited = true;
    imgInput.addEventListener('change', function() {
      var files = Array.prototype.slice.call(this.files);
      var remaining = 9 - momentImages.length;
      if (files.length > remaining) {
        toast('最多上传9张图片');
        files = files.slice(0, remaining);
      }
      files.forEach(function(file) {
        if (!file.type.startsWith('image/')) return;
        if (file.size > 10 * 1024 * 1024) { toast('单张图片不能超过10MB'); return; }
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var maxW = 1200, maxH = 1200;
            var w = img.width, h = img.height;
            if (w > maxW || h > maxH) {
              var ratio = Math.min(maxW / w, maxH / h);
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
            }
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL('image/webp', 0.7);
            momentImages.push(dataUrl);
            renderPreview();
            updateMomentChars();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      this.value = '';
    });
  }
  initComposer();
  Auth.onAuthChange(initComposer);

  loadMoments();
})();



function openMomentViewer(src) { openViewer(src); }

function toggleMomentLike(id, btn) {
  if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }
  var isLiked = btn.classList.contains('liked');
  var action = isLiked ? 'unlike' : 'like';
  fetch('/api/moments', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ momentId: id, action: action })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        btn.classList.toggle('liked', !isLiked);
        btn.innerHTML = (isLiked ? '🤍' : '❤️') + ' <span class="like-count">' + (data.likesCount || 0) + '</span>';
      } else {
        toast(data.message || '操作失败');
      }
    })
    .catch(function() { toast('网络错误'); });
}

function toggleMomentComments(id, btn) {
  var wrap = btn.closest('.moment-item').querySelector('.moment-comments-wrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
}

function submitMomentComment(id, input) {
  if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }
  var text = input.value.trim();
  if (!text) return;
  var btn = input.nextElementSibling;
  if (btn) btn.disabled = true;
  fetch('/api/moments', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ momentId: id, content: text })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        input.value = '';
        // 重新加载动态以刷新评论
        var targetId = new URLSearchParams(location.search).get('userId');
        fetch('/api/moments?userId=' + encodeURIComponent(targetId) + '&pageSize=20')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.moments) {
              var item = document.querySelector('.moment-item[data-id="' + id + '"]');
              if (item) {
                var m = d.moments.find(function(x){ return x.id === id; });
                if (m) {
                  var wrap = item.querySelector('.moment-comments-wrap');
                  var wasOpen = wrap.style.display === 'block';
                  var newItem = document.createElement('div');
                  newItem.innerHTML = renderMoment(m);
                  var newWrap = newItem.querySelector('.moment-comments-wrap');
                  if (wasOpen) newWrap.style.display = 'block';
                  item.outerHTML = newItem.innerHTML;
                }
              }
            }
          });
      } else {
        toast(data.message || '评论失败');
      }
    })
    .catch(function() { toast('网络错误'); })
    .finally(function() { if (btn) btn.disabled = false; });
}
</script>
