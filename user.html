<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用户主页</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #111;
    --border: #222;
    --text: #ddd;
    --muted: #888;
    --accent: #C4526E;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 500px; margin: 0 auto; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .header h1 { font-size: 20px; font-weight: 700; color: #fff; }
  .back-btn { color: var(--muted); text-decoration: none; font-size: 14px; transition: color .2s; }
  .back-btn:hover { color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card-title { font-size: 13px; color: var(--muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }

  .avatar-section { text-align: center; margin-bottom: 8px; }
  .avatar-preview {
    width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--border); background: #1a1a1e;
  }
  .avatar-placeholder {
    width: 80px; height: 80px; border-radius: 50%; border: 2px dashed var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 28px;
  }
  .user-name { text-align: center; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .user-meta { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .user-bio { text-align: center; font-size: 14px; color: var(--text); line-height: 1.6; padding: 0 10px; }

  .tag-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tag-pill {
    padding: 4px 12px; border-radius: 100px; font-size: 12px;
    background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--text);
  }
  .tag-pill.accent { border-color: var(--accent); color: var(--accent); background: rgba(196,82,110,.08); }

  .answer-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .answer-item:last-child { border-bottom: none; padding-bottom: 0; }
  .answer-q { font-size: 14px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .answer-a { font-size: 15px; color: var(--text); line-height: 1.6; margin-bottom: 6px; }
  .answer-time { font-size: 11px; color: var(--muted); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; width: calc(100% - 32px); max-width: 400px;
  }
  .modal h3 { font-size: 17px; color: #fff; margin-bottom: 16px; }
  .modal textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
    resize: vertical; min-height: 100px; line-height: 1.5;
  }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-chars { font-size: 11px; color: var(--muted); text-align: right; margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 100px;
    font-size: 14px; font-weight: 600; cursor: pointer; border: none;
    font-family: inherit; transition: all .2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #A33E55; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255,255,255,.1); }

  .anon-toggle { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 13px; color: var(--muted); }
  .anon-toggle input[type="checkbox"] { accent-color: var(--accent); }

  .ask-btn-bar { margin-top: 16px; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 100px; font-size: 14px;
    background: #333; color: #fff; z-index: 9999; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="pageTitle">用户主页</h1>
    <a href="javascript:history.back()" class="back-btn">返回</a>
  </div>

  <div class="card" id="profileCard">
    <div class="avatar-section">
      <img id="avatarImg" class="avatar-preview" src="" style="display:none" alt="头像">
      <div id="avatarPlaceholder" class="avatar-placeholder">?</div>
    </div>
    <div id="userName" class="user-name">...</div>
    <div id="userMeta" class="user-meta"></div>
    <div id="userBio" class="user-bio"></div>
    <div id="scoresRow" class="tag-row"></div>
  </div>

  <div class="card">
    <div class="card-title">公开回答</div>
    <div id="answersList">
      <div class="empty-state"><div class="empty-icon">💬</div>加载中...</div>
    </div>
  </div>

  <div class="ask-btn-bar">
    <button class="btn btn-primary" id="askBtn" onclick="showAskModal()" style="display:none">向TA提问</button>
  </div>
</div>

<div class="modal-overlay" id="askModal" style="display:none" onclick="if(event.target===this)hideAskModal()">
  <div class="modal">
    <h3>向 <span id="askTargetName">TA</span> 提问</h3>
    <textarea id="askContent" placeholder="写下你想问的问题..." maxlength="500" oninput="updateAskChars()"></textarea>
    <div class="modal-chars"><span id="askChars">0</span>/500</div>
    <div class="anon-toggle">
      <input type="checkbox" id="askAnonymous" checked>
      <label for="askAnonymous">匿名提问</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="hideAskModal()">取消</button>
      <button class="btn btn-primary" id="askSubmit" onclick="submitAsk()">发送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/auth.js"></script>
<script>
(function() {
  var userId = new URLSearchParams(location.search).get('userId');
  var targetNickname = '';

  if (!userId) {
    document.getElementById('profileCard').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div>未指定用户</div>';
    document.getElementById('answersList').innerHTML = '';
    return;
  }

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function fmtTime(t) {
    if (!t) return '';
    var now = Date.now();
    var d = now - (typeof t === 'number' ? t : new Date(t).getTime());
    var s = Math.floor(d / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), day = Math.floor(h / 24);
    if (s < 60) return '刚刚';
    if (m < 60) return m + '分钟前';
    if (h < 24) return h + '小时前';
    if (day < 30) return day + '天前';
    var dt = new Date(t);
    return dt.getFullYear() + '-' + (dt.getMonth()+1) + '-' + dt.getDate();
  }

  fetch('/api/user-public?userId=' + encodeURIComponent(userId))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        var msg = data.error === 'inactive' ? '该用户已注销' : '用户不存在';
        document.getElementById('profileCard').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div>' + msg + '</div>';
        document.getElementById('answersList').innerHTML = '';
        return;
      }

      targetNickname = data.nickname || '用户';
      document.title = targetNickname + ' 的主页';
      document.getElementById('pageTitle').textContent = targetNickname + ' 的主页';

      var avatarImg = document.getElementById('avatarImg');
      var avatarPlaceholder = document.getElementById('avatarPlaceholder');
      if (data.avatar) {
        avatarImg.src = data.avatar;
        avatarImg.style.display = 'inline-block';
        avatarPlaceholder.style.display = 'none';
      } else {
        avatarImg.style.display = 'none';
        avatarPlaceholder.style.display = 'inline-flex';
        avatarPlaceholder.textContent = (data.nickname || '?')[0].toUpperCase();
      }

      document.getElementById('userName').textContent = data.nickname || '用户';
      var meta = [];
      if (data.gender) meta.push(data.gender === 'male' ? '男' : data.gender === 'female' ? '女' : data.gender);
      if (data.ageGroup) meta.push(data.ageGroup === 'teen' ? '18岁以下' : data.ageGroup === 'young' ? '18-24岁' : data.ageGroup === 'adult' ? '25-34岁' : data.ageGroup === 'mid' ? '35-44岁' : data.ageGroup === 'senior' ? '45岁以上' : data.ageGroup);
      document.getElementById('userMeta').textContent = meta.join(' · ') || '';
      document.getElementById('userBio').textContent = data.bio || '';

      var scoresRow = document.getElementById('scoresRow');
      var tags = [];
      var sp = data.scoresPreview;
      if (sp) {
        if (sp.mbti) tags.push('<span class="tag-pill accent">' + esc(sp.mbti) + '</span>');
        if (sp.attachment) {
          var attLabels = {secure:'安全型',anxious:'焦虑型',avoidant:'回避型',fearful:'恐惧型'};
          tags.push('<span class="tag-pill">' + esc(attLabels[sp.attachment] || sp.attachment) + '</span>');
        }
        if (sp.loveLang) {
          var llLabels = {words:'肯定的话语',time:'精心的时刻',gifts:'接受礼物',service:'服务的行动',touch:'身体的接触'};
          tags.push('<span class="tag-pill">' + esc(llLabels[sp.loveLang] || sp.loveLang) + '</span>');
        }
      }
      scoresRow.innerHTML = tags.join('');

      // Only non-anonymous answers
      var answers = (data.answers || []).filter(function(a) { return !a.is_anonymous; });
      var answersList = document.getElementById('answersList');
      if (answers.length === 0) {
        answersList.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div>暂无公开回答</div>';
      } else {
        answersList.innerHTML = answers.map(function(a) {
          return '<div class="answer-item">' +
            '<div class="answer-q">Q: ' + esc(a.question) + '</div>' +
            '<div class="answer-a">' + esc(a.answer) + '</div>' +
            '<div class="answer-time">' + fmtTime(a.answered_at) + '</div>' +
          '</div>';
        }).join('');
      }

      var askBtn = document.getElementById('askBtn');
      if (data.canAsk && Auth.isLoggedIn() && String(data.userId) !== String(Auth.currentUser?.id)) {
        askBtn.style.display = 'block';
        askBtn.textContent = '向' + targetNickname + '提问';
      }
    })
    .catch(function(e) {
      console.error(e);
      document.getElementById('profileCard').innerHTML = '<div class="empty-state"><div class="empty-icon">😿</div>加载失败</div>';
      document.getElementById('answersList').innerHTML = '';
    });
})();

function showAskModal() {
  if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }
  document.getElementById('askTargetName').textContent = targetNickname;
  document.getElementById('askModal').style.display = 'flex';
  document.getElementById('askContent').value = '';
  document.getElementById('askChars').textContent = '0';
  document.getElementById('askSubmit').disabled = true;
}

function hideAskModal() { document.getElementById('askModal').style.display = 'none'; }

function updateAskChars() {
  var len = document.getElementById('askContent').value.length;
  document.getElementById('askChars').textContent = len;
  document.getElementById('askSubmit').disabled = len < 2;
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function submitAsk() {
  var content = document.getElementById('askContent').value.trim();
  var isAnonymous = document.getElementById('askAnonymous').checked;
  if (content.length < 2) return;
  var targetId = new URLSearchParams(location.search).get('userId');

  var btn = document.getElementById('askSubmit');
  btn.disabled = true; btn.textContent = '发送中...';

  fetch('/api/user-public', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId: targetId, content: content, isAnonymous: isAnonymous })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        hideAskModal();
        toast('提问已发送');
        document.getElementById('askBtn').disabled = true;
        document.getElementById('askBtn').textContent = '已提问，等待回复';
      } else {
        toast(data.message || '发送失败');
      }
    })
    .catch(function() { toast('网络错误'); })
    .finally(function() { btn.disabled = false; btn.textContent = '发送'; });
}
</script>
</body>
</html>
