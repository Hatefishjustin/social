<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>个人设置 - 心镜·社交</title>
<style>
  :root {
    --bg: #0d0710;
    --card: #1a1122;
    --border: #2c2033;
    --text: #f7ede8;
    --muted: #7c6c78;
    --accent: #dfb6b2;
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 500px; margin: 0 auto; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .header h1 { font-size: 20px; font-weight: 700; color: #fff; }
  .back-btn { color: var(--muted); text-decoration: none; font-size: 14px; transition: color .2s; }
  .back-btn:hover { color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card-title { font-size: 13px; color: var(--muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }

  /* Avatar */
  .avatar-section { text-align: center; margin-bottom: 20px; }
  .avatar-preview {
    width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--border); margin-bottom: 10px;
    background: #1a1a1e;
    transition: opacity .2s;
  }
  #avatarClickArea:hover .avatar-preview,
  #avatarClickArea:hover .avatar-placeholder { opacity: .7; }
  .avatar-placeholder {
    width: 80px; height: 80px; border-radius: 50%; border: 2px dashed var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 28px; margin-bottom: 10px;
  }

  /* Input */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
    transition: border-color .2s;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(223,182,178,.12); }
  .field input::placeholder { color: rgba(255,255,255,.2); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .upload-hint { font-size: 12px; color: var(--accent); margin-top: 6px; cursor: pointer; text-align: center; transition: color .2s; }
  .upload-hint:hover { color: #c9908c; }

  .btn {
    display: block; width: 100%; padding: 13px; border-radius: 100px;
    font-size: 15px; font-weight: 600; cursor: pointer; border: none;
    font-family: inherit; transition: all .2s; margin-top: 8px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #c9908c; box-shadow: 0 6px 20px rgba(82,43,91,.32); }
  .btn-primary:active { transform: scale(.97); }
  .btn-primary:disabled { opacity: .4; pointer-events: none; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 10px 24px; border-radius: 10px; font-size: 13px; z-index: 999;
    pointer-events: none; transition: opacity .3s; opacity: 0;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #00C853; color: #000; }
  .toast.error { background: var(--accent); color: #fff; }

  .login-prompt { text-align: center; padding: 60px 20px; }
  .login-prompt p { color: var(--muted); margin-bottom: 16px; }
  .login-prompt a {
    display: inline-block; padding: 10px 28px; background: var(--accent);
    color: #fff; text-decoration: none; border-radius: 24px; font-size: 14px;
  }

  @media (max-width: 500px) {
    body { padding: 10px; }
    .card { padding: 16px; }
  }

.psych-profile-card{margin-top:16px}
.psych-empty{color:var(--text-tertiary);font-size:13px;text-align:center;padding:20px 0}
.psych-empty a{color:var(--accent)}
.psych-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.psych-item{background:var(--bg-input);border-radius:10px;padding:12px;text-align:center}
.psych-item-label{font-size:11px;color:var(--text-quaternary);margin-bottom:4px}
.psych-item-value{font-size:16px;font-weight:700;color:var(--accent)}
.psych-values{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.psych-value-tag{padding:3px 10px;background:rgba(167,139,250,0.12);color:var(--accent);border-radius:12px;font-size:12px}

/* Quiz History Timeline + Canvas */
.timeline-list{position:relative;padding-left:20px;margin-top:12px}
.timeline-list::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:14px;padding-left:14px}
.timeline-item::before{content:'';position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.timeline-date{font-size:11px;color:var(--muted);margin-bottom:3px}
.timeline-summary{font-size:13px;color:var(--text);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.timeline-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(223,182,178,.14);color:var(--accent)}
.timeline-canvas-wrap{margin-top:14px;text-align:center}
.timeline-canvas-wrap canvas{max-width:100%;height:auto}
.history-empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}

/* ── 我的动态（朋友圈/小红书式） ── */
.moment-composer { margin-bottom: 16px; }
.moment-composer textarea {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: rgba(255,255,255,.04);
  color: #fff; font-size: 14px; outline: none; font-family: inherit;
  resize: vertical; min-height: 80px; line-height: 1.5; box-sizing: border-box;
}
.moment-composer textarea:focus { border-color: var(--accent); }
.moment-composer-chars { font-size: 11px; color: var(--muted); text-align: right; margin-top: 4px; }
.moment-composer-tools { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.moment-add-img {
  padding: 8px 14px; border-radius: 8px; border: 1px dashed var(--border);
  background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all .2s;
}
.moment-add-img:hover { border-color: var(--accent); color: var(--accent); }
.moment-preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.moment-preview-item { position: relative; width: 72px; height: 72px; }
.moment-preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
.moment-preview-item .remove {
  position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
  border-radius: 50%; background: #e74c3c; color: #fff; border: none;
  font-size: 12px; line-height: 20px; text-align: center; cursor: pointer;
}
.moment-publish-btn {
  margin-left: auto; padding: 9px 20px; border-radius: 100px; border: none;
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all .2s;
}
.moment-publish-btn:disabled { opacity: .4; cursor: not-allowed; }

.moment-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
.moment-item:last-child { border-bottom: none; }
.moment-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.moment-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); background: #1a1a1e; flex-shrink: 0; }
.moment-avatar-ph { width: 40px; height: 40px; border-radius: 50%; border: 1px dashed var(--border); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; flex-shrink: 0; }
.moment-name { font-size: 14px; font-weight: 600; color: #fff; }
.moment-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
.moment-content { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
.moment-images { display: grid; gap: 4px; margin-bottom: 10px; }
.moment-images.grid-1 { grid-template-columns: 1fr; }
.moment-images.grid-2 { grid-template-columns: 1fr 1fr; }
.moment-images.grid-3, .moment-images.grid-4 { grid-template-columns: 1fr 1fr; }
.moment-images.grid-5, .moment-images.grid-6 { grid-template-columns: 1fr 1fr 1fr; }
.moment-images.grid-7, .moment-images.grid-8, .moment-images.grid-9 { grid-template-columns: 1fr 1fr 1fr; }
.moment-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; background: #1a1a1e; border: 1px solid var(--border); }
.moment-actions { display: flex; gap: 20px; align-items: center; }
.moment-action { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); cursor: pointer; background: none; border: none; font-family: inherit; padding: 4px 0; transition: color .2s; }
.moment-action:hover { color: var(--accent); }
.moment-action.liked { color: var(--accent); }
.moment-action.danger:hover { color: #e74c3c; }
.moment-comments { margin-top: 10px; background: rgba(255,255,255,.03); border-radius: 10px; padding: 10px; }
.moment-comment { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 6px; }
.moment-comment:last-child { margin-bottom: 0; }
.moment-comment .c-name { color: var(--accent); font-weight: 600; margin-right: 6px; }
.moment-comment-input { display: flex; gap: 8px; margin-top: 8px; }
.moment-comment-input input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,.04); color: #fff; font-size: 13px; outline: none; font-family: inherit; }
.moment-comment-input input:focus { border-color: var(--accent); }
.moment-comment-input button { padding: 8px 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.moment-comment-input button:disabled { opacity: .4; cursor: not-allowed; }
.img-viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.img-viewer img { max-width: 95%; max-height: 95%; border-radius: 8px; }
</style>

</head>
<body>
<div class="container">
  <div class="header">
    <h1>个人设置</h1>
    <a href="/" class="back-btn">返回</a>
  </div>

  <div id="loginPrompt" class="login-prompt" style="display:none">
    <p>需要登录后才能修改个人资料</p>
    <a href="javascript:Auth.showLoginModal()">去登录</a>
  </div>

  <div id="mainContent" style="display:none">
    <div class="card">
      <div class="card-title">头像</div>
      <div class="avatar-section" id="avatarClickArea" style="cursor:pointer">
        <img id="avatarImg" class="avatar-preview" src="" style="display:none" alt="头像">
        <div id="avatarPlaceholder" class="avatar-placeholder">?</div>
        <div class="upload-hint" id="uploadHint">点击上传头像</div>
      </div>
      <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
      <div class="field">
        <label>头像链接（可选）</label>
        <input type="url" id="avatarInput" placeholder="https://example.com/avatar.jpg" autocomplete="off">
        <div class="hint">也可以粘贴图片直链，或直接点击头像区域上传</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">基本资料</div>
      <div class="field">
        <label>显示名称</label>
        <input type="text" id="nameInput" placeholder="你的昵称" maxlength="30" autocomplete="off">
        <div class="hint">最长 30 个字符，留空则显示邮箱前缀</div>
      </div>
      <div class="field">
        <label>邮箱</label>
        <input type="email" id="emailInput" disabled style="opacity:.5">
        <div class="hint">邮箱不可修改</div>
      </div>
    </div>

    <div class="card psych-profile-card" id="psychProfileCard">
      <div class="card-title">我的心理画像</div>
      <div id="psychProfileContent">
        <div class="psych-empty">还没有测评记录？去 <a href="/match.html">心理测评</a> 做一个吧，完成后这里会自动显示你的心理画像。</div>
      </div>
    </div>

    <div class="card" id="quizHistoryCard">
      <div class="card-title">测评时间线</div>
      <div class="timeline-canvas-wrap"><canvas id="trendCanvas" width="360" height="200"></canvas></div>
      <div id="timelineContent">
        <div class="history-empty">暂无历史测评记录</div>
      </div>
    </div>

    <div class="card" id="momentsCard">
      <div class="card-title">我的动态</div>
      <div class="moment-composer">
        <textarea id="momentContent" placeholder="分享此刻的心情、照片..." maxlength="1000" oninput="updateMomentChars()"></textarea>
        <div class="moment-composer-chars"><span id="momentChars">0</span>/1000</div>
        <div class="moment-composer-tools">
          <button class="moment-add-img" onclick="document.getElementById('momentImgInput').click()">📷 添加图片</button>
          <button class="moment-publish-btn" id="momentPublishBtn" onclick="publishMoment()">发布</button>
        </div>
        <input type="file" id="momentImgInput" accept="image/*" multiple style="display:none">
        <div class="moment-preview-grid" id="momentPreviewGrid"></div>
      </div>
      <div id="myMomentsList">
        <div class="history-empty">加载中...</div>
      </div>
    </div>

    <button class="btn btn-primary" id="saveBtn">保存更改</button>

  </div>
</div>

<script src="/auth.js"></script>
<script>
(function(){
'use strict';

var nameInput   = document.getElementById('nameInput');
var avatarFileInput = document.getElementById('avatarFileInput');
var avatarImg     = document.getElementById('avatarImg');
var avatarPH      = document.getElementById('avatarPlaceholder');
var avatarClickArea = document.getElementById('avatarClickArea');
var uploadHint    = document.getElementById('uploadHint');
var emailInput    = document.getElementById('emailInput');
var nameInput     = document.getElementById('nameInput');
var saveBtn       = document.getElementById('saveBtn');

function showToast(msg, type) {
  var t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function updateAvatarPreview(url) {
  if (url && url.trim()) {
    avatarImg.src = url.trim();
    avatarImg.style.display = 'inline-block';
    avatarPH.style.display = 'none';
  } else {
    avatarImg.style.display = 'none';
    avatarPH.style.display = 'inline-flex';
  }
}

function loadPsychProfile() {
  var card = document.getElementById('psychProfileContent');
  try {
    var raw = localStorage.getItem('xinjing_quiz_result_v2');
    if (!raw) return;
    var r = JSON.parse(raw);
    card.innerHTML =
      '<div class="psych-grid">' +
        '<div class="psych-item"><div class="psych-item-label">依恋类型</div><div class="psych-item-value">'+r.attachmentLabel+'</div></div>' +
        '<div class="psych-item"><div class="psych-item-label">MBTI</div><div class="psych-item-value">'+r.mbti+'</div></div>' +
        '<div class="psych-item"><div class="psych-item-label">主要爱之语</div><div class="psych-item-value">'+r.loveLang+'</div></div>' +
        '<div class="psych-item"><div class="psych-item-label">测评时间</div><div class="psych-item-value" style="font-size:13px">'+new Date(r.savedAt).toLocaleDateString()+'</div></div>' +
      '</div>' +
      '<div class="psych-values">'+
        r.topValues.map(function(v){return '<span class="psych-value-tag">'+v+'</span>'}).join('')+
      '</div>' +
      '<div style="text-align:center;margin-top:10px"><a href="/match.html" style="color:var(--accent);font-size:12px">重新测评</a></div>';
  } catch(e) {}
}

function loadQuizHistory() {
  var timeline = document.getElementById('timelineContent');
  var canvas = document.getElementById('trendCanvas');
  var ctx = canvas.getContext('2d');
  try {
    var raw = localStorage.getItem('xinjing_quiz_history_v2');
    if (!raw) { canvas.style.display='none'; return; }
    var history = JSON.parse(raw);
    if (!history.length) { canvas.style.display='none'; return; }

    // 按时间正序排列（最旧在前）
    history.sort(function(a,b){return a.savedAt-b.savedAt});

    // 渲染时间线条目（最新在前）
    var html = '<div class="timeline-list">';
    for (var i=history.length-1;i>=0;i--) {
      var h = history[i];
      var d = new Date(h.savedAt);
      var ds = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
      html += '<div class="timeline-item">'+
        '<div class="timeline-date">'+ds+'</div>'+
        '<div class="timeline-summary">'+
          '<span class="timeline-badge">'+h.mbti+'</span>'+
          '<span style="font-size:12px;color:var(--muted)">'+h.attachmentLabel+' | '+h.loveLang+'</span>'+
        '</div>'+
      '</div>';
    }
    html += '</div>';
    timeline.innerHTML = html;

    // 绘制 Canvas 趋势图（Big5 五维折线）
    var W = canvas.width, H = canvas.height;
    var pad = {top:20,right:30,bottom:28,left:32};
    var pw = W-pad.left-pad.right, ph = H-pad.top-pad.bottom;

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#111'; ctx.fillRect(0,0,W,H);

    if (history.length < 2) {
      ctx.fillStyle = '#888'; ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('至少需要两次测评才能生成趋势图', W/2, H/2);
      canvas.style.display='block';
      return;
    }

    var traits = ['O','C','E','A','N'];
    var colors = ['#E06C75','#98C379','#61AFEF','#E5C07B','#C678DD'];
    var labels = ['开放性 O','尽责性 C','外向性 E','宜人性 A','神经质 N'];
    var allVals = {};
    traits.forEach(function(t){allVals[t]=[]});
    history.forEach(function(h){
      traits.forEach(function(t){
        allVals[t].push(h.big5 ? h.big5[t] : 0);
      });
    });

    // Y轴范围：0-100%
    var yMin=0, yMax=100;
    var xStep = pw/(history.length-1);

    // 网格线
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
    for (var yi=0;yi<=4;yi++) {
      var y = pad.top + yi*ph/4;
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    }

    // Y轴标签
    ctx.fillStyle = '#666'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
    for (var yi=0;yi<=4;yi++) {
      var y = pad.top + yi*ph/4;
      ctx.fillText((100-yi*25)+'%', pad.left-6, y+3);
    }

    // X轴标签（日期）
    ctx.textAlign = 'center';
    var maxLabels = Math.min(history.length, 6);
    var labelStep = Math.max(1, Math.floor((history.length-1)/(maxLabels-1)));
    for (var xi=0;xi<history.length;xi+=labelStep) {
      var x = pad.left + xi*xStep;
      var dd = new Date(history[xi].savedAt);
      var lbl = (dd.getMonth()+1)+'/'+dd.getDate();
      ctx.fillText(lbl, x, H-pad.bottom+14);
    }
    // 确保最后一个点也有标签
    if ((history.length-1) % labelStep !== 0) {
      var lx = pad.left + (history.length-1)*xStep;
      var ld = new Date(history[history.length-1].savedAt);
      ctx.fillText((ld.getMonth()+1)+'/'+ld.getDate(), lx, H-pad.bottom+14);
    }

    // 折线
    traits.forEach(function(t,ti){
      ctx.strokeStyle = colors[ti]; ctx.lineWidth = 1.5;
      ctx.beginPath();
      var first = true;
      history.forEach(function(h,hi){
        var x = pad.left + hi*xStep;
        var v = (h.big5 && h.big5[t] != null) ? h.big5[t] : 0;
        var y = pad.top + ph * (1 - v/100);
        if (first) { ctx.moveTo(x,y); first=false; }
        else ctx.lineTo(x,y);
      });
      ctx.stroke();

      // 图例
      var lx = pad.left + ti*55;
      ctx.fillStyle = colors[ti];
      ctx.fillRect(lx, 4, 10, 10);
      ctx.fillStyle = '#aaa';
      ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(labels[ti], lx+13, 13);
    });

    canvas.style.display='block';
  } catch(e) { canvas.style.display='none'; }
}

// Check login
if (Auth.isLoggedIn()) {
  init();
} else {
  loadPsychProfile();
  loadQuizHistory();

  Auth.onAuthChange(function(user){
    if (user) init();
  });
  // If still not logged in after initial check
  setTimeout(function(){
    if (!Auth.isLoggedIn()) {
      document.getElementById('loginPrompt').style.display = 'block';
    }
  }, 500);
}

function init() {
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('loginPrompt').style.display = 'none';

  // Fill current values
  var displayName = Auth.getDisplayName() || '';
  var avatarUrl   = Auth.getAvatarUrl() || '';
  var email       = Auth.getEmail() || '';

  nameInput.value = displayName;
  emailInput.value = email;
  updateAvatarPreview(avatarUrl);

  // ── 头像上传：点击触发文件选择 ──
  avatarClickArea.addEventListener('click', function(){
    avatarFileInput.click();
  });
  uploadHint.addEventListener('click', function(){
    avatarFileInput.click();
  });

  // ── 加载心理画像 ──
  loadPsychProfile();
  loadQuizHistory();

  avatarFileInput.addEventListener('change', function(){
    var file = this.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showToast('请选择图片文件', 'error');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      showToast('图片不能超过5MB', 'error');
      return;
    }

    // 用 Canvas 压缩到 200x200 以内，转 base64
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 200, maxH = 200;
        var w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          var ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/webp', 0.75);
        updateAvatarPreview(dataUrl);
        // 存到 data 属性，保存时上传
        avatarClickArea.setAttribute('data-avatar-data', dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Save
  saveBtn.addEventListener('click', async function(){
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中...';

    var displayName = nameInput.value.trim();

    try {
      var avatarUrl = Auth.getAvatarUrl() || '';

      // 如果有新头像数据，先上传
      var avatarData = avatarClickArea.getAttribute('data-avatar-data');
      if (avatarData && avatarData.startsWith('data:image/')) {
        var uploadRes = await fetch('/api/avatar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: avatarData })
        });
        var uploadJson = await uploadRes.json();
        if (uploadJson.ok) {
          avatarUrl = uploadJson.avatarUrl;
          avatarClickArea.removeAttribute('data-avatar-data');
        } else {
          showToast(uploadJson.message || '头像上传失败', 'error');
          saveBtn.disabled = false;
          saveBtn.textContent = '保存更改';
          return;
        }
      }

      // 保存昵称
      var r = await fetch('/api/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ displayName: displayName })
      });
      var d = await r.json();
      if (d.ok) {
        showToast('保存成功', 'success');
        await Auth.refresh();
        nameInput.value = Auth.getDisplayName() || '';
        updateAvatarPreview(Auth.getAvatarUrl());
      } else {
        showToast(d.message || '保存失败', 'error');
      }
    } catch(e) {
      showToast('网络错误', 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '保存更改';
    }
  });

  // ── 我的动态 ──
  initMoments();
}

/* ── 我的动态（朋友圈/小红书式） ── */
var momentImages = []; // 待发布的图片 base64 数组

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fmtTime(t) {
  if (!t) return '';
  var now = Date.now();
  var d = now - (typeof t === 'number' ? t : new Date(t).getTime());
  var s = Math.floor(d / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), day = Math.floor(h / 24);
  if (s < 60) return '刚刚';
  if (m < 60) return m + '分钟前';
  if (h < 24) return h + '小时前';
  if (day < 30) return day + '天前';
  var dt = new Date(t);
  return dt.getFullYear() + '-' + (dt.getMonth()+1) + '-' + dt.getDate();
}

function updateMomentChars() {
  var len = document.getElementById('momentContent').value.length;
  document.getElementById('momentChars').textContent = len;
  var btn = document.getElementById('momentPublishBtn');
  btn.disabled = len === 0 && momentImages.length === 0;
}

function gridClass(n) {
  if (n === 1) return 'grid-1';
  if (n === 2) return 'grid-2';
  if (n <= 4) return 'grid-4';
  if (n <= 6) return 'grid-6';
  return 'grid-9';
}

function openViewer(src) {
  var v = document.createElement('div');
  v.className = 'img-viewer';
  var img = document.createElement('img');
  img.src = src;
  v.appendChild(img);
  v.addEventListener('click', function(){ v.remove(); });
  document.body.appendChild(v);
}
window.openViewer = openViewer;


function renderMoment(m, isOwner) {
  var imagesHtml = '';
  if (m.images && m.images.length) {
    imagesHtml = '<div class="moment-images ' + gridClass(m.images.length) + '">' +
      m.images.map(function(src){
        return '<img class="moment-img" src="' + src + '" loading="lazy" onclick="event.stopPropagation();openViewer(this.src)">';
      }).join('') + '</div>';
  }

  var avatarHtml = m.ownerAvatar
    ? '<img class="moment-avatar" src="' + m.ownerAvatar + '" onerror="this.outerHTML=\'<div class=moment-avatar-ph>'+esc((m.ownerName||'?')[0])+'</div>\'">'
    : '<div class="moment-avatar-ph">' + esc((m.ownerName || '?')[0]) + '</div>';

  var commentsHtml = '';
  if (m.comments && m.comments.length) {
    commentsHtml = '<div class="moment-comments">' +
      m.comments.map(function(c){
        return '<div class="moment-comment"><span class="c-name">' + esc(c.name) + '</span>' + esc(c.content) + '</div>';
      }).join('') +
      '</div>';
  }

  var likedClass = m.liked ? ' liked' : '';
  var likeIcon = m.liked ? '❤️' : '🤍';
  var deleteBtn = isOwner ? '<button class="moment-action danger" onclick="deleteMoment(' + m.id + ')">🗑️ 删除</button>' : '';

  return '<div class="moment-item" data-id="' + m.id + '">' +
    '<div class="moment-head">' + avatarHtml +
      '<div><div class="moment-name">' + esc(m.ownerName) + '</div>' +
      '<div class="moment-time">' + fmtTime(m.createdAt) + '</div></div>' +
    '</div>' +
    (m.content ? '<div class="moment-content">' + esc(m.content) + '</div>' : '') +
    imagesHtml +
    '<div class="moment-actions">' +
      '<button class="moment-action' + likedClass + '" onclick="toggleMomentLike(' + m.id + ', this)">' + likeIcon + ' <span class="like-count">' + (m.likesCount || 0) + '</span></button>' +
      '<button class="moment-action" onclick="toggleMomentComments(' + m.id + ', this)">💬 <span>' + (m.commentsCount || 0) + '</span></button>' +
      deleteBtn +
    '</div>' +
    '<div class="moment-comments-wrap" style="display:none">' + commentsHtml +
      '<div class="moment-comment-input"><input placeholder="说点什么..." maxlength="300" onkeydown="if(event.key===\'Enter\')submitMomentComment(' + m.id + ', this)"><button onclick="submitMomentComment(' + m.id + ', this.previousElementSibling)">发送</button></div>' +
    '</div>' +
  '</div>';
}

function loadMyMoments() {
  var list = document.getElementById('myMomentsList');
  var myId = Auth.getUserId();
  fetch('/api/moments?userId=' + encodeURIComponent(myId) + '&pageSize=20')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        list.innerHTML = '<div class="history-empty">加载失败</div>';
        return;
      }
      var moments = data.moments || [];
      if (moments.length === 0) {
        list.innerHTML = '<div class="history-empty">还没有发布动态</div>';
        return;
      }
      list.innerHTML = moments.map(function(m){ return renderMoment(m, true); }).join('');
    })
    .catch(function() {
      list.innerHTML = '<div class="history-empty">加载失败</div>';
    });
}

function initMoments() {
  var imgInput = document.getElementById('momentImgInput');
  var previewGrid = document.getElementById('momentPreviewGrid');

  imgInput.addEventListener('change', function() {
    var files = Array.prototype.slice.call(this.files);
    var remaining = 9 - momentImages.length;
    if (files.length > remaining) {
      showToast('最多上传9张图片', 'error');
      files = files.slice(0, remaining);
    }
    files.forEach(function(file) {
      if (!file.type.startsWith('image/')) return;
      if (file.size > 10 * 1024 * 1024) { showToast('单张图片不能超过10MB', 'error'); return; }
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          // 压缩到最大 1200px
          var maxW = 1200, maxH = 1200;
          var w = img.width, h = img.height;
          if (w > maxW || h > maxH) {
            var ratio = Math.min(maxW / w, maxH / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/webp', 0.7);
          momentImages.push(dataUrl);
          renderPreview();
          updateMomentChars();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
    this.value = '';
  });

  loadMyMoments();
}

function renderPreview() {
  var grid = document.getElementById('momentPreviewGrid');
  grid.innerHTML = momentImages.map(function(src, i) {
    return '<div class="moment-preview-item"><img src="' + src + '"><button class="remove" onclick="removeMomentImage(' + i + ')">×</button></div>';
  }).join('');
}

function removeMomentImage(i) {
  momentImages.splice(i, 1);
  renderPreview();
  updateMomentChars();
}

function publishMoment() {
  if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }
  var content = document.getElementById('momentContent').value.trim();
  if (!content && momentImages.length === 0) return;
  var btn = document.getElementById('momentPublishBtn');
  btn.disabled = true; btn.textContent = '发布中...';

  fetch('/api/moments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: content, images: momentImages })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        document.getElementById('momentContent').value = '';
        momentImages = [];
        renderPreview();
        updateMomentChars();
        showToast('发布成功', 'success');
        loadMyMoments();
      } else {
        showToast(data.message || '发布失败', 'error');
      }
    })
    .catch(function() { showToast('网络错误', 'error'); })
    .finally(function() { btn.disabled = false; btn.textContent = '发布'; });
}

function deleteMoment(id) {
  if (!confirm('确定删除这条动态吗？')) return;
  fetch('/api/moments?id=' + id, { method: 'DELETE' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        showToast('已删除', 'success');
        loadMyMoments();
      } else {
        showToast(data.message || '删除失败', 'error');
      }
    })
    .catch(function() { showToast('网络错误', 'error'); });
}

function toggleMomentLike(id, btn) {
  if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }
  var isLiked = btn.classList.contains('liked');
  var action = isLiked ? 'unlike' : 'like';
  fetch('/api/moments', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ momentId: id, action: action })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        btn.classList.toggle('liked', !isLiked);
        btn.innerHTML = (isLiked ? '🤍' : '❤️') + ' <span class="like-count">' + (data.likesCount || 0) + '</span>';
      } else {
        showToast(data.message || '操作失败', 'error');
      }
    })
    .catch(function() { showToast('网络错误', 'error'); });
}

function toggleMomentComments(id, btn) {
  var wrap = btn.closest('.moment-item').querySelector('.moment-comments-wrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
}

function submitMomentComment(id, input) {
  if (!Auth.isLoggedIn()) { Auth.showLoginModal(); return; }
  var text = input.value.trim();
  if (!text) return;
  var btn = input.nextElementSibling;
  if (btn) btn.disabled = true;
  fetch('/api/moments', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ momentId: id, content: text })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        input.value = '';
        loadMyMoments();
      } else {
        showToast(data.message || '评论失败', 'error');
      }
    })
    .catch(function() { showToast('网络错误', 'error'); })
    .finally(function() { if (btn) btn.disabled = false; });
}

})();
</script>
</body>
