<style>
:root{
  --font-serif:-apple-system,'PingFang SC','Songti SC',serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','PingFang SC','Helvetica Neue','Microsoft YaHei','微软雅黑',Arial,sans-serif;
  --bg:#0d0710;
  --bg-elevated:#150c1c;
  --surface:#1a1122;
  --surface-hover:#22162c;
  --hairline:rgba(255,255,255,.08);
  --hairline-strong:rgba(255,255,255,.14);
  --text-primary:#f7ede8;
  --text-secondary:#b3a3ae;
  --text-tertiary:#7c6c78;
  --accent:#dfb6b2;
  --accent-dim:#c9908c;
  --accent-glow:rgba(82,43,91,.32);
  --accent-soft:rgba(223,182,178,.09);
  --purple:#522b5b;
  --rose:#854f6c;
  --ease:cubic-bezier(.16,1,.3,1);

  /* 兼容别名：与全站 match.html / sm-test.html 共享词汇表 */
  --ink:var(--bg);
  --ink-deep:var(--bg-elevated);
  --parchment:var(--text-primary);
  --parchment-dim:var(--text-secondary);
  --rouge:var(--accent);
  --rouge-dim:var(--accent-dim);
  --gold:var(--accent);
  --virtue:#d9b26a;
  --line:var(--hairline);
}
*{margin:0;padding:0;box-sizing:border-box;}
.hidden{display:none !important;}
html,body{background:var(--bg);color:var(--text-primary);font-family:var(--font-sans);min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
body{
  background-image:
    radial-gradient(ellipse 1000px 620px at 18% -12%, rgba(223,182,178,.10), transparent),
    radial-gradient(ellipse 820px 520px at 104% 106%, rgba(133,79,108,.13), transparent);
  background-attachment:fixed;
}
::selection{background:var(--accent);color:#1a0f18;}
button{font-family:var(--font-sans);}
button:focus-visible,a:focus-visible{outline:2px solid rgba(223,182,178,.72);outline-offset:2px;border-radius:8px;}

.stage{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 24px;}

/* top bar */
.account-bar{
  display:flex;
  justify-content:flex-end;
  padding:14px 0 0;
}
.account-bar-inner{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:12.5px;
}
.account-bar-logo{
  width:20px;height:20px;
  object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(223,182,178,.35));
  flex-shrink:0;
}
.nav-home-link{font-size:13px;color:var(--text-tertiary);text-decoration:none;display:inline-flex;align-items:center;gap:2px;transition:color .2s}

/* progress */
.progress-wrap{position:sticky;top:0;z-index:12;padding:16px 0 12px;background:linear-gradient(var(--bg) 78%,rgba(13,7,16,0));}
.progress-track{height:1px;background:var(--hairline-strong);position:relative;}
.progress-fill{height:1px;background:var(--accent);width:0;transition:width .5s cubic-bezier(.4,0,.2,1);position:relative;}
.progress-fill::after{content:'';position:absolute;right:-3px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateY(-50%);box-shadow:0 0 8px var(--accent);}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;letter-spacing:.06em;color:var(--text-secondary);font-variant-numeric:tabular-nums;}
.progress-meta .part{color:var(--accent);}

/* landing */
.landing{flex:1;display:flex;flex-direction:column;justify-content:center;padding:54px 0 72px;animation:fadeUp .8s var(--ease) both;}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.22em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:18px;font-weight:600;}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--hairline-strong);}
.hero-title{font-size:64px;line-height:1.05;font-weight:700;letter-spacing:-.035em;margin-bottom:16px;text-wrap:balance;}
.hero-title .accent{color:var(--accent);}
.hero-subtitle{font-size:19px;line-height:1.55;font-weight:500;color:var(--text-secondary);letter-spacing:-.01em;margin-bottom:18px;text-wrap:balance;}
.lede{font-size:14.5px;line-height:1.85;color:var(--text-secondary);max-width:500px;}
.meta-row{display:flex;gap:32px;margin:30px 0 34px;font-size:12px;color:var(--text-secondary);}
.meta-row strong{display:block;font-size:21px;line-height:1.2;color:var(--text-primary);font-weight:700;letter-spacing:-.01em;margin-bottom:4px;}
.btn-primary{
  align-self:flex-start;background:var(--accent);color:#1a0f18;border:none;
  padding:16px 36px;font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
  border-radius:100px;transition:all .25s var(--ease);
}
.btn-primary:hover{background:var(--accent-dim);transform:translateY(-1px) scale(1.01);box-shadow:0 12px 32px var(--accent-glow);}
.btn-primary:active{transform:translateY(0) scale(.98);}
.btn-primary:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none;}
.btn-secondary{
  background:var(--surface);color:var(--text-primary);border:1px solid var(--hairline-strong);
  padding:14px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:100px;
  transition:all .2s var(--ease);
}
.btn-secondary:hover{background:var(--surface-hover);border-color:rgba(255,255,255,.24);}
.btn-secondary:active{transform:scale(.98);}
.landing-note{margin-top:22px;font-size:12.5px;line-height:1.8;color:var(--text-secondary);max-width:480px;}
.landing-note strong{color:var(--text-primary);font-weight:600;}
.resume-bar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border:1px solid var(--hairline-strong);background:var(--surface);border-radius:16px;
  padding:14px 18px;margin:0 0 24px;
}
.resume-bar p{font-size:13px;color:var(--text-secondary);line-height:1.5;}
.resume-bar p strong{color:var(--accent);font-weight:600;}
.resume-actions{display:flex;gap:10px;align-items:center;}
.link-btn{background:none;border:none;color:var(--text-secondary);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 2px;}
.link-btn:hover{color:var(--text-primary);}
.mini-btn{background:var(--accent);color:#1a0f18;border:none;border-radius:100px;padding:9px 18px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);}
.mini-btn:hover{background:var(--accent-dim);}

/* question */
.question-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 0 56px;min-height:72vh;}
.q-card{animation:fadeUp .45s var(--ease) both;}
.q-head{outline:none;}
.q-eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:16px;font-weight:600;font-variant-numeric:tabular-nums;}
.q-eyebrow::before{content:'';width:16px;height:1px;background:var(--hairline-strong);}
.q-text{font-family:var(--font-serif);font-size:26px;line-height:1.55;font-weight:600;letter-spacing:-.01em;margin-bottom:10px;text-wrap:balance;}
.q-sub{font-size:12.5px;line-height:1.7;color:var(--text-secondary);margin-bottom:8px;}
.options{display:flex;flex-direction:column;gap:10px;margin:26px 0 22px;}
.option{
  display:flex;align-items:flex-start;gap:14px;width:100%;padding:17px 19px;
  background:var(--surface);border:1px solid transparent;border-radius:16px;
  color:var(--text-primary);text-align:left;cursor:pointer;
  transition:background .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease);
}
.option:hover{background:var(--surface-hover);}
.option.selected{border-color:var(--accent);background:var(--accent-soft);}
.option .mark{
  flex-shrink:0;width:20px;height:20px;border:1.5px solid rgba(255,255,255,.28);
  border-radius:50%;position:relative;margin-top:2px;transition:all .2s var(--ease);
}
.option.selected .mark{border-color:var(--accent);background:var(--accent);}
.option.selected .mark::after{content:'';position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);}
.option .txt{font-size:15.5px;line-height:1.55;font-weight:450;}
.option .num{flex-shrink:0;width:20px;text-align:center;font-size:11px;color:var(--text-secondary);margin-top:4px;font-variant-numeric:tabular-nums;}
.option.scenario{border-color:rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(223,182,178,.07),rgba(26,17,34,.9));}
.option.scenario:hover{background:var(--surface-hover);}
.option.scenario.selected{border-color:var(--accent);background:var(--accent-soft);}
.option.scenario .mark{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-secondary);}
.option.scenario.selected .mark{color:#1a0f18;background:var(--accent);border-color:var(--accent);}
.option.scenario.selected .mark::after{display:none;}
.scale-hint{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin:-8px 2px 20px;letter-spacing:.02em;}
.q-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:4px;}
.nav-back,.nav-exit{background:none;border:none;font-size:13px;color:var(--text-secondary);cursor:pointer;padding:8px 0;transition:color .2s var(--ease);}
.nav-back:hover,.nav-exit:hover{color:var(--text-primary);}
.nav-back:disabled{opacity:.3;cursor:default;}
.key-hint{font-size:11px;color:var(--text-secondary);text-align:center;margin-top:20px;letter-spacing:.02em;}

/* result */
.result-screen{padding:44px 0 96px;animation:fadeUp .6s var(--ease) both;outline:none;}
.result-hero{text-align:center;padding-bottom:34px;margin-bottom:34px;border-bottom:1px solid var(--hairline);}
.result-tag{font-size:11.5px;letter-spacing:.14em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:18px;font-weight:600;}
.result-hero h1{font-size:30px;line-height:1.35;font-weight:700;letter-spacing:-.02em;margin-bottom:18px;text-wrap:balance;}
.result-hero h1 .accent{color:var(--accent);}
.result-hero .desc{font-size:14px;line-height:1.85;color:var(--text-secondary);max-width:500px;margin:0 auto;}
.result-chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:20px;}
.chip{font-size:11.5px;color:var(--text-secondary);border:1px solid var(--hairline-strong);border-radius:100px;padding:7px 12px;background:rgba(255,255,255,.03);}
.chip.accent{color:var(--accent);border-color:rgba(223,182,178,.30);background:var(--accent-soft);}
.quality-banner{
  border:1px solid rgba(223,182,178,.28);background:var(--accent-soft);border-radius:16px;
  padding:16px 18px;margin-bottom:30px;font-size:13px;line-height:1.75;color:var(--text-secondary);
}
.quality-banner strong{display:block;color:var(--accent);font-size:13.5px;margin-bottom:6px;font-weight:600;}
.section-block{margin-bottom:42px;}
.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
.section-head .num{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em;}
.section-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.section-desc{font-size:12.5px;line-height:1.75;color:var(--text-secondary);margin-bottom:18px;}
.bars{display:flex;flex-direction:column;gap:13px;}
.bar-row{display:grid;grid-template-columns:46px 1fr 44px;align-items:center;gap:12px;}
.bar-label{font-size:13px;color:var(--text-secondary);}
.bar-row.top .bar-label{color:var(--text-primary);font-weight:600;}
.bar-track{height:6px;border-radius:100px;background:var(--surface);overflow:hidden;}
.bar-fill{height:100%;border-radius:100px;background:var(--accent);opacity:.42;width:0;transition:width 1.1s var(--ease);}
.bar-row.top .bar-fill{opacity:1;}
.bar-val{font-size:12.5px;color:var(--text-secondary);text-align:right;font-variant-numeric:tabular-nums;}
.bar-row.top .bar-val{color:var(--accent);font-weight:700;}
/* 14 维：罪 / 德 配对 */
.bar-row.virtue{margin-top:-6px;}
.bar-row.virtue .bar-label{color:var(--virtue,#d9b26a);opacity:.85;font-size:12.5px;}
.bar-row.virtue .bar-track{height:4px;}
.bar-row.virtue .bar-fill{background:var(--virtue,#d9b26a);opacity:.55;}
.bar-row.virtue.top .bar-label{color:var(--virtue,#d9b26a);font-weight:600;opacity:1;}
.bar-row.virtue.top .bar-fill{opacity:.95;}
.bar-row.virtue.top .bar-val{color:var(--virtue,#d9b26a);font-weight:700;}
.bar-pair-sep{height:1px;background:var(--line,rgba(255,255,255,.08));margin:4px 0;}
.primary-card{
  border:1px solid var(--hairline-strong);border-radius:22px;padding:24px 22px;
  background:linear-gradient(160deg,var(--surface-hover) 0%,var(--surface) 74%);
  box-shadow:0 24px 60px rgba(0,0,0,.30);
}
.primary-card.double{margin-bottom:14px;}
.badge-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.badge-icon{width:38px;height:38px;border-radius:12px;border:1px solid rgba(223,182,178,.28);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
.badge-icon svg{width:20px;height:20px;}
.badge-kicker{font-size:11px;letter-spacing:.10em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:3px;}
.badge-name{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.primary-quote{font-family:var(--font-serif);font-size:15.5px;line-height:1.7;color:var(--accent);margin-bottom:14px;}
.primary-copy{font-size:13.5px;line-height:1.8;color:var(--text-secondary);}
.scenario-card{border:1px solid var(--hairline);border-radius:18px;padding:20px;background:var(--surface);}
.scenario-card .kicker{font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.scenario-card p{font-size:13px;line-height:1.8;color:var(--text-secondary);}
.scenario-card strong{color:var(--text-primary);font-weight:600;}
details.interpret{border-top:1px solid var(--hairline);padding:14px 0 2px;}
details.interpret[open]{padding-bottom:12px;}
details.interpret summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;color:var(--text-primary);}
details.interpret summary::-webkit-details-marker{display:none;}
details.interpret summary .arrow{color:var(--text-secondary);font-size:12px;transition:transform .2s var(--ease);}
details.interpret[open] summary .arrow{transform:rotate(90deg);}
details.interpret .body{padding-top:10px;font-size:13px;line-height:1.85;color:var(--text-secondary);}
details.interpret .body .quote{font-family:var(--font-serif);color:var(--accent);margin-bottom:8px;display:block;}
details.interpret.virtue summary{color:var(--virtue,#d9b26a);}
details.interpret.virtue .body .quote{color:var(--virtue,#d9b26a);}
.disclaimer{margin-top:44px;padding-top:20px;border-top:1px solid var(--hairline);font-size:11.5px;line-height:1.8;color:var(--text-secondary);}

/* share */
.share-card{
  border-radius:22px;border:1px solid rgba(223,182,178,.20);padding:26px 22px;
  background:
    radial-gradient(circle at 20% 0%,rgba(223,182,178,.14),transparent 58%),
    linear-gradient(160deg,#1d1226,#0f0815 78%);
  text-align:center;
}
.share-brand{font-size:10.5px;letter-spacing:.18em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:18px;}
.share-title{font-size:13px;letter-spacing:.10em;color:var(--text-secondary);margin-bottom:10px;}
.share-primary{font-family:var(--font-serif);font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--accent);margin-bottom:10px;line-height:1.25;}
.share-phrase{font-family:var(--font-serif);font-size:14.5px;line-height:1.7;color:var(--text-primary);margin-bottom:18px;}
.share-values{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums;}
.share-values .v{color:var(--text-primary);}
.share-foot{font-size:10px;letter-spacing:.06em;color:var(--text-secondary);margin-top:18px;padding-top:14px;border-top:1px solid var(--hairline);}
.share-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.result-actions{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap;}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:480px){
  .stage{padding:0 18px;}
  .hero-title{font-size:44px;}
  .hero-subtitle{font-size:16px;}
  .lede{font-size:14px;}
  .meta-row{gap:20px;font-size:11.5px;}
  .meta-row strong{font-size:19px;}
  .q-text{font-size:22px;}
  .option{padding:14px 16px;gap:12px;}
  .option .txt{font-size:14px;}
  .result-hero h1{font-size:24px;}
  .bar-row{grid-template-columns:40px 1fr 40px;gap:10px;}
  .share-card{padding:22px 18px;}
  .share-primary{font-size:27px;}
  .result-actions{flex-direction:column;}
  .result-actions .btn-primary,.result-actions .btn-secondary{width:100%;text-align:center;align-self:stretch;}
  .quality-banner{padding:14px 15px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
}
</style>

  {"id":"ss-45","dim":"scenario","text":"深夜一个人刷手机，你更容易：","type":"scenario","reverse":false,"weight":1,"seconds":25,"options":[
    {"id":"A","text":"看到喜欢的人在线，想发点什么。","scores":{"lust":2}},
    {"id":"B","text":"刷到别人的旅行或恋爱日常，越刷越睡不着。","scores":{"envy":2}},
    {"id":"C","text":"点份夜宵，边吃边看。","scores":{"gluttony":2}},
    {"id":"D","text":"明明困了，还是停不下来地刷。","scores":{"sloth":2}}
  ]}
];

/* 按 7 维一轮混排，每轮内部再打散，避免出现固定轮转规律；情境题放最后 */
function seededRandom(seed){
  var s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function(){
    s = s * 16807 % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function shuffled(arr, rnd){
  var out = arr.slice();
  for (var i = out.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = out[i]; out[i] = out[j]; out[j] = t;
  }
  return out;
}
function buildOrder(){
  var byDim = {};
  DIMS.forEach(function(d){ byDim[d] = []; });
  QUESTIONS.forEach(function(q){
    if (q.type === 'likert5' && byDim[q.dim]) byDim[q.dim].push(q);
  });
  var rnd = seededRandom(20261105);
  var list = [];
  var rounds = Math.max.apply(null, DIMS.map(function(d){ return byDim[d].length; }));
  for (var r = 0; r < rounds; r++){
    var group = DIMS.map(function(d){ return byDim[d][r]; }).filter(Boolean);
    shuffled(group, rnd).forEach(function(q){ list.push(q); });
  }
  QUESTIONS.forEach(function(q){ if (q.type === 'scenario') list.push(q); });
  return list;
}

var ORDERED = buildOrder();
var TOTAL = ORDERED.length;
var LIKERT_TOTAL = QUESTIONS.filter(function(q){ return q.type === 'likert5'; }).length;

/* ==================== 状态 ==================== */

var STORAGE_KEY = 'xinjing_seven_sins_progress_v1';
var state = {
  mode:'landing',
  current:0,
  answers:{},
  startedAt:0,
  locked:false
};

var el = {
  landing:document.getElementById('landing'),
  questionScreen:document.getElementById('questionScreen'),
  resultScreen:document.getElementById('resultScreen'),
  progressWrap:document.getElementById('progressWrap'),
  progressFill:document.getElementById('progressFill'),
  progressCount:document.getElementById('progressCount'),
  partLabel:document.getElementById('partLabel'),
  qCard:document.getElementById('qCard'),
  resumeBar:document.getElementById('resumeBar'),
  resumeCount:document.getElementById('resumeCount')
};

/* ==================== 工具 ==================== */

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function round(n){ return Math.round(n); }
function popSd(arr){
  if (!arr.length) return 0;
  var m = arr.reduce(function(a,b){ return a + b; },0) / arr.length;
  var v = arr.reduce(function(a,b){ return a + (b-m)*(b-m); },0) / arr.length;
  return Math.sqrt(v);
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function countAnswered(){ return Object.keys(state.answers).length; }
function isDim(d){ return DIMS.indexOf(d) !== -1; }

/* ==================== 进度存取 ==================== */

function readSaved(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || typeof d !== 'object' || !d.answers || typeof d.answers !== 'object') return null;
    var n = Object.keys(d.answers).length;
    if (n < 1 || n > TOTAL) return null;
    var cur = Number(d.current);
    if (!Number.isFinite(cur) || cur < 0 || cur >= TOTAL) cur = clamp(n - 1, 0, TOTAL - 1);
    return { answers:d.answers, current:cur, startedAt:Number(d.startedAt) || 0 };
  }catch(e){ return null; }
}

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      answers:state.answers,
      current:state.current,
      startedAt:state.startedAt
    }));
  }catch(e){}
}

function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

function refreshResumeBar(){
  var saved = readSaved();
  if (!saved){ el.resumeBar.classList.add('hidden'); return; }
  var n = Object.keys(saved.answers).length;
  el.resumeCount.textContent = '第 ' + Math.min(saved.current + 1, TOTAL) + ' 题（已答 ' + n + ' / ' + TOTAL + '）';
  el.resumeBar.classList.remove('hidden');
}

/* ==================== 答题流程 ==================== */

function startQuiz(resume){
  var saved = resume ? readSaved() : null;
  state.mode = 'quiz';
  state.answers = saved ? saved.answers : {};
  state.current = saved ? saved.current : 0;
  state.startedAt = saved && saved.startedAt ? saved.startedAt : Date.now();
  state.locked = false;

  el.landing.classList.add('hidden');
  el.resultScreen.classList.add('hidden');
  el.questionScreen.classList.remove('hidden');
  el.progressWrap.classList.remove('hidden');
  el.progressWrap.setAttribute('aria-valuemax', String(TOTAL));

  window.scrollTo({ top:0, behavior:'auto' });
  renderQuestion();
  saveProgress();

  if (window.SMTrack && window.SMTrack.trackEvent){
    window.SMTrack.trackEvent('quiz_start', { quiz_type:'seven_sins' });
  }
}

function renderQuestion(){
  var q = ORDERED[state.current];
  if (!q){ finishQuiz(); return; }

  var pct = Math.round(((state.current + 1) / TOTAL) * 100);
  el.progressFill.style.width = pct + '%';
  el.progressCount.textContent = String(state.current + 1).padStart(2,'0') + ' / ' + TOTAL;
  el.partLabel.textContent = '第 ' + (Math.floor(state.current / 9) + 1) + ' / 5 部分';
  el.progressWrap.setAttribute('aria-valuenow', String(state.current + 1));

  var html = '<div class="q-head" aria-live="polite">';
  html += '<div class="q-eyebrow">第 ' + (state.current + 1) + ' 题 · ' + (q.type === 'scenario' ? '情境抉择' : '日常题') + '</div>';
  html += '<div class="q-text" id="qText" tabindex="-1">' + esc(q.text) + '</div>';
  if (q.type === 'scenario'){
    html += '<div class="q-sub">情境题不计入十四维分数，只用于理解你在具体选择里的倾向。</div>';
  }
  html += '</div>';

  if (q.type === 'likert5'){
    html += '<div class="options" role="radiogroup" aria-label="请选择你的同意程度">';
    SCALE_LABELS.forEach(function(label, i){
      var val = i + 1;
      var selected = state.answers[q.id] === val;
      html += '<button type="button" class="option' + (selected ? ' selected' : '') + '" role="radio" aria-checked="' + (selected ? 'true' : 'false') + '" data-value="' + val + '">' +
              '<span class="num" aria-hidden="true">' + val + '</span>' +
              '<span class="mark" aria-hidden="true"></span>' +
              '<span class="txt">' + esc(label) + '</span></button>';
    });
    html += '</div>';
    html += '<div class="scale-hint"><span>完全不同意</span><span>完全同意</span></div>';
  } else {
    html += '<div class="options" role="radiogroup" aria-label="请选择一个更接近你的反应">';
    q.options.forEach(function(opt){
      var selected = state.answers[q.id] === opt.id;
      html += '<button type="button" class="option scenario' + (selected ? ' selected' : '') + '" role="radio" aria-checked="' + (selected ? 'true' : 'false') + '" data-value="' + esc(opt.id) + '">' +
              '<span class="mark" aria-hidden="true">' + esc(opt.id) + '</span>' +
              '<span class="txt">' + esc(opt.text) + '</span></button>';
    });
    html += '</div>';
  }

  html += '<div class="q-nav">' +
          '<button type="button" class="nav-back" id="backBtn"' + (state.current === 0 ? ' disabled' : '') + '>← 上一题</button>' +
          '<button type="button" class="nav-exit" id="navExit">退出</button>' +
          '</div>';
  html += '<div class="key-hint">按数字键 1–' + (q.type === 'likert5' ? '5' : '4') + ' 也可以选择</div>';

  el.qCard.innerHTML = html;

  Array.prototype.forEach.call(el.qCard.querySelectorAll('.option'), function(btn){
    btn.addEventListener('click', function(){ choose(btn.getAttribute('data-value')); });
  });
  var back = document.getElementById('backBtn');
  if (back) back.addEventListener('click', goBack);
  var exit = document.getElementById('navExit');
  if (exit) exit.addEventListener('click', tryExit);

  el.qCard.style.animation = 'none';
  void el.qCard.offsetHeight;
  el.qCard.style.animation = '';
  window.scrollTo({ top:0, behavior:'auto' });
}

function choose(value){
  if (state.mode !== 'quiz' || state.locked) return;
  var q = ORDERED[state.current];
  if (!q) return;

  var normalized = q.type === 'likert5' ? Number(value) : String(value);
  if (q.type === 'likert5' && (!Number.isInteger(normalized) || normalized < 1 || normalized > 5)) return;

  state.answers[q.id] = normalized;
  saveProgress();

  var buttons = el.qCard.querySelectorAll('.option');
  Array.prototype.forEach.call(buttons, function(btn){
    var on = btn.getAttribute('data-value') === String(normalized);
    btn.classList.toggle('selected', on);
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
  });

  state.locked = true;
  setTimeout(function(){
    state.locked = false;
    if (state.current >= TOTAL - 1) finishQuiz();
    else { state.current += 1; saveProgress(); renderQuestion(); }
  }, q.type === 'scenario' ? 300 : 240);
}

function goBack(){
  if (state.mode !== 'quiz' || state.current <= 0) return;
  state.locked = false;
  state.current -= 1;
  saveProgress();
  renderQuestion();
}

function tryExit(){
  if (state.mode === 'quiz' && countAnswered() > 0){
    if (!window.confirm('本次进度已保存在本机，确定返回测评中心？')) return;
  }
  window.location.href = '/assess.html';
}

/* ==================== 计分 ==================== */

function computeResult(){
  var per = {};
  DIMS.forEach(function(d){ per[d] = { sum:0, n:0, vsum:0, vn:0 }; });

  QUESTIONS.forEach(function(q){
    if (q.type !== 'likert5' || !isDim(q.dim)) return;
    var raw = state.answers[q.id];
    if (raw == null) return;
    var x = Number(raw);
    if (q.reverse){
      /* 反向题 = 美德维度：同意越强，美德越高 */
      per[q.dim].vsum += x;
      per[q.dim].vn += 1;
    } else {
      /* 正向题 = 罪维度：同意越强，浓度越高 */
      per[q.dim].sum += x;
      per[q.dim].n += 1;
    }
  });

  var D = {}, V = {};
  DIMS.forEach(function(d){
    var p = per[d];
    D[d] = p.n ? ((p.sum / p.n) - 1) / 4 * 100 : 0;
    V[d] = p.vn ? ((p.vsum / p.vn) - 1) / 4 * 100 : 0;
  });

  var M = DIMS.reduce(function(a,d){ return a + D[d]; },0) / DIMS.length;
  var SD = popSd(DIMS.map(function(d){ return D[d]; }));
  var z = {};
  DIMS.forEach(function(d){
    z[d] = SD >= 1 ? (D[d] - M) / SD : 0;
  });

  var ranked = DIMS.slice().sort(function(a,b){
    if (SD >= 1){
      if (z[b] !== z[a]) return z[b] - z[a];
    }
    return D[b] - D[a];
  });

  var gap = SD >= 1 ? (z[ranked[0]] - z[ranked[1]]) : 0;
  var double = SD >= 1 && gap < 0.15;
  var intensity = round(M);
  var shape = SD < 8 ? '平坦' : (double ? '双峰' : (gap >= 0.30 ? '单峰' : '多峰'));

  /* 质量检查：42 道原始作答 */
  var rawList = ORDERED.filter(function(q){ return q.type === 'likert5'; })
                      .map(function(q){ return state.answers[q.id]; })
                      .filter(function(v){ return v != null; })
                      .map(Number);
  var rawSd = popSd(rawList);
  var allSame = rawList.length > 1 && rawList.every(function(v){ return v === rawList[0]; });
  var longest = 0, run = 0, prev = null;
  rawList.forEach(function(v){
    if (v === prev) run += 1;
    else { run = 1; prev = v; }
    if (run > longest) longest = run;
  });

  var forward = [], reverse = [];
  QUESTIONS.forEach(function(q){
    if (q.type !== 'likert5' || state.answers[q.id] == null) return;
    var x = Number(state.answers[q.id]);
    if (q.reverse) reverse.push(6 - x);
    else forward.push(x);
  });
  var consistencyGap = 0;
  if (forward.length && reverse.length){
    var fm = forward.reduce(function(a,b){ return a + b; },0) / forward.length;
    var rm = reverse.reduce(function(a,b){ return a + b; },0) / reverse.length;
    consistencyGap = Math.abs(fm - rm);
  }

  var duration = state.startedAt ? (Date.now() - state.startedAt) : 0;
  var tooFast = duration > 0 && duration < 120000;

  var straight = rawSd < 0.45 || longest >= 9 || allSame;
  var inconsistent = consistencyGap > 1.2;

  var flags = [];
  if (straight) flags.push('你的作答比较整齐，结果更像一张参考图，而不是精确剖面。建议间隔一段时间、按第一反应重做一次。');
  if (inconsistent) flags.push('正向题与反向题的作答存在一定落差，可能有一些题目你读得比较快。');
  if (tooFast) flags.push('这次完成得比较快，部分题目可能没有来得及细想。');

  /* 情境题：只做反差点数与破平参考 */
  var s = {};
  DIMS.forEach(function(d){ s[d] = 0; });
  var covered = {};
  ORDERED.forEach(function(q){
    if (q.type !== 'scenario' || state.answers[q.id] == null) return;
    var picked = null;
    q.options.forEach(function(o){ if (o.id === state.answers[q.id]) picked = o; });
    if (!picked) return;
    Object.keys(picked.scores || {}).forEach(function(d){
      if (!isDim(d)) return;
      s[d] += picked.scores[d];
      covered[d] = true;
    });
  });
  var sRanked = DIMS.slice().sort(function(a,b){ return s[b] - s[a]; });
  var scenarioTop = s[sRanked[0]] > 0 && s[sRanked[0]] !== s[sRanked[1]] ? sRanked[0] : null;

  return {
    D:D, V:V, M:M, SD:SD, z:z, ranked:ranked, gap:gap, double:double,
    intensity:intensity, shape:shape, straight:straight, flags:flags,
    scenario:s, scenarioTop:scenarioTop, covered:covered,
    consistencyGap:consistencyGap, duration:duration
  };
}

/* ==================== 结果渲染 ==================== */

function intensityLabel(v){
  if (v < 35) return '偏低';
  if (v < 55) return '中等';
  if (v < 70) return '中等偏高';
  return '偏高';
}

function overviewText(r){
  var p = r.ranked[0], s = r.ranked[1];
  var pMeta = DIM_META[p], sMeta = DIM_META[s];
  if (r.straight){
    return '这张剖面暂时只作参考：十四维读数比较接近，不适合用它给你贴一个确定的主峰。';
  }
  if (r.double){
    return '你的两个峰是「' + pMeta.label + '」和「' + sMeta.label + '」，差距很小，不必硬分主次。' + pMeta.clause + '；' + sMeta.clause + '。两股力量交替出现时，你可能会在不同情境里像两个人。';
  }
  if (r.shape === '平坦'){
    return '你的十四维读数相差不大，整体比较平。相对高一点的是「' + pMeta.label + '」，但别急着把它当成固定标签。' + pMeta.clause + '。';
  }
  return '你的主导倾向是「' + pMeta.label + '」，辅以「' + sMeta.label + '」。' + pMeta.clause + '；' + sMeta.clause + '。当两股力量同向时，你会很有冲劲；反向时，则容易内耗。';
}

function scenarioText(r){
  if (!r.scenarioTop || !r.covered[r.scenarioTop]) return '';
  var top = DIM_META[r.scenarioTop].label;
  if (r.double){
    if (r.scenarioTop === r.ranked[0] || r.scenarioTop === r.ranked[1]){
      return '情境题的选择也偏向「' + top + '」，和你的双峰结构一致。';
    }
    return '情境里你更常走向「' + top + '」，和双峰结构不完全一致——这也正常，人在具体场景里会调用不同的力量。';
  }
  if (r.scenarioTop !== r.ranked[0]){
    return '嘴上说最在意「' + DIM_META[r.ranked[0]].label + '」，真到选择时却更容易走向「' + top + '」。这不是矛盾，只是两种力量在不同场景里被激活。';
  }
  return '情境题的选择和你的主峰一致，指向「' + top + '」。';
}

function renderResult(r){
  state.mode = 'result';
  el.landing.classList.add('hidden');
  el.questionScreen.classList.add('hidden');
  el.progressWrap.classList.add('hidden');
  el.resultScreen.classList.remove('hidden');

  if (r.straight){
    el.resultScreen.innerHTML = renderReference(r);
  } else {
    el.resultScreen.innerHTML = renderFull(r);
  }
  bindResultActions(r);

  el.resultScreen.focus({ preventScroll:true });
  window.scrollTo({ top:0, behavior:'smooth' });

  if (window.SMTrack && window.SMTrack.trackEvent){
    window.SMTrack.trackEvent('quiz_complete', { quiz_type:'seven_sins', primary:r.ranked[0], double:r.double });
  }

  saveRecord(r);
  setTimeout(function(){
    Array.prototype.forEach.call(document.querySelectorAll('.bar-fill'), function(node){
      node.style.width = (node.getAttribute('data-w') || 0) + '%';

function renderHeader(r, titleHtml){

  var virTop = VIRTUE_META[VIRTUE_OF[virRanked[0]]];

    '<div class="result-tag">你的欲望浓度图</div>' +
    '<h1>' + titleHtml + '</h1>' +
    '<p class="desc">' + esc(overviewText(r)) + '</p>' +
    '<div class="result-chips">' +
      '<span class="chip accent">整体强度 ' + r.intensity + '/100 · ' + intensityLabel(r.intensity) + '</span>' +
      '<span class="chip">剖面 ' + r.shape + '</span>' +
      '<span class="chip">最强美德 ' + virTop.label + ' ' + round(r.V[virRanked[0]]) + '</span>' +

function renderBars(r){
  var sinSorted = DIMS.slice().sort(function(a,b){ return r.D[b] - r.D[a]; });
  var virSorted = DIMS.slice().sort(function(a,b){ return r.V[b] - r.V[a]; });
  var sinTop = sinSorted.slice(0,3);

  var html = '<div class="bars">';

      '<div class="bar-val">' + sv + '</div>' +
    '</div>';

      '<div class="bar-label">' + VIRTUE_META[vd].label + '</div>' +
      '<div class="bar-track"><div class="bar-fill" data-w="' + vv + '"></div></div>' +
      '<div class="bar-val">' + vv + '</div>' +
    '</div>';
    if (i < DIMS.length - 1) html += '<div class="bar-pair-sep"></div>';

function renderMainCard(r, dim, kicker){
  var m = DIM_META[dim];

    '<div class="badge-row">' +
      '<div class="badge-icon">' + ICON_SVG[m.icon] + '</div>' +
      '<div><div class="badge-kicker">' + esc(kicker) + ' · ' + round(r.D[dim]) + '/100</div><div class="badge-name">' + m.label + '</div></div>' +

}

function renderInterpretations(r){
  var openSet = [r.ranked[0]];
  if (r.double) openSet.push(r.ranked[1]);
  var virRanked = DIMS.slice().sort(function(a,b){ return r.V[b] - r.V[a]; });
  var virTop = virRanked[0];
  var html = '';
  DIMS.forEach(function(d){
    var m = DIM_META[d];
    var open = openSet.indexOf(d) !== -1;
    html += '<details class="interpret"' + (open ? ' open' : '') + '>' +
      '<summary><span>' + m.label + ' · 罪 ' + round(r.D[d]) + '</span><span class="arrow" aria-hidden="true">▸</span></summary>' +
      '<div class="body"><span class="quote">' + esc(m.phrase) + '</span>' + esc(m.text) + '</div>' +
    '</details>';
  });
  DIMS.forEach(function(d){
    var vd = VIRTUE_OF[d];
    var m = VIRTUE_META[vd];
    var open = d === virTop;
    html += '<details class="interpret virtue"' + (open ? ' open' : '') + '>' +
      '<summary><span>' + m.label + ' · 德 ' + round(r.V[d]) + '</span><span class="arrow" aria-hidden="true">▸</span></summary>' +
      '<div class="body"><span class="quote">' + esc(m.phrase) + '</span>' + esc(m.text) + '</div>' +
    '</details>';
  });
  return html;
}

function renderFull(r){
  var p = r.ranked[0], s = r.ranked[1];
  var title = r.double

    '0–100 是相对强度，不是人群百分位；上方为罪维（玫红），下方为对应的德维（金），各自前三名高亮。</p>' +
    renderBars(r) +
  '</div>';

  html += '<div class="section-block">' +
    '<div class="section-head"><span class="num">02</span><h2>' + (r.double ? '双峰画像' : (r.shape === '平坦' ? '相对最高' : '主峰画像')) + '</h2></div>' +
    '<p class="section-desc">一句话标签、该罪的解读，以及一个今天就能做的小动作。</p>';

  if (r.double){

  var sText = scenarioText(r);

  html += '<div class="section-block">' +
    '<div class="section-head"><span class="num">0' + (sText ? 4 : 3) + '</span><h2>十四段解读</h2></div>' +
    '<p class="section-desc">前七段是罪维，后七段是对应的德维；主峰、次峰与最高的德维默认展开，其余可以按需查看。每段只写情境与一个小动作，不做评判。</p>' +
    renderInterpretations(r) +
  '</div>';

  html += '<div class="section-block">' +
    '<div class="section-head"><span class="num">0' + (sText ? 5 : 4) + '</span><h2>分享卡</h2></div>' +
    '<p class="section-desc">默认只显示主/副峰与十四维浓度，不显示你的具体作答。保存图片或复制文案都可以。</p>' +
    renderShareCard(r) +
    '<div class="share-actions">' +
      '<button class="btn-secondary" type="button" id="copyBtn">复制分享文案</button>' +
      '<button class="btn-secondary" type="button" id="saveImgBtn">保存分享卡</button>' +
    '</div>' +
  '</div>';

  html += '<p class="disclaimer">免责声明：本测试是娱乐性自我探索，不构成临床诊断；0–100 为相对强度，非人群百分位。若相关困扰持续影响生活，建议寻求专业心理咨询师的帮助。本测试涉及欲望、愤怒等成人话题，建议 16 岁以上阅读。</p>';
  html += '<div class="result-actions">' +

  return html;
}

/* ==================== 结果操作 ==================== */

function bindResultActions(r){
  var restart = document.getElementById('restartBtn');
  if (restart) restart.addEventListener('click', restartQuiz);
  var back = document.getElementById('backAssessBtn');

  if (copy) copy.addEventListener('click', function(){ copyShareText(r, copy); });

  if (save) save.addEventListener('click', function(){ downloadShareCard(r, save); });
}

function restartQuiz(){
  clearProgress();
  state.mode = 'landing';
  state.current = 0;
  state.answers = {};
  state.startedAt = 0;
  state.locked = false;
  el.resultScreen.classList.add('hidden');
  el.questionScreen.classList.add('hidden');
  el.progressWrap.classList.add('hidden');
  el.landing.classList.remove('hidden');

  window.scrollTo({ top:0, behavior:'auto' });

function shareText(r){
  var p = r.ranked[0], s = r.ranked[1];
  var head = r.double
    ? '我的两个峰是「' + DIM_META[p].label + '」和「' + DIM_META[s].label + '」'
    : '我的主峰是「' + DIM_META[p].label + '」，副峰是「' + DIM_META[s].label + '」';
  var vals = DIMS.map(function(d){ return DIM_META[d].short + ' ' + round(r.D[d]); }).join(' · ');
  var vvals = DIMS.map(function(d){ return VIRTUE_META[VIRTUE_OF[d]].short + ' ' + round(r.V[d]); }).join(' · ');
  return DIM_META[p].phrase + '\n' + head + '\n我的七宗罪：' + vals + '\n我的七美德：' + vvals + '\n#心镜';
}

function copyShareText(r, btn){
  var text = shareText(r);
  function done(){
    var old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function(){ btn.textContent = old; }, 1600);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }catch(e){}
}

/* ==================== 分享卡 Canvas ==================== */

function wrapText(ctx, text, maxWidth){
  var lines = [], line = '';
  for (var i = 0; i < text.length; i++){
    var ch = text[i];
    if (line && ctx.measureText(line + ch).width > maxWidth){
      lines.push(line);
      line = ch;
    } else {
      line += ch;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawRadar(ctx, cx, cy, radius, D, V){
  var axes = [];
  DIMS.forEach(function(d){
    axes.push({ label: DIM_META[d].short + ' ' + round(D[d]), v: D[d], virtue: false });
    axes.push({ label: VIRTUE_META[VIRTUE_OF[d]].short + ' ' + round(V[d]), v: V[d], virtue: true });
  });
  var n = axes.length;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1;
  [0.25,0.5,0.75,1].forEach(function(k){
    ctx.beginPath();
    for (var i = 0; i < n; i++){
      var a = -Math.PI / 2 + i * Math.PI * 2 / n;
      var x = cx + Math.cos(a) * radius * k;
      var y = cy + Math.sin(a) * radius * k;
      if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
  });
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  for (var i = 0; i < n; i++){
    var a = -Math.PI / 2 + i * Math.PI * 2 / n;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    ctx.stroke();
  }

  function polygon(isVirtue, fill, stroke){
    ctx.beginPath();
    var first = true;
    for (var j = 0; j < n; j++){
      if (axes[j].virtue !== isVirtue) continue;
      var aj = -Math.PI / 2 + j * Math.PI * 2 / n;
      var rj = radius * (clamp(axes[j].v,0,100) / 100);
      var xj = cx + Math.cos(aj) * rj;
      var yj = cy + Math.sin(aj) * rj;
      if (first){ ctx.moveTo(xj,yj); first = false; } else ctx.lineTo(xj,yj);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  polygon(false, 'rgba(223,182,178,.20)', 'rgba(223,182,178,.90)');
  polygon(true, 'rgba(212,164,74,.14)', 'rgba(212,164,74,.85)');

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var k2 = 0; k2 < n; k2++){
    var ak = -Math.PI / 2 + k2 * Math.PI * 2 / n;
    var lx = cx + Math.cos(ak) * (radius + 74);
    var ly = cy + Math.sin(ak) * (radius + 66);
    ctx.fillStyle = axes[k2].virtue ? 'rgba(230,196,128,.95)' : 'rgba(247,237,232,.92)';
    ctx.font = '500 24px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(axes[k2].label, lx, ly);
  }
  ctx.restore();
}

/* 分享图品牌资源：同源预加载，未就绪时回退为文字，避免导出空白 */
var SHARE_BRAND = { icon: null, text: null };
(function preloadShareBrand(){
  var icon = new Image(), text = new Image();
  icon.onload = function(){ SHARE_BRAND.icon = icon; };
  text.onload = function(){ SHARE_BRAND.text = text; };
  icon.src = '/logo-icon.png';
  text.src = '/logo-text.png';
})();

function drawBrandBlock(ctx, w, top){
  var iconH = 42, textH = 15, gap = 18;
  if (SHARE_BRAND.icon){
    var iconW = Math.round(iconH * SHARE_BRAND.icon.width / SHARE_BRAND.icon.height);
    var textW = SHARE_BRAND.text ? Math.round(textH * SHARE_BRAND.text.width / SHARE_BRAND.text.height) : 0;
    var total = iconW + (textW ? gap + textW : 0);
    var x = w / 2 - total / 2;
    ctx.drawImage(SHARE_BRAND.icon, x, top, iconW, iconH);
    if (textW) ctx.drawImage(SHARE_BRAND.text, x + iconW + gap, top + (iconH - textH) / 2, textW, textH);
    return;
  }
  ctx.fillStyle = 'rgba(179,163,174,.92)';
  ctx.font = '500 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('SOULMIRROR', w / 2, top + 34);
}

function downloadShareCard(r, btn){
  function draw(){
    var W = 1080, H = 1920;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var bg = ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#1d1226');
    bg.addColorStop(.55,'#130b1a');
    bg.addColorStop(1,'#0d0710');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    var glow = ctx.createRadialGradient(200,120,0,200,120,700);
    glow.addColorStop(0,'rgba(223,182,178,.20)');
    glow.addColorStop(1,'rgba(223,182,178,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);

    ctx.textAlign = 'center';
    drawBrandBlock(ctx, W, 98);

    ctx.fillStyle = 'rgba(247,237,232,.96)';
    ctx.font = '700 62px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('我的七宗罪浓度', W/2, 230);

    var p = r.ranked[0];
    var primaryLabel = sharePrimaryText(r);
    ctx.fillStyle = '#dfb6b2';
    ctx.font = (r.double ? '700 92px' : '700 118px') + ' "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(primaryLabel, W/2, r.double ? 400 : 410);

    ctx.fillStyle = 'rgba(247,237,232,.94)';
    ctx.font = '400 42px "PingFang SC","Microsoft YaHei",sans-serif';
    var quote = DIM_META[p].phrase.replace(/[“”]/g,'');
    var lines = wrapText(ctx, quote, 860).slice(0,2);
    lines.forEach(function(line, i){
      ctx.fillText(line, W/2, 520 + i * 62);
    });

    drawRadar(ctx, W/2, 1030, 288, r.D, r.V);

    ctx.fillStyle = 'rgba(223,182,178,.96)';
    ctx.font = '500 28px "PingFang SC","Microsoft YaHei",sans-serif';
    var vals = DIMS.map(function(d){ return DIM_META[d].short + ' ' + round(r.D[d]); }).join(' · ');
    ctx.fillText('罪 ' + vals, W/2, 1488);

    ctx.fillStyle = 'rgba(230,196,128,.96)';
    ctx.font = '500 28px "PingFang SC","Microsoft YaHei",sans-serif';
    var vvals = DIMS.map(function(d){ return VIRTUE_META[VIRTUE_OF[d]].short + ' ' + round(r.V[d]); }).join(' · ');
    ctx.fillText('德 ' + vvals, W/2, 1538);

    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.beginPath();
    ctx.moveTo(120, 1600); ctx.lineTo(W-120, 1600);
    ctx.stroke();

    ctx.fillStyle = 'rgba(179,163,174,.86)';
    ctx.font = '400 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('娱乐性自我探索 · 非临床诊断 · 0–100 为相对强度', W/2, 1660);
    ctx.fillStyle = 'rgba(223,182,178,.90)';
    ctx.font = '500 26px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('soulmirror-255.pages.dev', W/2, 1720);

    ctx.fillStyle = 'rgba(179,163,174,.66)';
    ctx.font = '400 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('建议 16 岁以上阅读 · 结果仅供自我探索', W/2, 1790);

    // 二维码：指向当前页面地址（品牌浅玫瑰圆角底 + 深酒红码点，静区 4 模块）
    if (window.SMQR){
      SMQR.draw(ctx, location.origin + '/seven-sins.html', 820, 1660, 200, { margin: 4, light: '#F5E7E4', dark: '#4A1F2B', radius: 16 });
    }

    if (canvas.toBlob){
      canvas.toBlob(function(blob){
        if (!blob){ fail(); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'soulmirror-seven-sins.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        done();
      }, 'image/png');
    } else {
      fail();
    }

    function done(){
      var old = btn.textContent;
      btn.textContent = '已保存';
      setTimeout(function(){ btn.textContent = old; }, 1600);
    }
    function fail(){
      var old = btn.textContent;
      btn.textContent = '长按分享卡截图即可';
      setTimeout(function(){ btn.textContent = old; }, 2200);
    }
  }

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(draw).catch(draw);
  } else {
    draw();
  }
}

/* ==================== 保存记录（匿名） ==================== */

function saveRecord(r){
  try{
    var scores = {};
    DIMS.forEach(function(d){ scores[d] = round(r.D[d]); });
    var virtues = {};
    DIMS.forEach(function(d){ virtues[VIRTUE_OF[d]] = round(r.V[d]); });
    var headline = '七宗罪 · ' + (r.double ? '双峰「' + DIM_META[r.ranked[0]].label + '」×「' + DIM_META[r.ranked[1]].label + '」' : '主峰「' + DIM_META[r.ranked[0]].label + '」');
    var visitorToken = '';
    try{ if (window.SMTrack && window.SMTrack.getVisitorToken) visitorToken = window.SMTrack.getVisitorToken(); }catch(e){}
    fetch('/records', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      credentials:'include',
      body:JSON.stringify({
        headline:headline,
        data:{ scores:scores, virtues:virtues, answers:state.answers },
        visitorToken:visitorToken
      })
    }).catch(function(){});
  }catch(e){}
}

/* ==================== 启动 ==================== */

function finishQuiz(){
  if (state.mode !== 'quiz') return;
  clearProgress();
  var r = computeResult();
  renderResult(r);
}

document.getElementById('startBtn').addEventListener('click', function(){ startQuiz(false); });
document.getElementById('resumeBtn').addEventListener('click', function(){ startQuiz(true); });
document.getElementById('restartFromResume').addEventListener('click', function(){
  clearProgress();
  refreshResumeBar();
  startQuiz(false);
});
var exitLink = document.getElementById('exitLink');
if (exitLink) exitLink.addEventListener('click', function(e){
  if (state.mode === 'quiz' && countAnswered() > 0){
    e.preventDefault();
    tryExit();
  }
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (state.mode === 'quiz'){
      e.preventDefault();
      tryExit();
    }
    return;
  }
  if (state.mode !== 'quiz') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!/^[1-5]$/.test(e.key)) return;
  var q = ORDERED[state.current];
  if (!q) return;
  var idx = Number(e.key) - 1;
  if (q.type === 'likert5'){
    choose(idx + 1);
  } else if (idx < q.options.length){
    choose(q.options[idx].id);
  }
});

refreshResumeBar();
