<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>SoulMirror 心镜 - 提问箱</title>
<meta name="description" content="匿名提问，温柔回应。创建你的专属提问箱，收集真实想法。">
<meta property="og:title" content="SoulMirror 心镜 - 提问箱">
<meta property="og:description" content="有什么想问的吗？匿名提问，温柔回应…">
<meta property="og:image" content="https://soulmirror.cc.cd/assets/share-card.png">
<meta property="og:url" content="https://soulmirror.cc.cd/qa.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SoulMirror 心镜">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="apple-touch-icon" href="/assets/logo.png">
<script src="/auth.js"></script>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
           'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
  --bg: #0d0710;
  --bg-card: #150c1c;
  --surface: #1a1122;
  --surface2: #22162c;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.13);
  --text: #f7ede8;
  --text2: #b3a3ae;
  --text3: #7c6c78;
  --accent: #dfb6b2;
  --accent2: #c9908c;
  --accent-glow: rgba(82,43,91,0.32);
  --accent-soft: rgba(223,182,178,0.08);
  --blue: #854f6c;
  --blue-soft: rgba(133,79,108,0.1);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 100px;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
  --max-w: 640px;
  --ease: cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  scroll-behavior:smooth;
}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -15%, rgba(82,43,91,0.28), transparent),
    radial-gradient(ellipse 600px 400px at 100% 100%, rgba(59,130,246,0.03), transparent);
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:calc(80px + var(--safe-bottom));
}

/* 顶部导航 */
.nav{
  width:100%;max-width:var(--max-w);position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  background:rgba(13,7,16,0.7);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;gap:8px;
}
.nav-inner{width:100%;max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;gap:8px;}
.nav-back{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px;display:flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap;}
.nav-back:hover{color:var(--text);}
.nav-title{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;margin-right:32px;}
.nav-share{background:none;border:none;color:var(--text2);cursor:pointer;padding:6px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:6px;font-size:13px;margin-left:auto;}
.nav-share:hover{background:var(--accent-soft);color:var(--accent);}

/* 个人资料头部 */
.profile-card{
  width:100%;max-width:var(--max-w);padding:24px 16px 20px;
  display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;
}
.profile-avatar{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;color:#fff;margin-bottom:12px;
  flex-shrink:0;overflow:hidden;
}
.profile-name{font-size:17px;font-weight:600;margin-bottom:4px;}
.profile-bio{font-size:13px;color:var(--text3);line-height:1.5;max-width:380px;margin-bottom:14px;}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.profile-stats{
  display:flex;gap:24px;margin-top:16px;
}
.profile-stat{
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.profile-stat-num{font-size:18px;font-weight:700;}
.profile-stat-label{font-size:12px;color:var(--text3);}
.profile-import-btn,.profile-share-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--text2);
  padding:8px 14px;border-radius:var(--radius-pill);font-size:13px;font-family:inherit;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;
}
.profile-import-btn:hover,.profile-share-btn:hover{
  background:var(--surface2);border-color:var(--border-strong);color:var(--text);
}

/* Tab */
.tabs{
  width:100%;max-width:var(--max-w);display:flex;
  border-bottom:1px solid var(--border);padding:0 16px;margin-bottom:16px;
}
.tab-btn{
  flex:1;background:none;border:none;color:var(--text3);font-size:14px;font-weight:500;
  padding:12px 4px 10px;cursor:pointer;position:relative;font-family:inherit;
  transition:color .2s;white-space:nowrap;
}
.tab-btn.active{color:var(--accent);}
.tab-btn.active::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:24px;height:2.5px;border-radius:2px;background:var(--accent);
}
.tab-btn:hover{color:var(--text);}
.tab-badge{
  display:inline-block;background:var(--accent);color:var(--bg);font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:10px;margin-left:6px;
}

/* 提问区域 */
.ask-area{
  width:100%;max-width:var(--max-w);padding:0 16px 16px;
}
.ask-box{
  background:var(--bg-card);border:1px solid var(--border-strong);
  border-radius:var(--radius);overflow:hidden;
}
.ask-input{
  width:100%;padding:16px 16px 12px;background:transparent;border:none;outline:none;
  color:var(--text);font-size:15px;font-family:inherit;resize:none;
  line-height:1.6;min-height:72px;display:block;
}
.ask-input::placeholder{color:var(--text3);}
.ask-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px 10px;border-top:1px solid var(--border);
}
.ask-bar-l{display:flex;align-items:center;gap:12px;}
.ask-chars{font-size:12px;color:var(--text3);transition:color .2s;}
.ask-chars.warn{color:#f0ab63;}
.ask-chars.danger{color:#fb7185;}
.anon-wrap{
  display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text2);
  user-select:none;
}
.anon-wrap input{display:none;}
.anon-dot{
  width:18px;height:18px;border-radius:4px;
  border:2px solid var(--text3);transition:all .2s;display:flex;align-items:center;justify-content:center;
}
.anon-wrap input:checked + .anon-dot{
  background:var(--accent);border-color:var(--accent);
}
.anon-wrap input:checked + .anon-dot::after{
  content:'✓';font-size:12px;color:var(--bg);font-weight:700;
}
.ask-send{
  width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;
  color:var(--bg);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;flex-shrink:0;
}
.ask-send:hover{background:var(--accent2);transform:scale(1.05);}
.ask-send:active{transform:scale(.92);}
.ask-send:disabled{opacity:.3;pointer-events:none;}
.ask-send svg{width:16px;height:16px;}
.ask-err{
  font-size:12px;color:#fb7185;padding:6px 4px 0;min-height:0;transition:all .2s;overflow:hidden;
  max-height:0;opacity:0;
}
.ask-err.show{max-height:40px;opacity:1;margin-bottom:6px;}

.quick-chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;-ms-overflow-style:none;}
.quick-chips::-webkit-scrollbar{display:none;}
.chip{
  white-space:nowrap;background:var(--surface);border:1px solid var(--border);
  color:var(--text2);font-size:12px;padding:7px 14px;border-radius:var(--radius-pill);
  cursor:pointer;font-family:inherit;transition:all .2s;flex-shrink:0;
}
.chip:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent);}

/* Feed */
.feed{width:100%;max-width:var(--max-w);padding:0 16px;}
.feed-list.loading{opacity:.6;}

/* Card */
.card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 16px;
  margin-bottom:12px;transition:border-color .2s;
}
.card:hover{border-color:var(--border-strong);}
.card-q{display:flex;gap:12px;}
.card-q-avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;
}
.card-q-body{flex:1;min-width:0;}
.card-q-text{font-size:15px;font-weight:500;line-height:1.6;margin-bottom:8px;}
.card-q-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3);}
.card-q-badge{display:inline-block;padding:1px 8px;border-radius:4px;background:var(--surface);font-size:11px;color:var(--text2);}
.card-q-link{color:var(--accent) !important;text-decoration:none;}

/* 可见性标签（徽章） */
.card-visibility-badge{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-left:6px;
}
.card-visibility-badge.public{background:rgba(74,222,128,0.12);color:#4ade80;}
.card-visibility-badge.private{background:rgba(251,113,133,0.12);color:#fb7185;}

/* Answer */
.card-a{
  margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
}
.card-a-label{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.card-a-label-dot{width:4px;height:4px;border-radius:50%;background:var(--accent2);}
.card-a-label-text{font-size:12px;color:var(--text3);}
.card-a-text{font-size:15px;line-height:1.7;color:var(--text2);white-space:pre-wrap;word-break:break-word;}
.card-a-time{font-size:11px;color:var(--text3);margin-top:8px;}

/* Reply box */
.card-reply{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.card-reply-input{
  width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px;font-size:14px;color:var(--text);font-family:inherit;
  resize:none;min-height:72px;outline:none;display:block;
}
.card-reply-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.card-reply-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;
}
.card-reply-bar-left{display:flex;align-items:center;gap:8px;}
.card-reply-chars{font-size:12px;color:var(--text3);}
.card-reply-chars.warn{color:#f0ab63;}
.card-reply-chars.danger{color:#fb7185;}
.card-reply-send{
  background:var(--accent);color:var(--bg);border:none;
  padding:8px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .2s;
}
.card-reply-send:hover{background:var(--accent2);}
.card-reply-send:disabled{opacity:.3;pointer-events:none;}

/* 可见性选择器 */
.visibility-selector{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:2px;font-size:12px;
}
.vis-opt-btn{
  background:none;border:none;color:var(--text3);font-size:12px;font-family:inherit;
  padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.vis-opt-btn.selected{background:rgba(74,222,128,0.12);color:#4ade80;font-weight:500;}
.vis-opt-btn.selected.private-selected{background:rgba(251,113,133,0.12);color:#fb7185;}

/* Empty */
.empty{
  text-align:center;padding:48px 16px;
}
.empty-icon{font-size:40px;margin-bottom:14px;}
.empty-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.empty-desc{font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:16px;max-width:300px;margin-left:auto;margin-right:auto;}
.empty-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--text2);
  padding:10px 24px;border-radius:var(--radius-pill);font-size:14px;font-family:inherit;
  cursor:pointer;transition:all .2s;
}
.empty-btn:hover{background:var(--surface2);color:var(--text);}

/* Loader */
.loader-row{display:flex;justify-content:center;padding:20px 0;}
.loader{display:flex;gap:6px;align-items:center;}
.loader span{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent2);display:inline-block;
  animation:pulse 1.2s ease-in-out infinite;
}
.loader span:nth-child(2){animation-delay:.2s;}
.loader span:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* Overlay sheet */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.show{display:flex;}
.sheet{
  width:100%;max-width:var(--max-w);background:var(--bg-card);
  border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(24px + var(--safe-bottom));
  animation:slideUp .3s var(--ease);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{
  width:36px;height:4px;border-radius:2px;background:var(--text3);
  margin:0 auto 16px;
}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:4px;}
.sheet-desc{font-size:13px;color:var(--text3);margin-bottom:16px;}
.sheet-link-box{
  display:flex;background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:var(--radius-sm);overflow:hidden;
}
.sheet-link-text{
  flex:1;padding:12px;font-size:13px;color:var(--text2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sheet-copy-btn{
  background:var(--accent);color:var(--bg);border:none;
  padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
}
.sheet-platforms{display:flex;gap:14px;justify-content:center;margin:20px 0;}
.sheet-pf-btn{
  width:48px;height:48px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.sheet-pf-btn:hover{background:var(--surface2);border-color:var(--border-strong);}
.sheet-close{
  width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:13px;border-radius:var(--radius-pill);
  font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;
}

/* Toast */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:300;
  background:var(--surface2);color:var(--text);font-size:14px;padding:12px 22px;
  border-radius:var(--radius-pill);box-shadow:0 8px 30px rgba(0,0,0,.5);
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
  border:1px solid var(--border);
}
.toast.show{opacity:1;}
.toast.ok{background:rgba(74,222,128,.15);color:#4ade80;border-color:rgba(74,222,128,.25);}
.toast.err{background:rgba(251,113,133,.15);color:#fb7185;border-color:rgba(251,113,133,.25);}

/* Mobile */
@media(max-width:480px){
  .profile-card{padding:20px 14px 16px;}
  .profile-avatar{width:56px;height:56px;font-size:22px;}
  .quick-chips{margin-top:8px;}
}
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <button class="nav-back" id="btnBack">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </button>
  <span class="nav-title" id="navTitle">提问箱</span>
  <button class="nav-share" id="btnShareTop">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    分享
  </button>
</nav>

<div style="width:100%;max-width:var(--max-w);margin:0 auto;">

  <!-- Profile -->
  <div class="profile-card" id="profileCard">
    <div class="profile-avatar" id="profileAvatar">?</div>
    <div class="profile-name" id="profileName">我的提问箱</div>
    <div class="profile-bio" id="profileBio"></div>
    <div class="profile-actions"></div>
    <div class="profile-actions" style="margin-top:8px;">
      <button class="profile-import-btn" id="btnImportMemory" onclick="location.href='/memory.html'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></polyline></svg>
        导入记忆
      </button>
      <button class="profile-share-btn" id="btnShareProfile">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        分享提问箱
      </button>
    </div>
    <div class="profile-stats">
      <div class="profile-stat">
        <span class="profile-stat-num" id="statTotal">0</span>
        <span class="profile-stat-label">收到提问</span>
      </div>
      <div class="profile-stat">
        <span class="profile-stat-num" id="statAnswered">0</span>
        <span class="profile-stat-label">已回答</span>
      </div>
    </div>
  </div>

  <!-- Tab 切换 -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="mine">收到的提问<span class="tab-badge" id="tabBadge" style="display:none">0</span></button>
    <button class="tab-btn" data-tab="square">问答广场</button>
  </div>

  <!-- 提问区域 -->
  <div class="ask-area" id="askArea">
    <div class="ask-box">
      <textarea class="ask-input" id="askInput" placeholder="有什么想问的吗？匿名提问，温柔回应…" maxlength="500" rows="2"></textarea>
      <div class="ask-bar">
        <div class="ask-bar-l">
          <label class="anon-wrap">
            <input type="checkbox" id="anonCheck" checked>
            <span class="anon-dot"></span>匿名
          </label>
          <span class="ask-chars" id="askChars">0/500</span>
        </div>
        <button class="ask-send" id="askSend" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <div class="ask-err" id="askErr"></div>
    <div class="quick-chips" id="quickChips">
      <button class="chip" data-text="你最近最开心的一件事是什么？">最近开心的事？</button>
      <button class="chip" data-text="如果可以回到过去，你最想改变什么？">回到过去？</button>
      <button class="chip" data-text="你最想对现在的自己说什么？">对现在的自己说</button>
      <button class="chip" data-text="有没有一个念头，你一直不敢说出口？">不敢说出口的话</button>
      <button class="chip" data-text="你对未来十年有什么期待？">未来十年？</button>
    </div>
  </div>

  <!-- Feed -->
  <main class="feed">
    <div class="feed-list" id="feedList"></div>
    <div class="loader-row" id="loaderRow" style="display:none">
      <div class="loader"><span></span><span></span><span></span></div>
    </div>
  </main>
</div>

<!-- 分享弹窗 -->
<div class="overlay" id="shareOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">分享我的提问箱</div>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ── State ──
var PAGE_SIZE = 20;
var state = {
  tab: 'mine',
  page: 1,
  isLoading: false,
  hasMore: true,
  targetId: null  // 从 URL ?u= 获取
};

// ── DOM ──
var Q = function(s){return document.querySelector(s);};
var QA = function(s){return document.querySelectorAll(s);};
var dom = {
  askInput: Q('#askInput'), askChars: Q('#askChars'), askSend: Q('#askSend'), askErr: Q('#askErr'),
  anonCheck: Q('#anonCheck'), feedList: Q('#feedList'), loaderRow: Q('#loaderRow'),
  overlay: Q('#shareOverlay'), shareLink: Q('#shareLink'), toast: Q('#toast'),
  profileCard: Q('#profileCard'), profileName: Q('#profileName'), profileAvatar: Q('#profileAvatar'),
  statTotal: Q('#statTotal'), statAnswered: Q('#statAnswered'),
  tabBadge: Q('#tabBadge'), navTitle: Q('#navTitle'), askArea: Q('#askArea'),
  quickChips: Q('#quickChips')
};

// ── Init from URL ──
function initTarget() {
  var p = new URLSearchParams(location.search);
  var u = p.get('u');
  if (u) {
    state.targetId = u;
    state.isOwnerView = false;
    var n = p.get('n');
    if (n) {
      setVisitorProfile(n, u);
    } else {
      // 无 n 参数时先用占位，再异步获取真实名称
      dom.profileName.textContent = '用户 ' + u.substring(0,4) + ' 的提问箱';
      dom.profileAvatar.textContent = '?';
      dom.navTitle.textContent = '提问箱';
      dom.tabBadge.style.display = 'none';
      fetch('/api/user-card?userId=' + u)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.displayName) {
            setVisitorProfile(d.displayName, u);
          } else {
            dom.profileName.textContent = '用户 ' + u.substring(0,4) + ' 的提问箱';
          }
        })
        .catch(function(){});
    }
  } else {
    state.targetId = null;
    state.isOwnerView = false;
    dom.profileName.textContent = '我的提问箱';
    dom.profileAvatar.textContent = '?';
  }
  updateShareLink();
}

function setVisitorProfile(name, userId) {
  dom.profileName.textContent = name + ' 的提问箱';
  dom.profileAvatar.textContent = (name[0] || '?').toUpperCase();
  dom.navTitle.textContent = name + ' · 提问箱';
  dom.tabBadge.style.display = 'none';
  var visitorAvatar = document.createElement('img');
  visitorAvatar.src = '/api/avatar?userId=' + userId;
  visitorAvatar.style.cssText = 'width:100%;height:100%;border-radius:50%;object-fit:cover';
  visitorAvatar.onload = function() { dom.profileAvatar.innerHTML = ''; dom.profileAvatar.appendChild(visitorAvatar); };
}

// ── Auth integration ──
function syncWithAuth() {
  var uid = Auth.getUserId();
  var email = Auth.getEmail();

  // 访问特定提问箱（?u=xxx）：保持 visitor 模式
  if (state.targetId && !state.isOwnerView) {
    // 已经是 visitor 模式，不做修改
    return;
  }

  if (Auth.isLoggedIn()) {
    state.targetId = String(uid);
    state.isOwnerView = true;
    var displayName = Auth.getDisplayName();
    var userName = displayName || (email ? email.split('@')[0] : '我');
    dom.profileName.textContent = userName + ' 的提问箱';
    var avatarUrl = Auth.getAvatarUrl();
    if (avatarUrl) {
      dom.profileAvatar.innerHTML = '<img src="' + avatarUrl + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (userName[0] || '?').toUpperCase() + '\'">';
    } else {
      dom.profileAvatar.textContent = (userName[0] || '?').toUpperCase();
    }
    dom.navTitle.textContent = userName + ' · 提问箱';
    dom.askArea.style.opacity = '0.35';
    dom.askArea.style.pointerEvents = 'none';
  } else {
    state.targetId = null;
    state.isOwnerView = false;
    dom.profileName.textContent = '我的提问箱';
    dom.profileAvatar.textContent = '?';
    dom.askArea.style.opacity = '1';
    dom.askArea.style.pointerEvents = 'auto';
  }
  updateShareLink();
  loadFeed(true);
}

// ── Share ──
function getShareUrl() {
  if (state.targetId) {
    return location.origin + '/askbox-share?u=' + encodeURIComponent(state.targetId);
  }
  var url = new URL(location.href);
  url.search = '';
  return url.toString();
}

function updateShareLink() {
  dom.shareLink.textContent = getShareUrl();
}

// ── Toast ──
var toastTimer;
function toast(msg, type) {
  var t = dom.toast;
  t.textContent = msg;
  t.className = 'toast ' + (type || '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ── Helpers ──
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fmtTime(ts) {
  if (!ts) return '';
  var d = Date.now() - ts;
  var s = Math.floor(d / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), day = Math.floor(h / 24);
  if (s < 60) return '刚刚';
  if (m < 60) return m + '分钟前';
  if (h < 24) return h + '小时前';
  if (day < 7) return day + '天前';
  var dt = new Date(ts);
  return (dt.getFullYear() === new Date().getFullYear() ? '' : dt.getFullYear() + '年') +
    (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
}

function showLoader() { dom.loaderRow.style.display = 'flex'; }
function hideLoader() { dom.loaderRow.style.display = 'none'; }

// ── Render cards ──
function renderCard(q) {
  var answerHtml = '';
  if (q.answer_content) {
    answerHtml =
      '<div class="card-a">' +
        '<div class="card-a-label"><span class="card-a-label-dot"></span><span class="card-a-label-text">回答</span></div>' +
        '<div class="card-a-text">' + esc(q.answer_content) + '</div>' +
        '<div class="card-a-time">' + fmtTime(q.answered_at) + '</div>' +
      '</div>';
  }

  // 回答可见性标签
  var visBadge = '';
  if (q.answer_content && q.answer_visibility === 'private') {
    visBadge = '<span class="card-visibility-badge private">仅提问者可见</span>';
  } else if (q.answer_content && q.answer_visibility === 'public') {
    visBadge = '<span class="card-visibility-badge public">公开</span>';
  }

  var replyHtml = '';
  if (state.tab === 'mine' && !q.answer_content) {
    replyHtml =
      '<div class="card-reply">' +
        '<textarea class="card-reply-input" placeholder="写下你的回答..." maxlength="2000" rows="3"></textarea>' +
        '<div class="card-reply-bar">' +
          '<div class="card-reply-bar-left">' +
            '<div class="visibility-selector" data-qid="' + q.id + '">' +
              '<button class="vis-opt-btn selected" data-vis="public">公开</button>' +
              '<button class="vis-opt-btn" data-vis="private">仅提问者</button>' +
            '</div>' +
            '<span class="card-reply-chars">0/2000</span>' +
          '</div>' +
          '<button class="card-reply-send" data-qid="' + q.id + '">回复</button>' +
        '</div>' +
      '</div>';
  }
  return '<article class="card">' +
    '<div class="card-q">' +
      '<div class="card-q-avatar">' + (q.is_anonymous ? '?' : (q.asker_avatar ? '<img src="' + q.asker_avatar + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.remove();this.parentElement.textContent=unescape">' : (q.asker_name ? q.asker_name[0].toUpperCase() : '?'))) + '</div>' +
      '<div class="card-q-body">' +
        '<div class="card-q-text">' + esc(q.content) + visBadge + '</div>' +
        '<div class="card-q-meta">' +
          (q.is_anonymous ? '<span class="card-q-badge">匿名</span>' : '<a class="card-q-badge card-q-link" href="user.html?userId=' + esc(q.asker_id||'') + '">' + esc(q.asker_name||'用户') + '</a>') +
          '<span>' + fmtTime(q.created_at) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' + answerHtml + replyHtml +
  '</article>';
}

function renderEmpty(icon, title, desc, btnText) {
  var btn = btnText ? '<button class="empty-btn" id="emptyBtn">' + btnText + '</button>' : '';
  return '<div class="empty">' +
    '<div class="empty-icon">' + icon + '</div>' +
    '<div class="empty-title">' + title + '</div>' +
    '<div class="empty-desc">' + desc + '</div>' + btn +
  '</div>';
}

// ── Load feed ──
async function loadFeed(reset) {
  if (state.isLoading) return;

  // 未登录时访问「我的提问箱」tab：显示登录引导
  if (state.tab === 'mine' && !Auth.isLoggedIn() && !state.targetId) {
    dom.feedList.innerHTML = renderEmpty('🔐', '需要登录', '登录后即可查看和管理你的提问箱', '立即登录');
    setTimeout(function() {
      var btn = document.getElementById('emptyBtn');
      if (btn) btn.addEventListener('click', function() { Auth.showLoginModal(); });
    }, 50);
    dom.statTotal.textContent = '—';
    dom.statAnswered.textContent = '—';
    dom.tabBadge.style.display = 'none';
    return;
  }

  if (reset) { state.page = 1; state.hasMore = true; dom.feedList.innerHTML = ''; }

  state.isLoading = true;
  showLoader();
  dom.feedList.classList.add('loading');

  try {
    var url = '/askbox?page=' + state.page;
    if (state.tab === 'mine' && state.targetId) {
      url += '&targetId=' + encodeURIComponent(state.targetId);
    }
    // 广场模式不带 targetId，后端只返回已回答

    var r = await fetch(url, { headers: { 'Accept': 'application/json; charset=utf-8' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    var qs = d.questions || [];
    var pag = d.pagination || {};

    if (state.page === 1) dom.feedList.innerHTML = '';

    if (qs.length === 0 && state.page === 1) {
      if (state.tab === 'mine') {
        dom.feedList.innerHTML = renderEmpty('📬', '还没有收到提问', '分享你的提问箱链接，让朋友们来匿名提问吧', '分享提问箱');
        // bind empty button
        setTimeout(function() {
          var btn = Q('#emptyBtn');
          if (btn) btn.addEventListener('click', openShare);
        }, 50);
      } else {
        dom.feedList.innerHTML = renderEmpty('🌌', '广场暂无内容', '还没有公开的问答，成为第一个提问的人吧');
      }
    } else {
      var html = qs.map(renderCard).join('');
      if (state.page === 1) {
        dom.feedList.innerHTML = html;
      } else {
        dom.feedList.insertAdjacentHTML('beforeend', html);
      }
    }

    state.hasMore = pag.page < Math.ceil(pag.total / PAGE_SIZE);

    // 更新统计数据（仅 mine tab）
    if (state.tab === 'mine' && state.page === 1) {
      dom.statTotal.textContent = pag.total || qs.length;
      var answered = qs.filter(function(q) { return !!q.answered_at; }).length;
      dom.statAnswered.textContent = answered;
    }

    // 更新 tab badge（仅 mine tab，未回答数量）
    if (state.tab === 'mine' && state.page === 1) {
      var unanswered = qs.filter(function(q) { return !q.answered_at; }).length;
      if (unanswered > 0) {
        dom.tabBadge.style.display = 'inline-block';
        dom.tabBadge.textContent = unanswered;
      } else {
        dom.tabBadge.style.display = 'none';
      }
    }
  } catch (e) {
    console.error(e);
    if (state.page === 1) {
      dom.feedList.innerHTML = renderEmpty('😿', '加载失败', '网络似乎出了问题，请稍后重试');
    }
    toast('加载失败', 'err');
  } finally {
    state.isLoading = false;
    hideLoader();
    dom.feedList.classList.remove('loading');
  }
}

// ── Submit question ──
async function submitQuestion() {
  var content = dom.askInput.value.trim();
  if (!content) { showErr('请输入问题'); dom.askInput.focus(); return; }
  if (content.length > 500) { showErr('问题不能超过500字'); return; }

  dom.askSend.disabled = true;
  clearErr();

  try {
    // 确定 targetId：优先 URL 参数，其次当前登录用户（但自己不能问自己）
    var tid = state.targetId;
    if (state.isOwnerView) {
      // 拥有者不能问自己，但理论上已被 UI 拦截
      tid = null;
    }
    var body = {
      content: content,
      isAnonymous: dom.anonCheck.checked ? 1 : 0,
      targetId: tid || null
    };
    var r = await fetch('/askbox', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.message || errData.error || '提交失败');
    }
    dom.askInput.value = '';
    updateCharCount();
    toast('提问成功，等待回答 ✨', 'ok');

    // 刷新列表
    await loadFeed(true);

    // 如果是在别人提问箱，回到 mine tab
    if (state.targetId && state.tab !== 'mine') {
      switchTab('mine');
    }
  } catch (e) {
    showErr(e.message || '提交失败，请稍后重试');
  } finally {
    dom.askSend.disabled = false;
  }
}

// ── Submit answer ──
async function submitAnswer(qId, btnEl, inputEl, visibility) {
  var content = inputEl.value.trim();
  if (!content) { toast('请输入回复内容', 'err'); inputEl.focus(); return; }
  if (content.length > 2000) { toast('回复不能超过2000字', 'err'); return; }

  btnEl.disabled = true;

  try {
    var r = await fetch('/askbox/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ questionId: qId, answerContent: content, answerVisibility: visibility || 'public' })
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.message || errData.error || '回复失败');
    }
    toast('已回复', 'ok');
    await loadFeed(true);
  } catch (e) {
    toast(e.message || '回复失败', 'err');
  } finally {
    btnEl.disabled = false;
  }
}

// ── Error ──
function showErr(msg) { dom.askErr.textContent = msg; dom.askErr.classList.add('show'); }
function clearErr() { dom.askErr.textContent = ''; dom.askErr.classList.remove('show'); }

// ── Char count ──
function updateCharCount() {
  var l = dom.askInput.value.length;
  dom.askChars.textContent = l + '/500';
  dom.askChars.className = 'ask-chars' + (l > 480 ? ' danger' : l > 400 ? ' warn' : '');
}

// ── Tab switch ──
function switchTab(tab) {
  // 未登录且无 ?u= 时，mine tab 被拦截显示登录引导
  if (tab === 'mine' && !Auth.isLoggedIn() && !state.targetId) {
    Auth.showLoginModal();
    return;
  }
  if (state.tab === tab) return;
  state.tab = tab;
  QA('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'square') {
    dom.tabBadge.style.display = 'none';
  }
  loadFeed(true);
}

// ── Share overlay ──
function openShare() {
  if (!Auth.isLoggedIn()) {
    Auth.showLoginModal();
    return;
  }
  updateShareLink();
  dom.overlay.classList.add('show');
}

function closeShare() {
  dom.overlay.classList.remove('show');
}

async function copyShareLink() {
  try {
    await navigator.clipboard.writeText(getShareUrl());
    toast('链接已复制', 'ok');
  } catch (e) {
    // fallback
    var ta = document.createElement('textarea');
    ta.value = getShareUrl();
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('链接已复制', 'ok');
  }
}

function shareTo(platform) {
  var url = getShareUrl();
  var title = '我的提问箱 - 有什么想问的吗？';
  var text = '有什么想问的吗？匿名提问，温柔回应…';

  switch (platform) {
    case 'wechat':
      copyShareLink().then(function() {
        setTimeout(function() {
          toast('链接已复制，打开微信粘贴发送', 'ok');
        }, 300);
      });
      break;
    case 'qq':
      window.open('https://connect.qq.com/widget/shareqq/index.html?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(title) + '&desc=' + encodeURIComponent(text), '_blank', 'width=600,height=400');
      break;
    case 'weibo':
      window.open('https://service.weibo.com/share/share.php?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(title + ' ' + text), '_blank', 'width=600,height=400');
      break;
    case 'link':
      copyShareLink();
      break;
  }
  closeShare();
}

// ── Event bindings ──
dom.askInput.addEventListener('input', function() {
  updateCharCount();
  clearErr();
});

dom.askSend.addEventListener('click', submitQuestion);

dom.askInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitQuestion();
  }
  if (e.key === 'Escape') {
    dom.askInput.blur();
  }
});

// 快捷提问
dom.quickChips.addEventListener('click', function(e) {
  var chip = e.target.closest('.chip');
  if (!chip) return;
  dom.askInput.value = chip.dataset.text;
  updateCharCount();
  clearErr();
  dom.askInput.focus();
  dom.askInput.setSelectionRange(dom.askInput.value.length, dom.askInput.value.length);
});

// Tab
QA('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    switchTab(btn.dataset.tab);
  });
});

// Share buttons
Q('#btnShareTop').addEventListener('click', openShare);
Q('#btnShareProfile').addEventListener('click', openShare);
Q('#btnCloseSheet').addEventListener('click', closeShare);
Q('#btnCopyLink').addEventListener('click', copyShareLink);

// Overlay backdrop
dom.overlay.addEventListener('click', function(e) {
  if (e.target === dom.overlay) closeShare();
});

// Platform share buttons
QA('.sheet-pf-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    shareTo(btn.dataset.pf);
  });
});

// 可见性选择器切换
dom.feedList.addEventListener('click', function(e) {
  var visBtn = e.target.closest('.vis-opt-btn');
  if (visBtn) {
    var selector = visBtn.closest('.visibility-selector');
    if (!selector) return;
    selector.querySelectorAll('.vis-opt-btn').forEach(function(b) {
      b.classList.remove('selected', 'private-selected');
    });
    visBtn.classList.add('selected');
    if (visBtn.dataset.vis === 'private') {
      visBtn.classList.add('private-selected');
    }
    return;
  }

  var btn = e.target.closest('.card-reply-send');
  if (!btn) return;
  var card = btn.closest('.card');
  var input = card.querySelector('.card-reply-input');
  var qId = btn.dataset.qid;
  // 获取可见性
  var selector = card.querySelector('.visibility-selector');
  var vis = 'public';
  if (selector) {
    var selectedVis = selector.querySelector('.vis-opt-btn.selected');
    if (selectedVis) {
      vis = selectedVis.dataset.vis || 'public';
    }
  }
  submitAnswer(qId, btn, input, vis);
});

dom.feedList.addEventListener('input', function(e) {
  var input = e.target.closest('.card-reply-input');
  if (!input) return;
  var card = input.closest('.card');
  var chars = card.querySelector('.card-reply-chars');
  if (chars) {
    var l = input.value.length;
    chars.textContent = l + '/2000';
    chars.className = 'card-reply-chars' + (l > 1900 ? ' danger' : l > 1600 ? ' warn' : '');
  }
});

dom.feedList.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' || e.shiftKey) return;
  var input = e.target.closest('.card-reply-input');
  if (!input) return;
  e.preventDefault();
  var card = input.closest('.card');
  var btn = card.querySelector('.card-reply-send');
  if (btn && !btn.disabled) btn.click();
});

// Infinite scroll
var scrollLock = false;
window.addEventListener('scroll', function() {
  if (scrollLock) return;
  scrollLock = true;
  requestAnimationFrame(function() {
    scrollLock = false;
    if (state.isLoading || !state.hasMore) return;
    var scrolled = window.innerHeight + window.scrollY;
    var threshold = document.documentElement.scrollHeight - 400;
    if (scrolled >= threshold) {
      state.page++;
      loadFeed(false);
    }
  });
}, { passive: true });

// ── Init ──
function init() {
  initTarget();
  updateCharCount();

  // 访问别人提问箱（?u=xxx），直接加载，不受登录状态影响
  if (state.targetId && !state.isOwnerView) {
    loadFeed(true);
  } else {
    // 等待 auth.js 初始化完成再同步
    if (Auth.isLoggedIn()) {
      syncWithAuth();
    } else {
      loadFeed(true);
    }
  }

  // 监听登录状态变化
  Auth.onAuthChange(function(user) {
    // 如果已经在访问别人的提问箱，不切换
    var p = new URLSearchParams(location.search);
    if (p.get('u')) return;

    if (user) {
      syncWithAuth();
    } else {
      state.targetId = null;
      state.isOwnerView = false;
      dom.profileName.textContent = '我的提问箱';
      dom.profileAvatar.textContent = '?';
      dom.askArea.style.opacity = '1';
      dom.askArea.style.pointerEvents = 'auto';
      if (state.tab === 'mine') {
        state.tab = 'square';
        QA('.tab-btn').forEach(function(b) {
          b.classList.toggle('active', b.dataset.tab === 'square');
        });
      }
      loadFeed(true);
    }
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

fetch('/api/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'qa'})}).catch(function(){});
})();
</script>
