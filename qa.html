<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>心镜 · 社交 - 轻匿提问箱</title>
<meta name="description" content="匿名提问，温柔回应。创建你的专属提问箱，收集真实想法。">
<meta property="og:title" content="心镜 · 轻匿提问箱">
<meta property="og:description" content="有什么想问的吗？匿名提问，温柔回应…">
<script src="/auth.js"></script>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
           'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
  --bg: #000000;
  --bg-card: #0A0A0C;
  --surface: #111114;
  --surface2: #18181C;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.10);
  --text: rgba(255,255,255,0.94);
  --text2: rgba(255,255,255,0.55);
  --text3: rgba(255,255,255,0.32);
  --accent: #FF3B5C;
  --accent2: #C4293F;
  --accent-glow: rgba(255,59,92,0.14);
  --accent-soft: rgba(255,59,92,0.08);
  --blue: #3B82F6;
  --blue-soft: rgba(59,130,246,0.08);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 100px;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
  --max-w: 640px;
  --ease: cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  scroll-behavior:smooth;
}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -15%, rgba(255,59,92,0.04), transparent),
    radial-gradient(ellipse 600px 400px at 100% 100%, rgba(59,130,246,0.03), transparent);
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:calc(80px + var(--safe-bottom));
}
::selection{background:var(--accent);color:#fff}
.app{width:100%;max-width:var(--max-w);padding:0 20px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

/* ── 导航 ── */
.nav{position:sticky;top:0;z-index:50;padding:16px 0 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(var(--bg) 80%,transparent)}
.nav-l{display:flex;align-items:center;gap:10px}
.nav-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent-glow);animation:blink 2.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.nav-title{font-size:18px;font-weight:700;letter-spacing:-.3px;cursor:pointer;line-height:1.2}
.nav-title:hover{opacity:.8}
.nav-sub{font-size:11px;color:var(--text3);font-weight:400;line-height:1}
.nav-r{display:flex;align-items:center;gap:6px}
.nav-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease);font-size:15px}
.nav-btn:hover{border-color:var(--border-strong);color:var(--text)}
.nav-btn:active{transform:scale(.92);background:var(--surface)}

/* ── 个人提问箱卡片 ── */
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.profile-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:var(--accent-soft);filter:blur(30px);pointer-events:none}
.profile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative;z-index:1}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#e11d48);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;font-weight:600}
.profile-name{font-size:18px;font-weight:700;color:var(--text)}
.profile-sub{font-size:12px;color:var(--text3);margin-top:2px}
.profile-stats{display:flex;gap:20px;margin-top:12px;position:relative;z-index:1}
.profile-stat{display:flex;flex-direction:column}
.profile-stat-num{font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.profile-stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.profile-share-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius-pill);background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .25s var(--ease);position:relative;z-index:1}
.profile-share-btn:hover{background:var(--accent2);box-shadow:0 6px 20px var(--accent-glow)}
.profile-share-btn:active{transform:scale(.94)}
.profile-share-btn svg{width:14px;height:14px}

/* ── Tab ── */
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:12px 0;font-size:14px;font-weight:600;color:var(--text3);border:none;background:none;cursor:pointer;font-family:var(--font);position:relative;transition:color .25s var(--ease);text-align:center}
.tab-btn.active{color:var(--text)}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:28px;height:2.5px;border-radius:2px;background:var(--accent)}
.tab-btn:hover{color:var(--text2)}
.tab-badge{display:inline-block;margin-left:5px;padding:1px 7px;border-radius:var(--radius-pill);background:var(--accent);color:#fff;font-size:10px;font-weight:700;vertical-align:middle;min-width:18px;text-align:center}

/* ── 提问区域 ── */
.ask-area{margin-bottom:16px}
.ask-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:5px;transition:all .3s var(--ease)}
.ask-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ask-input{width:100%;min-height:78px;background:transparent;border:none;color:var(--text);font-size:15px;line-height:1.7;resize:none;padding:12px 14px 6px;font-family:var(--font);outline:none}
.ask-input::placeholder{color:var(--text3)}
.ask-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 6px}
.ask-bar-l{display:flex;align-items:center;gap:10px}
.ask-chars{font-size:11px;color:var(--text3);transition:color .2s;font-variant-numeric:tabular-nums}
.ask-chars.warn{color:#f59e0b}.ask-chars.danger{color:#f87171}
.anon-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);cursor:pointer;user-select:none;-webkit-user-select:none}
.anon-wrap input{display:none}
.anon-dot{width:15px;height:15px;border-radius:50%;border:1px solid var(--border-strong);transition:all .25s var(--ease);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.anon-dot::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .25s cubic-bezier(.175,.885,.32,1.275)}
.anon-wrap input:checked+.anon-dot{border-color:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.anon-wrap input:checked+.anon-dot::after{transform:scale(1)}
.ask-send{width:30px;height:30px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease);flex-shrink:0}
.ask-send:hover{background:var(--accent2);box-shadow:0 4px 14px var(--accent-glow)}
.ask-send:active{transform:scale(.88)}
.ask-send:disabled{opacity:.3;pointer-events:none}
.ask-send svg{width:13px;height:13px}
.ask-err{font-size:11px;color:#f87171;padding:0 14px;max-height:0;overflow:hidden;transition:max-height .3s}
.ask-err.show{max-height:22px;margin-top:5px}

/* ── 快捷提问 ── */
.quick-chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:2px 0}
.quick-chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:var(--radius-pill);font-size:12px;border:1px solid var(--border);background:var(--bg-card);color:var(--text2);cursor:pointer;transition:all .2s var(--ease);font-family:var(--font);white-space:nowrap;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.chip:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface)}
.chip:active{transform:scale(.94);background:var(--accent-soft);border-color:var(--accent)}

/* ── Feed ── */
.feed{padding-bottom:20px}
.feed-list{display:flex;flex-direction:column;gap:10px;transition:opacity .25s}
.feed-list.loading{opacity:.45;pointer-events:none}

/* ── 问答卡片 ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:cardIn .45s var(--ease) backwards}
.card:nth-child(1){animation-delay:0s}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}}
.card-q{padding:17px 18px 12px;display:flex;gap:11px}
.card-q-avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.03);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:var(--text3)}
.card-q-body{flex:1;min-width:0}
.card-q-text{font-size:14px;line-height:1.65;color:rgba(255,255,255,.82);white-space:pre-wrap;word-break:break-word}
.card-q-meta{margin-top:7px;font-size:10px;color:var(--text3);display:flex;align-items:center;gap:8px}
.card-q-badge{padding:1px 7px;border-radius:var(--radius-pill);background:rgba(255,255,255,.04);font-size:10px;color:var(--text3)}
.card-a{margin:0 0 0 12px;padding:0 18px 16px;border-left:1.5px solid var(--border)}
.card-a-label{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.card-a-label-dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.card-a-label-text{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.card-a-text{font-size:14px;line-height:1.7;color:rgba(255,255,255,.72);white-space:pre-wrap;word-break:break-word}
.card-a-time{font-size:10px;color:var(--text3);margin-top:7px}

/* ── 空状态 ── */
.empty{padding:50px 20px;text-align:center;color:var(--text3);animation:cardIn .35s var(--ease)}
.empty-icon{font-size:44px;margin-bottom:12px;opacity:.3}
.empty-title{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:4px}
.empty-desc{font-size:12px;line-height:1.6;max-width:260px;margin:0 auto}
.empty-btn{display:inline-block;margin-top:14px;padding:9px 22px;border-radius:var(--radius-pill);background:var(--accent);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:var(--font);transition:all .2s var(--ease)}
.empty-btn:hover{background:var(--accent2);box-shadow:0 6px 18px var(--accent-glow)}
.empty-btn:active{transform:scale(.94)}

/* ── 加载 ── */
.loader-row{display:flex;justify-content:center;padding:28px}
.loader{display:flex;gap:4px}
.loader span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:ld .6s infinite alternate}
.loader span:nth-child(2){animation-delay:.15s}.loader span:nth-child(3){animation-delay:.3s}
@keyframes ld{to{transform:translateY(-9px);opacity:.2}}

/* ── 分享弹窗 ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:var(--max-w);background:var(--surface2);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + var(--safe-bottom));transform:translateY(100%);transition:transform .35s var(--ease)}
.overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 20px}
.sheet-title{font-size:16px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px}
.sheet-desc{font-size:12px;color:var(--text3);text-align:center;margin-bottom:18px}
.sheet-link-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px}
.sheet-link-text{flex:1;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:monospace}
.sheet-copy-btn{flex-shrink:0;padding:6px 14px;border-radius:var(--radius-pill);background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.sheet-copy-btn:active{transform:scale(.94)}
.sheet-platforms{display:flex;gap:10px;justify-content:center}
.sheet-pf-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease);font-size:22px}
.sheet-pf-btn:hover{border-color:var(--border-strong);background:var(--surface2)}
.sheet-pf-btn:active{transform:scale(.9)}
.sheet-close{margin-top:16px;width:100%;padding:12px;border-radius:var(--radius-pill);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font)}
.sheet-close:active{background:var(--surface)}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface2);color:var(--text);padding:11px 22px;border-radius:var(--radius-pill);font-size:12px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.175,.885,.32,1.275);border:1px solid var(--border-strong);box-shadow:0 8px 28px rgba(0,0,0,.5);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:#4ade80;color:#4ade80}
.toast.err{border-color:#f87171;color:#f87171}

/* ── 响应式 ── */
@media(max-width:380px){
  .card-q{padding:14px 14px 10px}.card-a{padding:0 14px 14px;margin-left:8px}
  .profile-card{padding:16px}.profile-avatar{width:38px;height:38px;font-size:16px}
}
@media(min-width:641px){
  .app{padding:0 0}
}
.nav-home-link{font-size:13px;color:var(--text-tertiary);text-decoration:none;display:inline-flex;align-items:center;gap:2px;transition:color .2s}.nav-home-link:hover{color:var(--accent)}</style>
</head>
<body>
<div class="app">
  <!-- 导航 -->
  <nav class="nav">
    <div class="nav-l">
      <div class="nav-dot"></div>
      <div>
        <a href="/" class="nav-home-link">← 首页</a><div class="nav-title" id="navTitle">轻匿提问箱</div>
        <div class="nav-sub">轻匿提问箱</div>
      </div>
    </div>
    <div class="nav-r">
      <button class="nav-btn" id="btnShareTop" aria-label="分享提问箱" title="分享提问箱">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <button class="auth-login-btn">登录</button>
    </div>
  </nav>

  <!-- 个人提问箱卡片 -->
  <div class="profile-card" id="profileCard">
    <div class="profile-top">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div>
          <div class="profile-name" id="profileName">我的提问箱</div>
          <div class="profile-sub">有什么想问的？</div>
        </div>
      </div>
      <button class="profile-share-btn" id="btnShareProfile">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        分享提问箱
      </button>
    </div>
    <div class="profile-stats">
      <div class="profile-stat">
        <span class="profile-stat-num" id="statTotal">0</span>
        <span class="profile-stat-label">收到提问</span>
      </div>
      <div class="profile-stat">
        <span class="profile-stat-num" id="statAnswered">0</span>
        <span class="profile-stat-label">已回答</span>
      </div>
    </div>
  </div>

  <!-- Tab 切换 -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="mine">收到的提问<span class="tab-badge" id="tabBadge" style="display:none">0</span></button>
    <button class="tab-btn" data-tab="square">问答广场</button>
  </div>

  <!-- 提问区域 -->
  <div class="ask-area" id="askArea">
    <div class="ask-box">
      <textarea class="ask-input" id="askInput" placeholder="有什么想问的吗？匿名提问，温柔回应…" maxlength="500" rows="2"></textarea>
      <div class="ask-bar">
        <div class="ask-bar-l">
          <label class="anon-wrap">
            <input type="checkbox" id="anonCheck" checked>
            <span class="anon-dot"></span>匿名
          </label>
          <span class="ask-chars" id="askChars">0/500</span>
        </div>
        <button class="ask-send" id="askSend" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <div class="ask-err" id="askErr"></div>
    <div class="quick-chips" id="quickChips">
      <button class="chip" data-text="你最近最开心的一件事是什么？">最近开心的事？</button>
      <button class="chip" data-text="如果可以回到过去，你最想改变什么？">回到过去？</button>
      <button class="chip" data-text="你最想对现在的自己说什么？">对现在的自己说</button>
      <button class="chip" data-text="有没有一个念头，你一直不敢说出口？">不敢说出口的话</button>
      <button class="chip" data-text="你对未来十年有什么期待？">未来十年？</button>
    </div>
  </div>

  <!-- Feed -->
  <main class="feed">
    <div class="feed-list" id="feedList"></div>
    <div class="loader-row" id="loaderRow" style="display:none">
      <div class="loader"><span></span><span></span><span></span></div>
    </div>
  </main>
</div>

<!-- 分享弹窗 -->
<div class="overlay" id="shareOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">分享我的提问箱</div>
    <div class="sheet-desc">分享链接给朋友，收集匿名提问</div>
    <div class="sheet-link-box">
      <span class="sheet-link-text" id="shareLink">—</span>
      <button class="sheet-copy-btn" id="btnCopyLink">复制</button>
    </div>
    <div class="sheet-platforms">
      <button class="sheet-pf-btn" data-pf="wechat" title="微信">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#07C160"><path d="M8.69 3.46C4.71 3.46 1.46 6.15 1.46 9.43c0 1.86.98 3.54 2.5 4.63l-.63 1.88 2.18-1.09c.76.22 1.55.34 2.36.34.22 0 .44 0 .66-.03-.16-.39-.26-.8-.26-1.23 0-2.94 2.8-5.33 6.23-5.33.16 0 .33 0 .5.02-.2-3.11-3.36-5.56-7.31-5.56zm1.08 4.37c.5 0 .91.37.91.82 0 .45-.41.82-.91.82s-.91-.37-.91-.82c0-.45.41-.82.91-.82zm-3.62 0c.5 0 .91.37.91.82 0 .45-.41.82-.91.82s-.91-.37-.91-.82c0-.45.41-.82.91-.82z"/><path d="M17.33 10.8c-3.34 0-6.06 2.38-6.06 5.33s2.72 5.33 6.06 5.33c.73 0 1.44-.12 2.12-.33l1.96.98-.57-1.7c1.31-1.08 2.08-2.59 2.08-4.28 0-2.94-2.72-5.33-6.06-5.33h.47-.47zm-2.42 4.15c.43 0 .78.32.78.72 0 .4-.35.72-.78.72-.44 0-.79-.32-.79-.72 0-.4.35-.72.79-.72zm4.84 0c.43 0 .78.32.78.72 0 .4-.35.72-.78.72-.44 0-.79-.32-.79-.72 0-.4.35-.72.79-.72z"/></svg>
      </button>
      <button class="sheet-pf-btn" data-pf="qq" title="QQ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#12B7F5"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.656 9.128 8.438 9.878.146.03.26-.05.26-.194v-1.507c0-.742-.233-1.284-.508-1.542-1.662-.183-3.412-.8-3.412-3.554 0-.787.28-1.43.74-1.935-.075-.185-.32-1.04.07-2.168 0 0 .654-.21 2.143.8.622-.173 1.289-.26 1.952-.263.662.003 1.33.09 1.953.264 1.488-1.01 2.142-.8 2.142-.8.39 1.127.145 1.983.07 2.168.46.506.74 1.148.74 1.935 0 2.754-1.75 3.371-3.412 3.554-.212.199-.416.532-.472 1.01-.04.338-.02.807-.02 1.235v1.545c0 .148.114.223.263.192C18.347 21.123 22 16.988 22 12c0-5.523-4.477-10-10-10z"/></svg>
      </button>
      <button class="sheet-pf-btn" data-pf="weibo" title="微博">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#E6162D"><path d="M10.098 17.323c-3.977.583-7.268-1.033-7.35-3.61-.084-2.578 3.12-5.141 7.098-5.724 3.978-.583 7.269 1.033 7.352 3.61.082 2.577-3.12 5.142-7.1 5.724z"/><path d="M20.113 13.503c-.164.356-.571.553-.938.455-.367-.098-.49-.488-.327-.844.467-1.02.55-2.2.248-3.323-.504-1.877-1.972-3.453-4.129-4.44-.392-.18-.528-.67-.348-1.062.18-.392.67-.528 1.062-.348 2.555 1.17 4.3 3.087 4.92 5.398.367 1.36.298 2.75-.488 4.164z"/></svg>
      </button>
      <button class="sheet-pf-btn" data-pf="link" title="复制链接">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
    </div>
    <button class="sheet-close" id="btnCloseSheet">取消</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ── State ──
var PAGE_SIZE = 20;
var state = {
  tab: 'mine',
  page: 1,
  isLoading: false,
  hasMore: true,
  targetId: null  // 从 URL ?u= 获取
};

// ── DOM ──
var Q = function(s){return document.querySelector(s);};
var QA = function(s){return document.querySelectorAll(s);};
var dom = {
  askInput: Q('#askInput'), askChars: Q('#askChars'), askSend: Q('#askSend'), askErr: Q('#askErr'),
  anonCheck: Q('#anonCheck'), feedList: Q('#feedList'), loaderRow: Q('#loaderRow'),
  overlay: Q('#shareOverlay'), shareLink: Q('#shareLink'), toast: Q('#toast'),
  profileCard: Q('#profileCard'), profileName: Q('#profileName'), profileAvatar: Q('#profileAvatar'),
  statTotal: Q('#statTotal'), statAnswered: Q('#statAnswered'),
  tabBadge: Q('#tabBadge'), navTitle: Q('#navTitle'), askArea: Q('#askArea'),
  quickChips: Q('#quickChips')
};

// ── Init from URL ──
function initTarget() {
  var p = new URLSearchParams(location.search);
  var u = p.get('u');
  if (u) {
    state.targetId = u;
    state.isOwnerView = false; // visiting someone else
    var name = p.get('n') || ('用户' + u.substring(0,4));
    dom.profileName.textContent = name + ' 的提问箱';
    dom.profileAvatar.textContent = (name[0] || '?').toUpperCase();
    dom.navTitle.textContent = name + ' · 轻匿提问箱';
    // 访问别人提问箱：默认切到 mine（实际上是 TA 的提问箱），隐藏 badge
    dom.tabBadge.style.display = 'none';
  } else {
    state.targetId = null;
    state.isOwnerView = false;
    dom.profileName.textContent = '我的提问箱';
    dom.profileAvatar.textContent = '?';
  }
  updateShareLink();
}

// ── Auth integration ──
function syncWithAuth() {
  var uid = Auth.getUserId();
  var email = Auth.getEmail();

  // 访问特定提问箱（?u=xxx）：保持 visitor 模式
  if (state.targetId && !state.isOwnerView) {
    // 已经是 visitor 模式，不做修改
    return;
  }

  if (Auth.isLoggedIn()) {
    state.targetId = String(uid);
    state.isOwnerView = true;
    dom.profileName.textContent = (email ? email.split('@')[0] : '我') + ' 的提问箱';
    dom.profileAvatar.textContent = email ? email[0].toUpperCase() : '?';
    dom.navTitle.textContent = '我的 · 轻匿提问箱';
    dom.askArea.style.opacity = '0.35';
    dom.askArea.style.pointerEvents = 'none'; // 不能自己问自己
  } else {
    state.targetId = null;
    state.isOwnerView = false;
    dom.profileName.textContent = '我的提问箱';
    dom.profileAvatar.textContent = '?';
    dom.askArea.style.opacity = '1';
    dom.askArea.style.pointerEvents = 'auto';
  }
  updateShareLink();
  loadFeed(true);
}

// ── Share ──
function getShareUrl() {
  var url = new URL(location.href);
  url.search = '';
  if (state.targetId) url.searchParams.set('u', state.targetId);
  return url.toString();
}

function updateShareLink() {
  dom.shareLink.textContent = getShareUrl();
}

// ── Toast ──
var toastTimer;
function toast(msg, type) {
  var t = dom.toast;
  t.textContent = msg;
  t.className = 'toast ' + (type || '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ── Helpers ──
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fmtTime(ts) {
  if (!ts) return '';
  var d = Date.now() - ts;
  var s = Math.floor(d / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), day = Math.floor(h / 24);
  if (s < 60) return '刚刚';
  if (m < 60) return m + '分钟前';
  if (h < 24) return h + '小时前';
  if (day < 7) return day + '天前';
  var dt = new Date(ts);
  return (dt.getFullYear() === new Date().getFullYear() ? '' : dt.getFullYear() + '年') +
    (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
}

function showLoader() { dom.loaderRow.style.display = 'flex'; }
function hideLoader() { dom.loaderRow.style.display = 'none'; }

// ── Render cards ──
function renderCard(q) {
  var answerHtml = '';
  if (q.answer_content) {
    answerHtml =
      '<div class="card-a">' +
        '<div class="card-a-label"><span class="card-a-label-dot"></span><span class="card-a-label-text">回答</span></div>' +
        '<div class="card-a-text">' + esc(q.answer_content) + '</div>' +
        '<div class="card-a-time">' + fmtTime(q.answered_at) + '</div>' +
      '</div>';
  }
  return '<article class="card">' +
    '<div class="card-q">' +
      '<div class="card-q-avatar">?</div>' +
      '<div class="card-q-body">' +
        '<div class="card-q-text">' + esc(q.content) + '</div>' +
        '<div class="card-q-meta">' +
          '<span class="card-q-badge">' + (q.is_anonymous ? '匿名' : '实名') + '</span>' +
          '<span>' + fmtTime(q.created_at) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' + answerHtml +
  '</article>';
}

function renderEmpty(icon, title, desc, btnText) {
  var btn = btnText ? '<button class="empty-btn" id="emptyBtn">' + btnText + '</button>' : '';
  return '<div class="empty">' +
    '<div class="empty-icon">' + icon + '</div>' +
    '<div class="empty-title">' + title + '</div>' +
    '<div class="empty-desc">' + desc + '</div>' + btn +
  '</div>';
}

// ── Load feed ──
async function loadFeed(reset) {
  if (state.isLoading) return;

  // 未登录时访问「我的提问箱」tab：显示登录引导
  if (state.tab === 'mine' && !Auth.isLoggedIn() && !state.targetId) {
    dom.feedList.innerHTML = renderEmpty('🔐', '需要登录', '登录后即可查看和管理你的提问箱', '立即登录');
    setTimeout(function() {
      var btn = document.getElementById('emptyBtn');
      if (btn) btn.addEventListener('click', function() { Auth.showLoginModal(); });
    }, 50);
    dom.statTotal.textContent = '—';
    dom.statAnswered.textContent = '—';
    dom.tabBadge.style.display = 'none';
    return;
  }

  if (reset) { state.page = 1; state.hasMore = true; dom.feedList.innerHTML = ''; }

  state.isLoading = true;
  showLoader();
  dom.feedList.classList.add('loading');

  try {
    var url = '/askbox?page=' + state.page;
    if (state.tab === 'mine' && state.targetId) {
      url += '&targetId=' + encodeURIComponent(state.targetId);
    }
    // 广场模式不带 targetId，后端只返回已回答

    var r = await fetch(url, { headers: { 'Accept': 'application/json; charset=utf-8' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    var qs = d.questions || [];
    var pag = d.pagination || {};

    if (state.page === 1) dom.feedList.innerHTML = '';

    if (qs.length === 0 && state.page === 1) {
      if (state.tab === 'mine') {
        dom.feedList.innerHTML = renderEmpty('📬', '还没有收到提问', '分享你的提问箱链接，让朋友们来匿名提问吧', '分享提问箱');
        // bind empty button
        setTimeout(function() {
          var btn = Q('#emptyBtn');
          if (btn) btn.addEventListener('click', openShare);
        }, 50);
      } else {
        dom.feedList.innerHTML = renderEmpty('🌌', '广场暂无内容', '还没有公开的问答，成为第一个提问的人吧');
      }
    } else {
      var html = qs.map(renderCard).join('');
      if (state.page === 1) {
        dom.feedList.innerHTML = html;
      } else {
        dom.feedList.insertAdjacentHTML('beforeend', html);
      }
    }

    state.hasMore = pag.page < Math.ceil(pag.total / PAGE_SIZE);

    // 更新统计数据（仅 mine tab）
    if (state.tab === 'mine' && state.page === 1) {
      dom.statTotal.textContent = pag.total || qs.length;
      var answered = qs.filter(function(q) { return !!q.answered_at; }).length;
      dom.statAnswered.textContent = answered;
    }

    // 更新 tab badge（仅 mine tab，未回答数量）
    if (state.tab === 'mine' && state.page === 1) {
      var unanswered = qs.filter(function(q) { return !q.answered_at; }).length;
      if (unanswered > 0) {
        dom.tabBadge.style.display = 'inline-block';
        dom.tabBadge.textContent = unanswered;
      } else {
        dom.tabBadge.style.display = 'none';
      }
    }
  } catch (e) {
    console.error(e);
    if (state.page === 1) {
      dom.feedList.innerHTML = renderEmpty('😿', '加载失败', '网络似乎出了问题，请稍后重试');
    }
    toast('加载失败', 'err');
  } finally {
    state.isLoading = false;
    hideLoader();
    dom.feedList.classList.remove('loading');
  }
}

// ── Submit question ──
async function submitQuestion() {
  var content = dom.askInput.value.trim();
  if (!content) { showErr('请输入问题'); dom.askInput.focus(); return; }
  if (content.length > 500) { showErr('问题不能超过500字'); return; }

  dom.askSend.disabled = true;
  clearErr();

  try {
    // 确定 targetId：优先 URL 参数，其次当前登录用户（但自己不能问自己）
    var tid = state.targetId;
    if (state.isOwnerView) {
      // 拥有者不能问自己，但理论上已被 UI 拦截
      tid = null;
    }
    var body = {
      content: content,
      is_anonymous: dom.anonCheck.checked ? 1 : 0,
      target_id: tid || null
    };
    var r = await fetch('/askbox', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.message || errData.error || '提交失败');
    }
    dom.askInput.value = '';
    updateCharCount();
    toast('提问成功，等待回答 ✨', 'ok');

    // 刷新列表
    await loadFeed(true);

    // 如果是在别人提问箱，回到 mine tab
    if (state.targetId && state.tab !== 'mine') {
      switchTab('mine');
    }
  } catch (e) {
    showErr(e.message || '提交失败，请稍后重试');
  } finally {
    dom.askSend.disabled = false;
  }
}

// ── Error ──
function showErr(msg) { dom.askErr.textContent = msg; dom.askErr.classList.add('show'); }
function clearErr() { dom.askErr.textContent = ''; dom.askErr.classList.remove('show'); }

// ── Char count ──
function updateCharCount() {
  var l = dom.askInput.value.length;
  dom.askChars.textContent = l + '/500';
  dom.askChars.className = 'ask-chars' + (l > 480 ? ' danger' : l > 400 ? ' warn' : '');
}

// ── Tab switch ──
function switchTab(tab) {
  // 未登录且无 ?u= 时，mine tab 被拦截显示登录引导
  if (tab === 'mine' && !Auth.isLoggedIn() && !state.targetId) {
    Auth.showLoginModal();
    return;
  }
  if (state.tab === tab) return;
  state.tab = tab;
  QA('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'square') {
    dom.tabBadge.style.display = 'none';
  }
  loadFeed(true);
}

// ── Share overlay ──
function openShare() {
  if (!Auth.isLoggedIn()) {
    Auth.showLoginModal();
    return;
  }
  updateShareLink();
  dom.overlay.classList.add('show');
}

function closeShare() {
  dom.overlay.classList.remove('show');
}

async function copyShareLink() {
  try {
    await navigator.clipboard.writeText(getShareUrl());
    toast('链接已复制', 'ok');
  } catch (e) {
    // fallback
    var ta = document.createElement('textarea');
    ta.value = getShareUrl();
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('链接已复制', 'ok');
  }
}

function shareTo(platform) {
  var url = getShareUrl();
  var title = '我的轻匿提问箱 - 有什么想问的吗？';
  var text = '有什么想问的吗？匿名提问，温柔回应…';

  switch (platform) {
    case 'wechat':
      // 微信需要先复制链接
      copyShareLink().then(function() {
        setTimeout(function() {
          toast('链接已复制，打开微信粘贴发送', 'ok');
        }, 300);
      });
      break;
    case 'qq':
      window.open('https://connect.qq.com/widget/shareqq/index.html?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(title) + '&desc=' + encodeURIComponent(text), '_blank', 'width=600,height=400');
      break;
    case 'weibo':
      window.open('https://service.weibo.com/share/share.php?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(title + ' ' + text), '_blank', 'width=600,height=400');
      break;
    case 'link':
      copyShareLink();
      break;
  }
  closeShare();
}

// ── Event bindings ──
dom.askInput.addEventListener('input', function() {
  updateCharCount();
  clearErr();
});

dom.askSend.addEventListener('click', submitQuestion);

dom.askInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitQuestion();
  }
  if (e.key === 'Escape') {
    dom.askInput.blur();
  }
});

// 快捷提问
dom.quickChips.addEventListener('click', function(e) {
  var chip = e.target.closest('.chip');
  if (!chip) return;
  dom.askInput.value = chip.dataset.text;
  updateCharCount();
  clearErr();
  dom.askInput.focus();
  dom.askInput.setSelectionRange(dom.askInput.value.length, dom.askInput.value.length);
});

// Tab
QA('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    switchTab(btn.dataset.tab);
  });
});

// Share buttons
Q('#btnShareTop').addEventListener('click', openShare);
Q('#btnShareProfile').addEventListener('click', openShare);
Q('#btnCloseSheet').addEventListener('click', closeShare);
Q('#btnCopyLink').addEventListener('click', copyShareLink);

// Overlay backdrop
dom.overlay.addEventListener('click', function(e) {
  if (e.target === dom.overlay) closeShare();
});

// Platform share buttons
QA('.sheet-pf-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    shareTo(btn.dataset.pf);
  });
});

// Infinite scroll
var scrollLock = false;
window.addEventListener('scroll', function() {
  if (scrollLock) return;
  scrollLock = true;
  requestAnimationFrame(function() {
    scrollLock = false;
    if (state.isLoading || !state.hasMore) return;
    var scrolled = window.innerHeight + window.scrollY;
    var threshold = document.documentElement.scrollHeight - 400;
    if (scrolled >= threshold) {
      state.page++;
      loadFeed(false);
    }
  });
}, { passive: true });

// ── Init ──
function init() {
  initTarget();
  updateCharCount();

  // 访问别人提问箱（?u=xxx），直接加载，不受登录状态影响
  if (state.targetId && !state.isOwnerView) {
    loadFeed(true);
  } else {
    // 等待 auth.js 初始化完成再同步
    if (Auth.isLoggedIn()) {
      syncWithAuth();
    } else {
      loadFeed(true);
    }
  }

  // 监听登录状态变化
  Auth.onAuthChange(function(user) {
    // 如果已经在访问别人的提问箱，不切换
    var p = new URLSearchParams(location.search);
    if (p.get('u')) return;

    if (user) {
      syncWithAuth();
    } else {
      state.targetId = null;
      state.isOwnerView = false;
      dom.profileName.textContent = '我的提问箱';
      dom.profileAvatar.textContent = '?';
      dom.askArea.style.opacity = '1';
      dom.askArea.style.pointerEvents = 'auto';
      if (state.tab === 'mine') {
        state.tab = 'square';
        QA('.tab-btn').forEach(function(b) {
          b.classList.toggle('active', b.dataset.tab === 'square');
        });
      }
      loadFeed(true);
    }
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

fetch('/api/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'qa'})}).catch(function(){});
})();
</script>
</body>
